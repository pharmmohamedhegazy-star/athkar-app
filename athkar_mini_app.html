<!DOCTYPE html>
<html dir="rtl" lang="ar" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>مُذَكِّرٌ — الأذكار والورد اليومي</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#FAF6EF; --card:#FFFDF8; --primary:#1E5B45; --primary-soft:rgba(30,91,69,.08);
    --gold:#C9A227; --text:#22302A; --muted:#6B7A70; --border:rgba(30,91,69,.13);
    --done-bg:#EAF3EC; --done-border:rgba(30,91,69,.35);
    --shadow:0 6px 20px rgba(34,48,42,.06);
    --header-bg:rgba(250,246,239,.9);
  }
  [data-theme="dark"]{
    --bg:#0C1410; --card:#15211B; --primary:#8FC1A6; --primary-soft:rgba(143,193,166,.13);
    --gold:#C9A227; --text:#EDE8DC; --muted:#9DB4A6; --border:rgba(143,193,166,.18);
    --done-bg:#182A20; --done-border:rgba(143,193,166,.4);
    --shadow:none;
    --header-bg:rgba(12,20,16,.9);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; background:var(--bg); color:var(--text); text-align:right;
    font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
    transition:background-color .3s ease, color .3s ease;
    padding-bottom:calc(86px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:560px; margin:0 auto; padding:0 16px;}

  /* ===== الرأس ===== */
  header{
    position:sticky; top:0; z-index:50; background:var(--header-bg);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }
  .header-in{
    max-width:560px; margin:0 auto; padding:12px 16px;
    display:flex; flex-direction:row; direction:rtl; align-items:center; justify-content:space-between;
  }
  /* الاسم عند بداية السطر (اليمين في RTL) وزر الوضع الليلي عند نهايته (اليسار) */
  .brand{order:1;}
  .icon-btn{order:2;}
  .brand{font-size:21px; font-weight:700; color:var(--primary); letter-spacing:.2px;}
  .icon-btn{
    width:44px; height:44px; border-radius:50%; border:1px solid var(--border);
    background:var(--card); color:var(--primary); cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:19px;
    transition:transform .15s ease, background-color .3s ease;
  }
  .icon-btn:active{transform:scale(.92);}

  /* ===== رأس القسم والتقدم ===== */
  .sec-head{padding:22px 0 6px;}
  .sec-title{font-size:20px; font-weight:700; margin:0 0 4px;}
  .sec-date{font-size:13px; color:var(--muted); margin:0 0 12px;}
  .progress-row{display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .progress-text{font-size:13.5px; color:var(--muted); font-weight:600;}
  .reset-btn{
    border:none; background:none; color:var(--primary); cursor:pointer;
    font-family:inherit; font-size:13px; font-weight:600; padding:8px 4px; min-height:44px;
  }
  .bar{height:5px; border-radius:99px; background:var(--primary-soft); margin-top:8px; overflow:hidden;}
  .bar > i{display:block; height:100%; border-radius:99px; background:var(--primary); width:0; transition:width .35s ease;}
  .done-banner{
    scroll-margin-top:84px;
    margin-top:14px; padding:12px 16px; border-radius:14px; text-align:right;
    background:var(--done-bg); border:1px solid var(--done-border);
    color:var(--primary); font-weight:700; font-size:15px;
  }

  /* ===== البطاقات ===== */
  .cards{display:flex; flex-direction:column; gap:14px; padding:14px 0 8px;}
  .card{
    scroll-margin-top:84px;
    background:var(--card); border:1px solid var(--border); border-radius:18px;
    box-shadow:var(--shadow); padding:18px; cursor:pointer; user-select:none;
    display:flex; gap:14px; align-items:stretch;
    transition:background-color .3s ease, border-color .3s ease, transform .1s ease;
  }
  .card:active{transform:scale(.99);}
  .card.done{background:var(--done-bg); border-color:var(--done-border); cursor:default;}
  .card-main{flex:1; min-width:0;}
  .card-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px;}
  .card-title{font-size:15px; font-weight:700; color:var(--primary); margin:0;}
  .chip{
    font-size:11.5px; font-weight:600; color:var(--muted);
    border:1px solid var(--border); border-radius:99px; padding:2px 9px;
  }
  .done-badge{
    display:none; font-size:11.5px; font-weight:700; color:var(--primary);
    background:var(--primary-soft); border-radius:99px; padding:2px 9px;
  }
  .card.done .done-badge{display:inline-block;}
  .card.done .chip{display:none;}
  .dhikr{
    font-family:'Amiri',serif; font-size:21px; line-height:2.1; margin:0;
    color:var(--text); white-space:pre-line;
  }
  .virtue{font-size:12.5px; line-height:1.9; color:var(--muted); margin:10px 0 0;}
  .virtue::before{content:"✦ "; color:var(--gold);}
  /* محاذاة يمين صريحة لكل المحتوى النصي (طلب المالك) — يبقى في المنتصف فقط:
     رقم «المتبقي» داخل دائرته (flex)، وشارة رقم صفحة المصحف، وعناوين شريط التنقل (flex) */
  .sec-title,.sec-date,.card-title,.dhikr,.virtue,.read-head,.read-text,
  .progress-text,.q-head-title,.q-head-pos,.q-field,.q-error{text-align:right;}
  .counter{
    flex:0 0 auto; align-self:center; width:66px; height:66px; border-radius:50%;
    border:2px solid var(--primary); color:var(--primary);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:var(--primary-soft);
  }
  .counter .rem{font-size:21px; font-weight:700; line-height:1.1;}
  .counter .rem-label{font-size:10px; font-weight:600; color:var(--muted);}
  .card.done .counter{border-color:var(--done-border); background:transparent; font-size:24px;}
  .read-card{cursor:default;}
  .read-card:active{transform:none;}
  .read-head{font-size:16px; font-weight:700; color:var(--primary); margin:0 0 10px;}
  .read-text{font-family:'Amiri',serif; font-size:20px; line-height:2.1; white-space:pre-line; margin:0;}

  /* ===== شريط التنقل السفلي ===== */
  nav{
    position:fixed; bottom:0; inset-inline:0; z-index:50;
    background:var(--card); border-top:1px solid var(--border);
    padding-bottom:env(safe-area-inset-bottom);
    transition:background-color .3s ease;
  }
  .nav-in{max-width:560px; margin:0 auto; display:flex; direction:rtl;}
  .nav-btn{
    flex:1; border:none; background:none; cursor:pointer; font-family:inherit;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:9px 0 7px; min-height:56px; color:var(--muted);
    font-size:11px; font-weight:600; transition:color .2s ease; white-space:nowrap;
  }
  .nav-btn svg{width:23px; height:23px;}
  .nav-btn.active{color:var(--primary);}
  .nav-btn.active .nav-ico{
    background:var(--primary-soft); border-radius:99px; padding:3px 9px;
  }
  .nav-ico{display:flex; padding:3px 9px; border-radius:99px; transition:background-color .2s ease;}

  /* ===== المصحف ===== */
  .q-actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;}
  .q-btn{
    border:1px solid var(--border); background:var(--card); color:var(--primary);
    font-family:inherit; font-size:14px; font-weight:700; cursor:pointer;
    border-radius:99px; padding:10px 20px; min-height:44px;
    transition:transform .12s ease, background-color .3s ease;
  }
  .q-btn:active{transform:scale(.97);}
  .q-btn.primary{background:var(--primary); border-color:var(--primary); color:#FFFDF8;}
  [data-theme="dark"] .q-btn.primary{color:#0C1410;}
  .q-btn[disabled]{opacity:.4; cursor:default;}
  .q-btn[disabled]:active{transform:none;}
  .q-inputs{display:flex; gap:12px; flex-wrap:wrap; margin-top:6px;}
  .q-field{display:flex; flex-direction:column; gap:6px; font-size:13px; font-weight:600; color:var(--muted);}
  .q-input{
    width:118px; padding:10px; border-radius:12px; border:1px solid var(--border);
    background:var(--card); color:var(--text); font-family:inherit; font-size:16px; text-align:right;
  }
  .q-error{color:#B3261E; font-size:13px; font-weight:600; margin:10px 0 0; display:none;}
  .q-start-chip{
    display:inline-block; margin-top:14px; border:1px dashed var(--done-border);
    background:var(--primary-soft); color:var(--primary); border-radius:99px;
    font-family:inherit; font-size:13px; font-weight:700; padding:8px 16px; cursor:pointer; min-height:40px;
  }
  .q-head{
    position:sticky; top:69px; z-index:40; margin-top:16px;
    background:var(--header-bg); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border:1px solid var(--border); border-radius:14px; padding:10px 14px 12px;
  }
  .q-head-row{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .q-head-title{font-size:15px; font-weight:700; color:var(--primary); margin:0;}
  .q-head-pos{font-size:13px; font-weight:600; color:var(--muted); margin:0;}
  .q-head .bar{margin-top:9px;}
  .q-head-btns{display:flex; gap:8px; margin-top:10px;}
  .q-head-btns .q-btn{padding:7px 16px; min-height:40px; font-size:13.5px; flex:1;}
  .q-page{scroll-margin-top:158px; margin-top:16px;}
  .q-chip{
    display:inline-block; font-size:12px; font-weight:700; color:var(--primary);
    background:var(--primary-soft); border:1px solid var(--border);
    border-radius:99px; padding:3px 12px; margin-bottom:8px;
  }
  .q-page-card{
    background:#FFFDF7; border:1px solid rgba(30,91,69,.15); border-radius:18px;
    box-shadow:0 6px 20px rgba(34,48,42,.08); padding:10px;
  }
  .q-img-wrap{position:relative; border-radius:10px; overflow:hidden; background:#F1EAD9;}
  .q-img-wrap.loading::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(100deg, rgba(255,255,255,0) 30%, rgba(255,255,255,.55) 50%, rgba(255,255,255,0) 70%);
    background-size:200% 100%; animation:qshimmer 1.3s infinite linear;
  }
  @keyframes qshimmer{from{background-position:180% 0;} to{background-position:-80% 0;}}
  .q-page-img{display:block; width:100%; height:auto; aspect-ratio:1260/2038; opacity:0; transition:opacity .35s ease;}
  .q-page-img.loaded{opacity:1;}
  .q-img-fallback{
    padding:34px 16px; text-align:right; color:#6B7A70;
    font-size:14px; font-weight:600; line-height:2;
  }
  .q-img-fallback .q-btn{border-color:rgba(30,91,69,.3); color:#1E5B45; background:transparent; margin-top:8px;}
  .q-end{margin:18px 0 6px; text-align:right;}
  .q-end .q-btn{margin-top:12px;}
  footer{padding:10px 0 4px; text-align:right; color:var(--muted); font-size:12px;}
</style>
</head>
<body>
<header>
  <div class="header-in">
    <div class="brand">🌿 مُذَكِّرٌ</div>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="تبديل الوضع الليلي">🌙</button>
  </div>
</header>

<main class="wrap">
  <div id="content"></div>
  <footer>مُذَكِّرٌ — رفيق وردك اليومي</footer>
</main>

<nav>
  <div class="nav-in">
    <button class="nav-btn" type="button" data-tab="morning">
      <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
      <span>الصباح</span>
    </button>
    <button class="nav-btn" type="button" data-tab="evening">
      <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M17 18a5 5 0 0 0-10 0"/><path d="M12 6v3M4.2 10.2l1.4 1.4M1 18h2M21 18h2M18.4 11.6l1.4-1.4M23 22H1M8 6a4 4 0 0 1 8 0"/></svg></span>
      <span>المساء</span>
    </button>
    <button class="nav-btn" type="button" data-tab="sleep">
      <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span>
      <span>النوم</span>
    </button>
    <button class="nav-btn" type="button" data-tab="quran">
      <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5C10 5 7.4 4.4 4 4.4v13.7c3.4 0 6 .6 8 2.1 2-1.5 4.6-2.1 8-2.1V4.4c-3.4 0-6 .6-8 2.1z"/><path d="M12 6.5v13.7"/></svg></span>
      <span>المصحف</span>
    </button>
    <button class="nav-btn" type="button" data-tab="wird">
      <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4a2 2 0 0 0-2-2H6.5A2.5 2.5 0 0 0 4 4.5v15z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg></span>
      <span>فائدة اليوم</span>
    </button>
    <button class="nav-btn" type="button" data-tab="misc">
      <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4l1.5 4.1L16.6 9.6l-4.1 1.5L11 15.2l-1.5-4.1L5.4 9.6l4.1-1.5z"/><path d="M18.6 14.6l.9 2.3 2.3.9-2.3.9-.9 2.3-.9-2.3-2.3-.9 2.3-.9z"/></svg></span>
      <span>متفرّقة</span>
    </button>
  </div>
</nav>

<script>

const TABS = ["morning", "evening", "sleep", "quran", "wird", "misc"];
const COUNTER_SECTIONS = ["morning", "evening", "sleep", "misc"];
const COUNTS_KEY = "mudhakir_counts_v1";
const THEME_KEY = "mudhakir_theme_v1";
const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;

/* ================= أدوات ================= */
const AR_DIGITS = ["٠","١","٢","٣","٤","٥","٦","٧","٨","٩"];
function toAr(n){ return String(n).replace(/[0-9]/g, d => AR_DIGITS[+d]); }
function todayKey(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function dayOfYear(){
  const now = new Date();
  return Math.floor((now - new Date(now.getFullYear(),0,0)) / 86400000);
}
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function haptic(type){
  try{
    if (tg && tg.HapticFeedback){
      if (type === "success") tg.HapticFeedback.notificationOccurred("success");
      else tg.HapticFeedback.impactOccurred("light");
    }
  }catch(e){/* بيئة غير تليجرام */}
}

/* ================= حالة العدادات ================= */
let counts = {};
function allItems(){
  const list = [];
  COUNTER_SECTIONS.forEach(cat => ATHKAR_DATA[cat].items.forEach(it => list.push(it)));
  ATHKAR_DATA.wird.items.forEach(it => list.push(it)); // w3 يُستخدم يوم الجمعة
  return list;
}
function initCounts(){
  counts = {};
  allItems().forEach(it => { counts[it.id] = it.target; });
  try{
    const saved = JSON.parse(localStorage.getItem(COUNTS_KEY) || "null");
    if (saved && saved.date === todayKey() && saved.state){
      Object.keys(counts).forEach(id => {
        const v = saved.state[id];
        if (typeof v === "number" && v >= 0) counts[id] = v;
      });
    }
  }catch(e){/* التخزين غير متاح */}
}
function persistCounts(){
  try{ localStorage.setItem(COUNTS_KEY, JSON.stringify({ date: todayKey(), state: counts })); }
  catch(e){/* التخزين غير متاح */}
}

/* ================= المظهر (الوضع الليلي) ================= */
function systemTheme(){
  if (tg && tg.colorScheme) return tg.colorScheme;
  if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) return "dark";
  return "light";
}
function applyTheme(theme){
  document.documentElement.setAttribute("data-theme", theme);
  document.getElementById("themeBtn").textContent = theme === "dark" ? "☀️" : "🌙";
  try{
    if (tg && tg.setHeaderColor) tg.setHeaderColor(theme === "dark" ? "#0C1410" : "#FAF6EF");
    if (tg && tg.setBackgroundColor) tg.setBackgroundColor(theme === "dark" ? "#0C1410" : "#FAF6EF");
  }catch(e){/* إصدار تليجرام أقدم */}
}
function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem(THEME_KEY); }catch(e){}
  applyTheme(saved === "dark" || saved === "light" ? saved : systemTheme());
  document.getElementById("themeBtn").addEventListener("click", () => {
    const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    applyTheme(next);
    try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
  });
  if (tg && tg.onEvent){
    tg.onEvent("themeChanged", () => {
      let manual = null;
      try{ manual = localStorage.getItem(THEME_KEY); }catch(e){}
      if (!manual) applyTheme(systemTheme());
    });
  }
}

/* ================= العرض ================= */
let currentTab = "morning";
const contentEl = document.getElementById("content");

function chipText(item){
  return item.target === 1 ? "مرة واحدة" : "العدد: " + toAr(item.target);
}
function cardHTML(item){
  const rem = counts[item.id];
  const done = rem === 0;
  return '' +
  '<article class="card' + (done ? ' done' : '') + '" data-id="' + item.id + '" role="button" tabindex="0" aria-label="' + esc(item.title) + '">' +
    '<div class="card-main">' +
      '<div class="card-top"><h3 class="card-title">' + esc(item.title) + '</h3>' +
      '<span class="chip">' + chipText(item) + '</span>' +
      '<span class="done-badge">✓ تم بحمد الله</span></div>' +
      '<p class="dhikr">' + esc(item.text) + '</p>' +
      (item.virtue ? '<p class="virtue">' + esc(item.virtue) + '</p>' : '') +
    '</div>' +
    '<div class="counter">' + (done ? '<span>✓</span>' :
      '<span class="rem">' + toAr(rem) + '</span><span class="rem-label">المتبقي</span>') + '</div>' +
  '</article>';
}
function sectionProgress(cat){
  const items = ATHKAR_DATA[cat].items;
  const done = items.filter(it => counts[it.id] === 0).length;
  return { done: done, total: items.length };
}
function dateLine(){
  try{
    return new Intl.DateTimeFormat("ar-EG", { weekday: "long", day: "numeric", month: "long", year: "numeric" }).format(new Date());
  }catch(e){ return ""; }
}
function renderSection(cat){
  const data = ATHKAR_DATA[cat];
  const p = sectionProgress(cat);
  let html = '<div class="sec-head"><h2 class="sec-title">' + esc(data.title) + '</h2>' +
    '<p class="sec-date">' + esc(dateLine()) + '</p>' +
    '<div class="progress-row"><span class="progress-text">أتممتَ ' + toAr(p.done) + ' من ' + toAr(p.total) + '</span>' +
    '<button class="reset-btn" type="button" id="resetBtn">↺ إعادة هذا القسم</button></div>' +
    '<div class="bar"><i style="width:' + (p.total ? (p.done / p.total) * 100 : 0) + '%"></i></div>' +
    (p.done === p.total ? '<div class="done-banner" id="doneBanner">أتممتَ ' + esc(data.title) + ' — تقبّل الله منك 🤲</div>' : '') +
    '</div><div class="cards">';
  data.items.forEach(it => { html += cardHTML(it); });
  html += '</div>';
  contentEl.innerHTML = html;
  bindCards();
  document.getElementById("resetBtn").addEventListener("click", () => {
    data.items.forEach(it => { counts[it.id] = it.target; });
    persistCounts(); renderSection(cat);
  });
}
function renderWird(){
  const idx = dayOfYear() % WIRD_DAYS.length;
  const day = WIRD_DAYS[idx];
  const friday = new Date().getDay() === 5;
  const sunan = ATHKAR_DATA.wird.items.find(it => it.id === "w3");
  let html = '<div class="sec-head"><h2 class="sec-title">فائدة اليوم</h2>' +
    '<p class="sec-date">' + esc(dateLine()) + '</p></div><div class="cards">';
  html += '<article class="card read-card"><div class="card-main">' +
    '<h3 class="read-head">📖 ورد اليوم</h3><p class="read-text">' + esc(day.wird) + '</p></div></article>';
  html += '<article class="card read-card"><div class="card-main">' +
    '<h3 class="read-head">✨ حديث اليوم</h3><p class="read-text">' + esc(day.hadith) + '</p></div></article>';
  if (friday && sunan){
    html += cardHTML(sunan);
  }
  html += '</div>';
  contentEl.innerHTML = html;
  if (friday && sunan) bindCards();
}
function bindCards(){
  contentEl.querySelectorAll(".card[data-id]").forEach(card => {
    const act = () => tapItem(card.getAttribute("data-id"));
    card.addEventListener("click", act);
    card.addEventListener("keydown", ev => {
      if (ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); act(); }
    });
  });
}
function tapItem(id){
  if (counts[id] === undefined || counts[id] <= 0) return;
  counts[id] -= 1;
  persistCounts();
  const justDone = counts[id] === 0;
  if (justDone) haptic("success"); else haptic("light");
  if (currentTab === "wird") renderWird(); else renderSection(currentTab);
  if (justDone) scheduleAdvance();
}
/* بعد إتمام ذكر: مرّر بلطف إلى البطاقة التالية غير المكتملة في القسم نفسه،
   فإن اكتمل القسم كله مرّر إلى لافتة الإتمام. تُنفَّذ دائماً بلطف (scroll-behavior smooth)
   مع scroll-margin-top على البطاقات واللافتة لمراعاة ارتفاع الرأس الثابت. */
function scheduleAdvance(){
  setTimeout(() => {
    const cards = contentEl.querySelectorAll(".card[data-id]");
    for (let i = 0; i < cards.length; i++){
      const cid = cards[i].getAttribute("data-id");
      if (counts[cid] > 0){ cards[i].scrollIntoView({ behavior: "smooth", block: "start" }); return; }
    }
    const banner = contentEl.querySelector(".done-banner");
    if (banner) banner.scrollIntoView({ behavior: "smooth", block: "start" });
  }, 450);
}
function switchTab(tab){
  if (tab === "mushaf") tab = "quran";
  if (!TABS.includes(tab)) tab = "morning";
  if (currentTab === "quran" && tab !== "quran"){
    stopQuranObserver();
    if (qCurrent != null){ mushaf.lastPage = qCurrent; persistMushaf(); }
    quranMode = "home";
  }
  currentTab = tab;
  document.querySelectorAll(".nav-btn").forEach(b =>
    b.classList.toggle("active", b.getAttribute("data-tab") === tab));
  if (tab === "wird") renderWird();
  else if (tab === "quran") renderQuran();
  else renderSection(tab);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ================= المصحف (ورد القرآن) =================
   مصدر الصور (مُتحقق منه حياً): صفحات مصحف المدينة برواية حفص، مولّدة بمولّد
   quran.com الرسمي — https://cdn.jsdelivr.net/gh/akram-seid/quran-hd-images@main/images/{NNN}.jpg
   (NNN برقم الصفحة مُصفّراً لثلاث خانات، المقاس 1260×2038؛ صفحات 001 و300 و604
   أجابت 200 image/jpeg، والترقيم مطابق: 001 الفاتحة و002 أول البقرة).
   ملحوظة: مصدر PNG الأصلي (cdn.islamic.network) محجوب حالياً (403)، فهذا مصدر JPG مُتحقق منه. */
const MUSHAF_KEY = "mudhakir_mushaf_v1";
const QIMG_BASES = [
  "https://cdn.jsdelivr.net/gh/akram-seid/quran-hd-images@main/images/",
  "https://raw.githubusercontent.com/akram-seid/quran-hd-images/main/images/"
];
let mushaf = { from: null, to: null, lastPage: null };
let quranMode = "home"; /* home | setup | read */
let qCurrent = null;
let qObserver = null;
let qSaveTimer = null;

function quranImgUrl(p, b){ return QIMG_BASES[b || 0] + String(p).padStart(3, "0") + ".jpg"; }
function validRange(f, t){
  return Number.isInteger(f) && Number.isInteger(t) && f >= 1 && t <= 604 && f <= t;
}
function clampToRange(p, f, t){
  p = parseInt(p, 10);
  if (!p || p < f) return f;
  if (p > t) return t;
  return p;
}
function loadMushaf(){
  try{
    const s = JSON.parse(localStorage.getItem(MUSHAF_KEY) || "null");
    if (s && validRange(s.from, s.to)){
      mushaf = { from: s.from, to: s.to, lastPage: clampToRange(s.lastPage, s.from, s.to) };
    }
  }catch(e){/* التخزين غير متاح */}
}
function persistMushaf(){
  try{ localStorage.setItem(MUSHAF_KEY, JSON.stringify(mushaf)); }catch(e){/* التخزين غير متاح */}
}
function scheduleMushafSave(){
  mushaf.lastPage = qCurrent;
  if (qSaveTimer) return;
  qSaveTimer = setTimeout(() => { qSaveTimer = null; persistMushaf(); }, 600);
}
function stopQuranObserver(){
  if (qObserver){ qObserver.disconnect(); qObserver = null; }
}
function quranProgressPct(){
  if (!mushaf.from || qCurrent == null) return 0;
  const total = mushaf.to - mushaf.from + 1;
  return Math.round(((qCurrent - mushaf.from + 1) / total) * 100);
}
function renderQuran(){
  stopQuranObserver();
  if (quranMode === "read" && mushaf.from) renderQuranReader();
  else if (quranMode === "setup") renderQuranSetup();
  else renderQuranHome();
}
function quranSetupHTML(){
  return '<article class="card read-card"><div class="card-main">' +
    '<h3 class="read-head">📖 تعيين ورد القرآن</h3>' +
    '<p class="read-text">اختر مدى صفحات وردك من مصحف المدينة (من ١ إلى ٦٠٤):</p>' +
    '<div class="q-inputs">' +
    '<label class="q-field">من صفحة<input class="q-input" id="qFrom" type="number" inputmode="numeric" min="1" max="604" value="' + (mushaf.from || "") + '"></label>' +
    '<label class="q-field">إلى صفحة<input class="q-input" id="qTo" type="number" inputmode="numeric" min="1" max="604" value="' + (mushaf.to || "") + '"></label>' +
    '</div>' +
    '<p class="q-error" id="qError">من فضلك أدخل مدى صفحات صحيحاً بين ١ و٦٠٤.</p>' +
    '<div class="q-actions"><button class="q-btn primary" type="button" id="qStart">ابدأ القراءة</button></div>' +
    '<button class="q-start-chip" type="button" id="qFromStart">من أول المصحف</button>' +
    '</div></article>';
}
function bindQuranSetup(){
  const fromEl = document.getElementById("qFrom");
  const toEl = document.getElementById("qTo");
  document.getElementById("qFromStart").addEventListener("click", () => { fromEl.value = 1; toEl.focus(); });
  document.getElementById("qStart").addEventListener("click", () => {
    const f = parseInt(fromEl.value, 10);
    const t = parseInt(toEl.value, 10);
    if (!validRange(f, t)){
      document.getElementById("qError").style.display = "block";
      return;
    }
    mushaf = { from: f, to: t, lastPage: f };
    persistMushaf();
    quranMode = "read";
    renderQuranReader(f);
  });
}
function renderQuranSetup(){
  contentEl.innerHTML = '<div class="sec-head"><h2 class="sec-title">المصحف — ورد القرآن</h2>' +
    '<p class="sec-date">' + esc(dateLine()) + '</p></div><div class="cards">' + quranSetupHTML() + '</div>';
  bindQuranSetup();
}
function renderQuranHome(){
  let html = '<div class="sec-head"><h2 class="sec-title">المصحف — ورد القرآن</h2>' +
    '<p class="sec-date">' + esc(dateLine()) + '</p></div><div class="cards">';
  if (mushaf.from){
    const last = mushaf.lastPage || mushaf.from;
    html += '<article class="card read-card"><div class="card-main">' +
      '<h3 class="read-head">📖 وردك الحالي</h3>' +
      '<p class="read-text">صفحات ' + toAr(mushaf.from) + ' – ' + toAr(mushaf.to) +
      '\nآخر موضع وصلت إليه: صفحة ' + toAr(last) + '</p>' +
      '<div class="q-actions">' +
      '<button class="q-btn primary" type="button" id="qResume">أكمل القراءة</button>' +
      '<button class="q-btn" type="button" id="qChange">غيّر الورد</button>' +
      '</div></div></article>';
  } else {
    html += quranSetupHTML();
  }
  html += '</div>';
  contentEl.innerHTML = html;
  if (mushaf.from){
    document.getElementById("qResume").addEventListener("click", () => {
      quranMode = "read"; renderQuranReader(mushaf.lastPage || mushaf.from);
    });
    document.getElementById("qChange").addEventListener("click", () => {
      quranMode = "setup"; renderQuran();
    });
  } else {
    bindQuranSetup();
  }
}
function mountQuranImg(wrap, p, attempt){
  attempt = attempt || 0;
  wrap.classList.add("loading");
  wrap.innerHTML = "";
  const img = document.createElement("img");
  img.className = "q-page-img";
  img.setAttribute("loading", "lazy");
  img.setAttribute("decoding", "async");
  img.alt = "صفحة " + toAr(p) + " من المصحف";
  img.addEventListener("load", () => { img.classList.add("loaded"); wrap.classList.remove("loading"); });
  img.addEventListener("error", () => {
    if (attempt < QIMG_BASES.length - 1){ mountQuranImg(wrap, p, attempt + 1); return; }
    wrap.classList.remove("loading");
    wrap.innerHTML = '<div class="q-img-fallback">تعذّر تحميل الصفحة — تحقق من الاتصال<br>' +
      '<button class="q-btn" type="button">إعادة المحاولة</button></div>';
    wrap.querySelector("button").addEventListener("click", () => mountQuranImg(wrap, p, 0));
  });
  img.src = quranImgUrl(p, attempt);
  wrap.appendChild(img);
}
function updateQuranHead(){
  const pos = document.getElementById("qPos");
  if (!pos || qCurrent == null) return;
  pos.textContent = "الصفحة " + toAr(qCurrent) + " من " + toAr(mushaf.to);
  document.getElementById("qBar").style.width = quranProgressPct() + "%";
  document.getElementById("qPrev").disabled = qCurrent <= mushaf.from;
  document.getElementById("qNext").disabled = qCurrent >= mushaf.to;
}
function quranGoTo(p){
  const el = document.getElementById("qp" + clampToRange(p, mushaf.from, mushaf.to));
  if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
}
function renderQuranReader(startAt){
  stopQuranObserver();
  const f = mushaf.from, t = mushaf.to;
  qCurrent = clampToRange(startAt != null ? startAt : (mushaf.lastPage || f), f, t);
  let html = '<div class="q-head"><div class="q-head-row">' +
    '<p class="q-head-title">ورد القرآن — صفحات ' + toAr(f) + ' – ' + toAr(t) + '</p>' +
    '<p class="q-head-pos" id="qPos"></p></div>' +
    '<div class="bar"><i id="qBar"></i></div>' +
    '<div class="q-head-btns">' +
    '<button class="q-btn" type="button" id="qPrev">السابق</button>' +
    '<button class="q-btn" type="button" id="qExit">إنهاء</button>' +
    '<button class="q-btn" type="button" id="qNext">التالي</button>' +
    '</div></div><div id="qPages">';
  for (let p = f; p <= t; p++){
    html += '<section class="q-page" data-page="' + p + '" id="qp' + p + '">' +
      '<span class="q-chip">صفحة ' + toAr(p) + '</span>' +
      '<div class="q-page-card"><div class="q-img-wrap loading" data-wrap="' + p + '"></div></div>' +
      '</section>';
  }
  html += '</div>' +
    '<div class="done-banner q-end">أتممت ورد القرآن اليوم — علّمه في البوت ليُحسب في يومك 🤲' +
    '<div class="q-actions"><button class="q-btn" type="button" id="qEndExit">إنهاء</button></div></div>';
  contentEl.innerHTML = html;
  contentEl.querySelectorAll(".q-img-wrap").forEach(wrap => {
    mountQuranImg(wrap, +wrap.getAttribute("data-wrap"));
  });
  document.getElementById("qPrev").addEventListener("click", () => quranGoTo(qCurrent - 1));
  document.getElementById("qNext").addEventListener("click", () => quranGoTo(qCurrent + 1));
  const exitFn = () => {
    mushaf.lastPage = qCurrent; persistMushaf();
    quranMode = "home"; renderQuran();
    window.scrollTo({ top: 0, behavior: "smooth" });
  };
  document.getElementById("qExit").addEventListener("click", exitFn);
  document.getElementById("qEndExit").addEventListener("click", exitFn);
  updateQuranHead();
  qObserver = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting){
        const p = +en.target.getAttribute("data-page");
        if (p !== qCurrent){ qCurrent = p; updateQuranHead(); scheduleMushafSave(); }
      }
    });
  }, { rootMargin: "-40% 0px -50% 0px", threshold: 0 });
  contentEl.querySelectorAll(".q-page").forEach(el => qObserver.observe(el));
  const target = document.getElementById("qp" + qCurrent);
  if (target) requestAnimationFrame(() => target.scrollIntoView({ block: "start" }));
}

/* ================= التهيئة ================= */
function init(){
  if (tg){ try{ tg.ready(); tg.expand(); }catch(e){} }
  initTheme();
  initCounts();
  loadMushaf();
  document.querySelectorAll(".nav-btn").forEach(b =>
    b.addEventListener("click", () => switchTab(b.getAttribute("data-tab"))));
  let initial = "morning";
  try{
    const params = new URLSearchParams(window.location.search);
    let t = params.get("tab");
    if (t === "mushaf") t = "quran";
    if (t && TABS.includes(t)) initial = t;
    if (t === "quran"){
      const f = parseInt(params.get("from"), 10);
      const tt = parseInt(params.get("to"), 10);
      if (validRange(f, tt)){
        mushaf = { from: f, to: tt, lastPage: f };
        persistMushaf();
        quranMode = "read";
      }
    }
  }catch(e){}
  switchTab(initial);
}
init();
</script>
