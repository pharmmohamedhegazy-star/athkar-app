 },
 {
  "text": "اللَّهُمَّ حَوَالَيْنَا وَلاَ عَلَيْنَا، اللَّهُمَّ عَلَى الآكَامِ وَالظِّرَابِ، وَبُطُونِ الْأَوْدِيَةِ، وَمَنَابِتِ الشَّجَرِ.",
  "category": "الطقس والطبيعة",
  "chapter": "من أدعية الاستصحاء",
  "chapterId": 66,
  "itemId": 174
 },
 {
  "text": "اللَّهُ أَكْبَرُ، اللَّهُمَّ أَهِلَّهُ عَلَيْنَا بِالْأَمْنِ وَالْإِيمَانِ، وَالسَّلاَمَةِ وَالْإِسْلاَمِ، وَالتَّوْفِيقِ لِمَا تُحِبُّ رَبَّنَا وَتَرْضَى، رَبُّنَا وَرَبُّكَ اللَّهُ.",
  "category": "الطقس والطبيعة",
  "chapter": "دعاء رؤية الهلال",
  "chapterId": 67,
  "itemId": 175
 },
 {
  "text": "بَارَكَ اللَّهُ لَكَ فِي الْمَوْهُوبِ لَكَ، وَشَكَرْتَ الْوَاهِبَ، وَبَلَغَ أَشُدَّهُ، وَرُزِقْتَ بِرَّهُ. وَيَرُدُّ عَلَيْهِ الْمُهَــــــنَّأُ فَيَقُولُ: ((بَارَكَ اللَّهُ لَكَ وَبَارَكَ عَلَيْكَ، وَجَزَاكَ اللَّهُ خَيْراً، وَرَزَقَكَ اللَّهُ مِثْلَهُ، وَأَجْزَلَ ثَوَابَكَ)).",
  "category": "متنوعة",
  "chapter": "ﺗﻬنئة المولود له وجوابه",
  "chapterId": 47,
  "itemId": 145
 },
 {
  "text": "كَانَ رَسُولُ اللَّهِ صلى الله عليه وسلم يُعَوِّذُ الحَسَنَ وَالحُسَينَ رضي الله عنهما ((أُعِيذُكُمَا بِكَلِمَاتِ اللَّهِ التَّامَّةِ مِنْ كُلِّ شَيْطَانٍ وَهَامَّةٍ، وَمِنْ كُلِّ عَيْنٍ لاَمَّةٍ)).",
  "category": "متنوعة",
  "chapter": "ما يعوذ به الأولاد",
  "chapterId": 48,
  "itemId": 146
 },
 {
  "text": "بِسْمِ اللَّهِ وَاللَّهُ أَكْبَرُ [اللَّهُمَّ مِنْكَ وَلَكَ] اللَّهُمَّ تَقَبَّلْ مِنِّي.",
  "category": "متنوعة",
  "chapter": "ما يقول عند الذبح أو النحر",
  "chapterId": 127,
  "itemId": 246
 },
 {
  "text": "مَنْ حَفِظَ عَشْرَ آيَاتٍ مِنْ أَوَّلِ سُورَةِ الْكَهْفِ عُصِمَ مِنَ الدَّجَّالِ ، وَالْاسْتِعَاذَةُ بِاللَّهِ مِنْ فِتْنَتِهِ عَقِبَ التَّشَهُّدِ الْأَخِيرِ مِنْ كُلِّ صَلاَةٍ.",
  "category": "متنوعة",
  "chapter": "ما يعصم الله به من الدجال",
  "chapterId": 88,
  "itemId": 199
 },
 {
  "text": "قَالَ النَّبِيُّ صلى الله عليه وسلم ((إِذَا كَانَ جُنْحُ اللَّيْلِ – أَوْ أَمْسَيْتُم – فَـكُفُّوا صِبْيانَـكُم، فَإِنَّ الشَّيَاطِينَ تَنْتَشِرُ حِينَئِذٍ، فَإِذَا ذَهَبَ سَاعَةٌ مِنَ اللَّيلِ فَخَلُّوهُمْ، وَأَغْلِقُوا الأَبْوَابَ وَاذْكُرُوا اسْمَ اللَّهِ؛ فَإِنَّ الشَّيطَانَ لاَ يَفْتَحُ بَاباً مُغلَقاً، وَأَوْكُوا قِرَبَكُمْ، وَاذْكُرُوا اسْمَ اللَّهِ، وَخَمِّرُوا آنِيَتَكُم، وَاذْكُرُوا اسْمَ اللَّهِ، وَلَوْ أَنْ تَعْرُضُوا عَلَيْهَا شَيْئاً، وَأَطْفِئُوا مَصَابِيحَكُمْ)).",
  "category": "متنوعة",
  "chapter": "من أنواع الخير والآداب الجامعة",
  "chapterId": 132,
  "itemId": 267
 },

{"text": "رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ", "category": "أدعية قرآنية", "chapter": "أدعية جامعة", "chapterId": 9001, "itemId": 90002, "source": "(سورة البقرة — من الآية ٢٠١)"},
{"text": "رَبَّنَا لَا تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا ۚ رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِن قَبْلِنَا ۚ رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ ۖ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا ۚ أَنتَ مَوْلَانَا فَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ", "category": "أدعية قرآنية", "chapter": "أدعية جامعة", "chapterId": 9001, "itemId": 90003, "source": "(سورة البقرة — من الآية ٢٨٦)"},

{"text": "رَبِّ إِنِّي أَعُوذُ بِكَ أَنْ أَسْأَلَكَ مَا لَيْسَ لِي بِهِ عِلْمٌ ۖ وَإِلَّا تَغْفِرْ لِي وَتَرْحَمْنِي أَكُن مِّنَ الْخَاسِرِينَ", "category": "أدعية قرآنية", "chapter": "المغفرة والتوبة", "chapterId": 9002, "itemId": 90010, "source": "(سورة هود — من الآية ٤٧)"},

{"text": "رَّبِّ اغْفِرْ وَارْحَمْ وَأَنتَ خَيْرُ الرَّاحِمِينَ", "category": "أدعية قرآنية", "chapter": "المغفرة والتوبة", "chapterId": 9002, "itemId": 90012, "source": "(سورة المؤمنون — من الآية ١١٨)"},

{"text": "رَبَّنَا أَخْرِجْنَا مِنْ هَٰذِهِ الْقَرْيَةِ الظَّالِمِ أَهْلُهَا وَاجْعَل لَّنَا مِن لَّدُنكَ وَلِيًّا وَاجْعَل لَّنَا مِن لَّدُنكَ نَصِيرًا", "category": "أدعية قرآنية", "chapter": "الكرب والاستعاذة", "chapterId": 9003, "itemId": 90016, "source": "(سورة النساء — من الآية ٧٥)"},
{"text": "رَبَّنَا لَا تَجْعَلْنَا مَعَ الْقَوْمِ الظَّالِمِينَ", "category": "أدعية قرآنية", "chapter": "الكرب والاستعاذة", "chapterId": 9003, "itemId": 90017, "source": "(سورة الأعراف — من الآية ٤٧)"},
{"text": "عَلَى اللَّهِ تَوَكَّلْنَا رَبَّنَا لَا تَجْعَلْنَا فِتْنَةً لِّلْقَوْمِ الظَّالِمِينَ وَنَجِّنَا بِرَحْمَتِكَ مِنَ الْقَوْمِ الْكَافِرِينَ", "category": "أدعية قرآنية", "chapter": "الكرب والاستعاذة", "chapterId": 9003, "itemId": 90018, "source": "(سورة يونس — من الآيات ٨٥–٨٦)"},
{"text": "رَبِّ اجْعَلْ هَٰذَا الْبَلَدَ آمِنًا وَاجْنُبْنِي وَبَنِيَّ أَن نَّعْبُدَ الْأَصْنَامَ", "category": "أدعية قرآنية", "chapter": "الكرب والاستعاذة", "chapterId": 9003, "itemId": 90019, "source": "(سورة إبراهيم — من الآية ٣٥)"},
{"text": "أَنِّي مَسَّنِيَ الضُّرُّ وَأَنتَ أَرْحَمُ الرَّاحِمِينَ", "category": "أدعية قرآنية", "chapter": "الكرب والاستعاذة", "chapterId": 9003, "itemId": 90020, "source": "(سورة الأنبياء — من الآية ٨٣)"},
{"text": "لَّا إِلَٰهَ إِلَّا أَنتَ سُبْحَانَكَ إِنِّي كُنتُ مِنَ الظَّالِمِينَ", "category": "أدعية قرآنية", "chapter": "الكرب والاستعاذة", "chapterId": 9003, "itemId": 90021, "source": "(سورة الأنبياء — من الآية ٨٧)"},
{"text": "رَّبِّ إِمَّا تُرِيَنِّي مَا يُوعَدُونَ رَبِّ فَلَا تَجْعَلْنِي فِي الْقَوْمِ الظَّالِمِينَ", "category": "أدعية قرآنية", "chapter": "الكرب والاستعاذة", "chapterId": 9003, "itemId": 90022, "source": "(سورة المؤمنون — من الآيات ٩٣–٩٤)"},
{"text": "رَّبِّ أَعُوذُ بِكَ مِنْ هَمَزَاتِ الشَّيَاطِينِ وَأَعُوذُ بِكَ رَبِّ أَن يَحْضُرُونِ", "category": "أدعية قرآنية", "chapter": "الكرب والاستعاذة", "chapterId": 9003, "itemId": 90023, "source": "(سورة المؤمنون — من الآيات ٩٧–٩٨)"},
{"text": "رَبِّ نَجِّنِي وَأَهْلِي مِمَّا يَعْمَلُونَ", "category": "أدعية قرآنية", "chapter": "الكرب والاستعاذة", "chapterId": 9003, "itemId": 90024, "source": "(سورة الشعراء — الآية ١٦٩)"},
{"text": "رَبِّ نَجِّنِي مِنَ الْقَوْمِ الظَّالِمِينَ", "category": "أدعية قرآنية", "chapter": "الكرب والاستعاذة", "chapterId": 9003, "itemId": 90025, "source": "(سورة القصص — من الآية ٢١)"},
{"text": "قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ مِن شَرِّ مَا خَلَقَ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ", "category": "أدعية قرآنية", "chapter": "الكرب والاستعاذة", "chapterId": 9003, "itemId": 90026, "source": "(سورة الفلق — الآيات ١–٥)"},
{"text": "قُلْ أَعُوذُ بِرَبِّ النَّاسِ مَلِكِ النَّاسِ إِلَٰهِ النَّاسِ مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ مِنَ الْجِنَّةِ وَالنَّاسِ", "category": "أدعية قرآنية", "chapter": "الكرب والاستعاذة", "chapterId": 9003, "itemId": 90027, "source": "(سورة الناس — الآيات ١–٦)"},
{"text": "إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ", "category": "أدعية قرآنية", "chapter": "الهداية والثبات", "chapterId": 9004, "itemId": 90028, "source": "(سورة الفاتحة — الآيات ٥–٧)"},
{"text": "رَبَّنَا وَاجْعَلْنَا مُسْلِمَيْنِ لَكَ وَمِن ذُرِّيَّتِنَا أُمَّةً مُّسْلِمَةً لَّكَ وَأَرِنَا مَنَاسِكَنَا وَتُبْ عَلَيْنَا ۖ إِنَّكَ أَنتَ التَّوَّابُ الرَّحِيمُ", "category": "أدعية قرآنية", "chapter": "الهداية والثبات", "chapterId": 9004, "itemId": 90029, "source": "(سورة البقرة — الآية ١٢٨)"},

{"text": "اللَّهُمَّ مَالِكَ الْمُلْكِ تُؤْتِي الْمُلْكَ مَن تَشَاءُ وَتَنزِعُ الْمُلْكَ مِمَّن تَشَاءُ وَتُعِزُّ مَن تَشَاءُ وَتُذِلُّ مَن تَشَاءُ ۖ بِيَدِكَ الْخَيْرُ ۖ إِنَّكَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ تُولِجُ اللَّيْلَ فِي النَّهَارِ وَتُولِجُ النَّهَارَ فِي اللَّيْلِ ۖ وَتُخْرِجُ الْحَيَّ مِنَ الْمَيِّتِ وَتُخْرِجُ الْمَيِّتَ مِنَ الْحَيِّ ۖ وَتَرْزُقُ مَن تَشَاءُ بِغَيْرِ حِسَابٍ", "category": "أدعية قرآنية", "chapter": "الشكر والثناء على الله", "chapterId": 9009, "itemId": 90065, "source": "(سورة آل عمران — من الآيات ٢٦–٢٧)"},

 {
  "t": "عَنْ عَبْدِ اللَّهِ بْنِ عَبَّاسٍ رَضِيَ اللَّهُ عَنْهُمَا قَالَ: \"كُنْت خَلْفَ رَسُولِ اللَّهِ صلى الله عليه و سلم يَوْمًا، فَقَالَ: يَا غُلَامِ! إنِّي أُعَلِّمُك كَلِمَاتٍ: احْفَظْ اللَّهَ يَحْفَظْك، احْفَظْ اللَّهَ تَجِدْهُ تُجَاهَك، إذَا سَأَلْت فَاسْأَلْ اللَّهَ، وَإِذَا اسْتَعَنْت فَاسْتَعِنْ بِاَللَّهِ، وَاعْلَمْ أَنَّ الْأُمَّةَ لَوْ اجْتَمَعَتْ عَلَى أَنْ يَنْفَعُوك بِشَيْءٍ لَمْ يَنْفَعُوك إلَّا بِشَيْءٍ قَدْ كَتَبَهُ اللَّهُ لَك، وَإِنْ اجْتَمَعُوا عَلَى أَنْ يَضُرُّوك بِشَيْءٍ لَمْ يَضُرُّوك إلَّا بِشَيْءٍ قَدْ كَتَبَهُ اللَّهُ عَلَيْك؛ رُفِعَتْ الْأَقْلَامُ، وَجَفَّتْ الصُّحُفُ\". وَفِي رِوَايَةِ غَيْرِ التِّرْمِذِيِّ: \"احْفَظْ اللَّهَ تَجِدْهُ أمامك، تَعَرَّفْ إلَى اللَّهِ فِي الرَّخَاءِ يَعْرِفُك فِي الشِّدَّةِ، وَاعْلَمْ أَنَّ مَا أَخْطَأَك لَمْ يَكُنْ لِيُصِيبَك، وَمَا أَصَابَك لَمْ يَكُنْ لِيُخْطِئَك، وَاعْلَمْ أَنَّ النَّصْرَ مَعَ الصَّبْرِ، وَأَنْ الْفَرَجَ مَعَ الْكَرْبِ، وَأَنَّ مَعَ الْعُسْرِ يُسْرًا",
  "s": "المصدر: رواه الترمذي (الأربعون النووية)"

 {
  "t": "عَنْ أَبِي مَسْعُودٍ عُقْبَةَ بْنِ عَمْرٍو الْأَنْصَارِيِّ الْبَدْرِيِّ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صلى الله عليه و سلم إنَّ مِمَّا أَدْرَكَ النَّاسُ مِنْ كَلَامِ النُّبُوَّةِ الْأُولَى: إذَا لَمْ تَسْتَحِ فَاصْنَعْ مَا شِئْت.",

 {
  "t": "عَنْ أَبِي عَمْرٍو وَقِيلَ: أَبِي عَمْرَةَ سُفْيَانَ بْنِ عَبْدِ اللَّهِ رَضِيَ اللهُ عَنْهُ قَالَ: قُلْت: يَا رَسُولَ اللَّهِ! قُلْ لِي فِي الْإِسْلَامِ قَوْلًا لَا أَسْأَلُ عَنْهُ أَحَدًا غَيْرَك؛ قَالَ: قُلْ: آمَنْت بِاَللَّهِ ثُمَّ اسْتَقِمْ.",

 {

  "s": "المصدر: رواه مسلم (الأربعون النووية)"
 },
 {
  "t": "عَنْ أَبِي مَالِكٍ الْحَارِثِ بْنِ عَاصِمٍ الْأَشْعَرِيِّ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صلى الله عليه و سلم الطَّهُورُ شَطْرُ الْإِيمَانِ، وَالْحَمْدُ لِلَّهِ تَمْلَأُ الْمِيزَانَ، وَسُبْحَانَ اللَّهِ وَالْحَمْدُ لِلَّهِ تَمْلَآنِ -أَوْ: تَمْلَأُ- مَا بَيْنَ السَّمَاءِ وَالْأَرْضِ، وَالصَّلَاةُ نُورٌ، وَالصَّدَقَةُ بُرْهَانٌ، وَالصَّبْرُ ضِيَاءٌ، وَالْقُرْآنُ حُجَّةٌ لَك أَوْ عَلَيْك، كُلُّ النَّاسِ يَغْدُو، فَبَائِعٌ نَفْسَهُ فَمُعْتِقُهَا أَوْ مُوبِقُهَا.",
  "s": "المصدر: رواه مسلم (الأربعون النووية)"
 },
 {
  "t": "عَنْ أَبِي ذَرٍّ الْغِفَارِيِّ رَضِيَ اللهُ عَنْهُ عَنْ النَّبِيِّ صلى الله عليه و سلم فِيمَا يَرْوِيهِ عَنْ رَبِّهِ تَبَارَكَ وَتَعَالَى، أَنَّهُ قَالَ: يَا عِبَادِي: إنِّي حَرَّمْت الظُّلْمَ عَلَى نَفْسِي، وَجَعَلْته بَيْنَكُمْ مُحَرَّمًا؛ فَلَا تَظَالَمُوا. يَا عِبَادِي! كُلُّكُمْ ضَالٌّ إلَّا مَنْ هَدَيْته، فَاسْتَهْدُونِي أَهْدِكُمْ. يَا عِبَادِي! كُلُّكُمْ جَائِعٌ إلَّا مَنْ أَطْعَمْته، فَاسْتَطْعِمُونِي أُطْعِمْكُمْ. يَا عِبَادِي! كُلُّكُمْ عَارٍ إلَّا مَنْ كَسَوْته، فَاسْتَكْسُونِي أَكْسُكُمْ. يَا عِبَادِي! إنَّكُمْ تُخْطِئُونَ بِاللَّيْلِ وَالنَّهَارِ، وَأَنَا أَغْفِرُ الذُّنُوبَ جَمِيعًا؛ فَاسْتَغْفِرُونِي أَغْفِرْ لَكُمْ. يَا عِبَادِي! إنَّكُمْ لَنْ تَبْلُغُوا ضُرِّي فَتَضُرُّونِي، وَلَنْ تَبْلُغُوا نَفْعِي فَتَنْفَعُونِي. يَا عِبَادِي! لَوْ أَنَّ أَوَّلَكُمْ وَآخِرَكُمْ وَإِنْسَكُمْ وَجِنَّكُمْ كَانُوا عَلَى أَتْقَى قَلْبِ رَجُلٍ وَاحِدٍ مِنْكُمْ، مَا زَادَ ذَلِكَ فِي مُلْكِي شَيْئًا. يَا عِبَادِي! لَوْ أَنَّ أَوَّلَكُمْ وَآخِرَكُمْ وَإِنْسَكُمْ وَجِنَّكُمْ كَانُوا عَلَى أَفْجَرِ قَلْبِ رَجُلٍ وَاحِدٍ مِنْكُمْ، مَا نَقَصَ ذَلِكَ مِنْ مُلْكِي شَيْئًا. يَا عِبَادِي! لَوْ أَنَّ أَوَّلَكُمْ وَآخِرَكُمْ وَإِنْسَكُمْ وَجِنَّكُمْ قَامُوا فِي صَعِيدٍ وَاحِدٍ، فَسَأَلُونِي، فَأَعْطَيْت كُلَّ وَاحِدٍ مَسْأَلَته، مَا نَقَصَ ذَلِكَ مِمَّا عِنْدِي إلَّا كَمَا يَنْقُصُ الْمِخْيَطُ إذَا أُدْخِلَ الْبَحْرَ. يَا عِبَادِي! إنَّمَا هِيَ أَعْمَالُكُمْ أُحْصِيهَا لَكُمْ، ثُمَّ أُوَفِّيكُمْ إيَّاهَا؛ فَمَنْ وَجَدَ خَيْرًا فَلْيَحْمَدْ اللَّهَ، وَمَنْ وَجَدَ غَيْرَ ذَلِكَ فَلَا يَلُومَن إلَّا نَفْسَهُ.",
  "s": "المصدر: رواه مسلم (الأربعون النووية)"
 },
 {
  "t": "عَنْ أَبِي ذَرٍّ رَضِيَ اللهُ عَنْهُ أَيْضًا، أَنَّ نَاسًا مِنْ أَصْحَابِ رَسُولِ اللَّهِ صلى الله عليه و سلم قَالُوا لِلنَّبِيِّ صلى الله عليه و سلم يَا رَسُولَ اللَّهِ ذَهَبَ أَهْلُ الدُّثُورِ بِالْأُجُورِ؛ يُصَلُّونَ كَمَا نُصَلِّي، وَيَصُومُونَ كَمَا نَصُومُ، وَيَتَصَدَّقُونَ بِفُضُولِ أَمْوَالِهِمْ. قَالَ: أَوَلَيْسَ قَدْ جَعَلَ اللَّهُ لَكُمْ مَا تَصَّدَّقُونَ؟ إنَّ بِكُلِّ تَسْبِيحَةٍ صَدَقَةً، وَكُلِّ تَكْبِيرَةٍ صَدَقَةً، وَكُلِّ تَحْمِيدَةٍ صَدَقَةً، وَكُلِّ تَهْلِيلَةٍ صَدَقَةً، وَأَمْرٌ بِمَعْرُوفٍ صَدَقَةٌ، وَنَهْيٌ عَنْ مُنْكَرٍ صَدَقَةٌ، وَفِي بُضْعِ أَحَدِكُمْ صَدَقَةٌ. قَالُوا: يَا رَسُولَ اللَّهِ أَيَأْتِي أَحَدُنَا شَهْوَتَهُ وَيَكُونُ لَهُ فِيهَا أَجْرٌ؟ قَالَ: أَرَأَيْتُمْ لَوْ وَضَعَهَا فِي حَرَامٍ أَكَانَ عَلَيْهِ وِزْرٌ؟ فَكَذَلِكَ إذَا وَضَعَهَا فِي الْحَلَالِ، كَانَ لَهُ أَجْرٌ.",
  "s": "المصدر: رواه مسلم (الأربعون النووية)"
 },
 {
  "t": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صلى الله عليه و سلم كُلُّ سُلَامَى مِنْ النَّاسِ عَلَيْهِ صَدَقَةٌ، كُلَّ يَوْمٍ تَطْلُعُ فِيهِ الشَّمْسُ تَعْدِلُ بَيْنَ اثْنَيْنِ صَدَقَةٌ، وَتُعِينُ الرَّجُلَ فِي دَابَّتِهِ فَتَحْمِلُهُ عَلَيْهَا أَوْ تَرْفَعُ لَهُ عَلَيْهَا مَتَاعَهُ صَدَقَةٌ، وَالْكَلِمَةُ الطَّيِّبَةُ صَدَقَةٌ، وَبِكُلِّ خُطْوَةٍ تَمْشِيهَا إلَى الصَّلَاةِ صَدَقَةٌ، وَتُمِيطُ الْأَذَى عَنْ الطَّرِيقِ صَدَقَةٌ.",
  "s": "المصدر: متفق عليه (الأربعون النووية)"
 },
 {
  "t": "عَنْ النَّوَّاسِ بْنِ سَمْعَانَ رَضِيَ اللهُ عَنْهُ عَنْ النَّبِيِّ صلى الله عليه و سلم قَالَ: \"الْبِرُّ حُسْنُ الْخُلُقِ، وَالْإِثْمُ مَا حَاكَ فِي صَدْرِك، وَكَرِهْت أَنْ يَطَّلِعَ عَلَيْهِ النَّاسُ\" وَعَنْ وَابِصَةَ بْنِ مَعْبَدٍ رَضِيَ اللهُ عَنْهُ قَالَ: أَتَيْت رَسُولَ اللَّهِ صلى الله عليه و سلم فَقَالَ: \"جِئْتَ تَسْأَلُ عَنْ الْبِرِّ؟ قُلْت: نَعَمْ. فقَالَ: استفت قلبك، الْبِرُّ مَا اطْمَأَنَّتْ إلَيْهِ النَّفْسُ، وَاطْمَأَنَّ إلَيْهِ الْقَلْبُ، وَالْإِثْمُ مَا حَاكَ فِي النَّفْسِ وَتَرَدَّدَ فِي الصَّدْرِ، وَإِنْ أَفْتَاك النَّاسُ وَأَفْتَوْك\".",
  "s": "المصدر: رواه مسلم (الأربعون النووية)"
 },
 {
  "t": "عَنْ أَبِي نَجِيحٍ الْعِرْبَاضِ بْنِ سَارِيَةَ رَضِيَ اللهُ عَنْهُ قَالَ: وَعَظَنَا رَسُولُ اللَّهِ صلى الله عليه و سلم مَوْعِظَةً وَجِلَتْ مِنْهَا الْقُلُوبُ، وَذَرَفَتْ مِنْهَا الْعُيُونُ، فَقُلْنَا: يَا رَسُولَ اللَّهِ! كَأَنَّهَا مَوْعِظَةُ مُوَدِّعٍ فَأَوْصِنَا، قَالَ: أُوصِيكُمْ بِتَقْوَى اللَّهِ، وَالسَّمْعِ وَالطَّاعَةِ وَإِنْ تَأَمَّرَ عَلَيْكُمْ عَبْدٌ، فَإِنَّهُ مَنْ يَعِشْ مِنْكُمْ فَسَيَرَى اخْتِلَافًا كَثِيرًا، فَعَلَيْكُمْ بِسُنَّتِي وَسُنَّةِ الْخُلَفَاءِ الرَّاشِدِينَ الْمَهْدِيينَ، عَضُّوا عَلَيْهَا بِالنَّوَاجِذِ، وَإِيَّاكُمْ وَمُحْدَثَاتِ الْأُمُورِ؛ فَإِنَّ كُلَّ بِدْعَةٍ ضَلَالَةٌ.",
  "s": "المصدر: رواه أبو داود والترمذي (الأربعون النووية)"
 },
 {
  "t": "عَنْ مُعَاذِ بْنِ جَبَلٍ رَضِيَ اللهُ عَنْهُ قَالَ: قُلْت يَا رَسُولَ اللَّهِ! أَخْبِرْنِي بِعَمَلٍ يُدْخِلُنِي الْجَنَّةَ وَيُبَاعِدْنِي مِنْ النَّارِ، قَالَ: \"لَقَدْ سَأَلْت عَنْ عَظِيمٍ، وَإِنَّهُ لَيَسِيرٌ عَلَى مَنْ يَسَّرَهُ اللَّهُ عَلَيْهِ: تَعْبُدُ اللَّهَ لَا تُشْرِكْ بِهِ شَيْئًا، وَتُقِيمُ الصَّلَاةَ، وَتُؤْتِي الزَّكَاةَ، وَتَصُومُ رَمَضَانَ، وَتَحُجُّ الْبَيْتَ، ثُمَّ قَالَ: أَلَا أَدُلُّك عَلَى أَبْوَابِ الْخَيْرِ؟ الصَّوْمُ جُنَّةٌ، وَالصَّدَقَةُ تُطْفِئُ الْخَطِيئَةَ كَمَا يُطْفِئُ الْمَاءُ النَّارَ، وَصَلَاةُ الرَّجُلِ فِي جَوْفِ اللَّيْلِ، ثُمَّ تَلَا: \" تَتَجَافَى جُنُوبُهُمْ عَنِ الْمَضَاجِعِ \" حَتَّى بَلَغَ \"يَعْمَلُونَ\"، 32 سورة السجدة / الأيتان : 16 و 17 ثُمَّ قَالَ: أَلَا أُخْبِرُك بِرَأْسِ الْأَمْرِ وَعَمُودِهِ وَذُرْوَةِ سَنَامِهِ؟ قُلْت: بَلَى يَا رَسُولَ اللَّهِ. قَالَ: رَأْسُ الْأَمْرِ الْإِسْلَامُ، وَعَمُودُهُ الصَّلَاةُ، وَذُرْوَةُ سَنَامِهِ الْجِهَادُ، ثُمَّ قَالَ: أَلَا أُخْبِرُك بِمَلَاكِ ذَلِكَ كُلِّهِ؟ فقُلْت: بَلَى يَا رَسُولَ اللَّهِ ! فَأَخَذَ بِلِسَانِهِ وَقَالَ: كُفَّ عَلَيْك هَذَا. قُلْت: يَا نَبِيَّ اللَّهِ وَإِنَّا لَمُؤَاخَذُونَ بِمَا نَتَكَلَّمُ بِهِ؟ فَقَالَ: ثَكِلَتْك أُمُّك وَهَلْ يَكُبُّ النَّاسَ عَلَى وُجُوهِهِمْ -أَوْ قَالَ عَلَى مَنَاخِرِهِمْ- إلَّا حَصَائِدُ أَلْسِنَتِهِمْ؟!\".",
  "s": "المصدر: رواه الترمذي (الأربعون النووية)"
 },
 {
  "t": "عَنْ أَبِي ثَعْلَبَةَ الْخُشَنِيِّ جُرْثُومِ بن نَاشِر رَضِيَ اللهُ عَنْهُ عَنْ رَسُولِ اللَّهِ صلى الله عليه و سلم قَال: \"إنَّ اللَّهَ تَعَالَى فَرَضَ فَرَائِضَ فَلَا تُضَيِّعُوهَا، وَحَدَّ حُدُودًا فَلَا تَعْتَدُوهَا، وَحَرَّمَ أَشْيَاءَ فَلَا تَنْتَهِكُوهَا، وَسَكَتَ عَنْ أَشْيَاءَ رَحْمَةً لَكُمْ غَيْرَ نِسْيَانٍ فَلَا تَبْحَثُوا عَنْهَا\".",
  "s": "المصدر: رواه الدارقطني (الأربعون النووية)"
 },
 {
  "t": "عَنْ أَبِي الْعَبَّاسِ سَهْلِ بْنِ سَعْدٍ السَّاعِدِيّ رَضِيَ اللهُ عَنْهُ قَالَ: جَاءَ رَجُلٌ إلَى النَّبِيِّ صلى الله عليه و سلم فَقَالَ: يَا رَسُولَ اللهِ! دُلَّنِي عَلَى عَمَلٍ إذَا عَمِلْتُهُ أَحَبَّنِي اللهُ وَأَحَبَّنِي النَّاسُ؛ فَقَالَ: ازْهَدْ فِي الدُّنْيَا يُحِبَّك اللهُ، وَازْهَدْ فِيمَا عِنْدَ النَّاسِ يُحِبَّك النَّاسُ.",
  "s": "المصدر: رواه ابن ماجه (الأربعون النووية)"
 },
 {

 {

 {
  "t": "عَنْ أَبِي سَعِيدٍ الْخُدْرِيّ رَضِيَ اللهُ عَنْهُ قَالَ سَمِعْت رَسُولَ اللَّهِ صلى الله عليه و سلم يَقُولُ: مَنْ رَأَى مِنْكُمْ مُنْكَرًا فَلْيُغَيِّرْهُ بِيَدِهِ، فَإِنْ لَمْ يَسْتَطِعْ فَبِلِسَانِهِ، فَإِنْ لَمْ يَسْتَطِعْ فَبِقَلْبِهِ، وَذَلِكَ أَضْعَفُ الْإِيمَانِ.",
  "s": "المصدر: رواه مسلم (الأربعون النووية)"
 },
 {
  "t": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صلى الله عليه و سلم لَا تَحَاسَدُوا، وَلَا تَنَاجَشُوا، وَلَا تَبَاغَضُوا، وَلَا تَدَابَرُوا، وَلَا يَبِعْ بَعْضُكُمْ عَلَى بَيْعِ بَعْضٍ، وَكُونُوا عِبَادَ اللَّهِ إخْوَانًا، الْمُسْلِمُ أَخُو الْمُسْلِمِ، لَا يَظْلِمُهُ، وَلَا يَخْذُلُهُ، وَلَا يَكْذِبُهُ، وَلَا يَحْقِرُهُ، التَّقْوَى هَاهُنَا، وَيُشِيرُ إلَى صَدْرِهِ ثَلَاثَ مَرَّاتٍ، بِحَسْبِ امْرِئٍ مِنْ الشَّرِّ أَنْ يَحْقِرَ أَخَاهُ الْمُسْلِمَ، كُلُّ الْمُسْلِمِ عَلَى الْمُسْلِمِ حَرَامٌ: دَمُهُ وَمَالُهُ وَعِرْضُهُ.",
  "s": "المصدر: رواه مسلم (الأربعون النووية)"
 },
 {
  "t": "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللهُ عَنْهُ عَنْ النَّبِيِّ صلى الله عليه و سلم قَالَ: مَنْ نَفَّسَ عَنْ مُؤْمِنٍ كُرْبَةً مِنْ كُرَبِ الدُّنْيَا نَفَّسَ اللَّهُ عَنْهُ كُرْبَةً مِنْ كُرَبِ يَوْمِ الْقِيَامَةِ، وَمَنْ يَسَّرَ عَلَى مُعْسِرٍ، يَسَّرَ اللَّهُ عَلَيْهِ فِي الدُّنْيَا وَالْآخِرَةِ، وَمَنْ سَتَرَ مُسْلِما سَتَرَهُ اللهُ فِي الدُّنْيَا وَالْآخِرَةِ ، وَاَللَّهُ فِي عَوْنِ الْعَبْدِ مَا كَانَ الْعَبْدُ فِي عَوْنِ أَخِيهِ، وَمَنْ سَلَكَ طَرِيقًا يَلْتَمِسُ فِيهِ عِلْمًا سَهَّلَ اللَّهُ لَهُ بِهِ طَرِيقًا إلَى الْجَنَّةِ، وَمَا اجْتَمَعَ قَوْمٌ فِي بَيْتٍ مِنْ بُيُوتِ اللَّهِ يَتْلُونَ كِتَابَ اللَّهِ، وَيَتَدَارَسُونَهُ فِيمَا بَيْنَهُمْ؛ إلَّا نَزَلَتْ عَلَيْهِمْ السَّكِينَةُ، وَغَشِيَتْهُمْ الرَّحْمَةُ، وَ حَفَّتهُمُ المَلاَئِكَة، وَذَكَرَهُمْ اللَّهُ فِيمَنْ عِنْدَهُ، وَمَنْ أَبَطْأَ بِهِ عَمَلُهُ لَمْ يُسْرِعْ بِهِ نَسَبُهُ.",
  "s": "المصدر: رواه مسلم (الأربعون النووية)"
 },
 {
  "t": "عَنْ ابْنِ عَبَّاسٍ رَضِيَ اللَّهُ عَنْهُمَا عَنْ رَسُولِ اللَّهِ صلى الله عليه و سلم فِيمَا يَرْوِيهِ عَنْ رَبِّهِ تَبَارَكَ وَتَعَالَى، قَالَ: \"إنَّ اللَّهَ كَتَبَ الْحَسَنَاتِ وَالسَّيِّئَاتِ، ثُمَّ بَيَّنَ ذَلِكَ، فَمَنْ هَمَّ بِحَسَنَةٍ فَلَمْ يَعْمَلْهَا كَتَبَهَا اللَّهُ عِنْدَهُ حَسَنَةً كَامِلَةً، وَإِنْ هَمَّ بِهَا فَعَمِلَهَا كَتَبَهَا اللَّهُ عِنْدَهُ عَشْرَ حَسَنَاتٍ إلَى سَبْعِمِائَةِ ضِعْفٍ إلَى أَضْعَافٍ كَثِيرَةٍ، وَإِنْ هَمَّ بِسَيِّئَةٍ فَلَمْ يَعْمَلْهَا كَتَبَهَا اللَّهُ عِنْدَهُ حَسَنَةً كَامِلَةً، وَإِنْ هَمَّ بِهَا فَعَمِلَهَا كَتَبَهَا اللَّهُ سَيِّئَةً وَاحِدَةً\".",
  "s": "المصدر: متفق عليه (الأربعون النووية)"
 },
 {
  "t": "عَنْ أَبِي هُرَيْرَة رَضِيَ اللهُ عَنْهُ قَالَ: قَالَ رَسُول اللَّهِ صلى الله عليه و سلم إنَّ اللَّهَ تَعَالَى قَالَ: مَنْ عَادَى لِي وَلِيًّا فَقْد آذَنْتهُ بِالْحَرْبِ، وَمَا تَقَرَّبَ إلَيَّ عَبْدِي بِشَيْءٍ أَحَبَّ إلَيَّ مِمَّا افْتَرَضْتُهُ عَلَيْهِ، وَلَا يَزَالُ عَبْدِي يَتَقَرَّبُ إلَيَّ بِالنَّوَافِلِ حَتَّى أُحِبَّهُ، فَإِذَا أَحْبَبْتُهُ كُنْت سَمْعَهُ الَّذِي يَسْمَعُ بِهِ، وَبَصَرَهُ الَّذِي يُبْصِرُ بِهِ، وَيَدَهُ الَّتِي يَبْطِشُ بِهَا، وَرِجْلَهُ الَّتِي يَمْشِي بِهَا، وَلَئِنْ سَأَلَنِي لَأُعْطِيَنَّهُ، وَلَئِنْ اسْتَعَاذَنِي لَأُعِيذَنَّهُ.",
  "s": "المصدر: رواه البخاري (الأربعون النووية)"

 {
  "t": "عَنْ ابْنِ عَبَّاسٍ رَضِيَ اللَّهُ عَنْهُمَا أَنَّ رَسُولَ اللَّهِ صلى الله عليه و سلم قَالَ: \"إنَّ اللَّهَ تَجَاوَزَ لِي عَنْ أُمَّتِي الْخَطَأَ وَالنِّسْيَانَ وَمَا اسْتُكْرِهُوا عَلَيْهِ\".",

 {

 {
  "t": "عَنْ أَنَسِ بْنِ مَالِكٍ رَضِيَ اللهُ عَنْهُ قَالَ: سَمِعْت رَسُولَ اللَّهِ صلى الله عليه و سلم يَقُولُ: قَالَ اللَّهُ تَعَالَى: يَا ابْنَ آدَمَ! إِنَّكَ مَا دَعَوْتنِي وَرَجَوْتنِي غَفَرْتُ لَك عَلَى مَا كَانَ مِنْك وَلَا أُبَالِي، يَا ابْنَ آدَمَ! لَوْ بَلَغَتْ ذُنُوبُك عَنَانَ السَّمَاءِ ثُمَّ اسْتَغْفَرْتنِي غَفَرْتُ لَك، يَا ابْنَ آدَمَ! إنَّك لَوْ أتَيْتنِي بِقُرَابِ الْأَرْضِ خَطَايَا ثُمَّ لَقِيتنِي لَا تُشْرِكُ بِي شَيْئًا لَأَتَيْتُك بِقُرَابِهَا مَغْفِرَةً.",

const COUNTS_KEY = "mudhakir_counts_v3";
const THEME_KEY = "mudhakir_theme_v1";

/* ================= أدوات ================= */
const AR_DIGITS = ["٠","١","٢","٣","٤","٥","٦","٧","٨","٩"];
function toAr(n){ return String(n).replace(/[0-9]/g, d => AR_DIGITS[+d]); }
function todayKey(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function dayOfYear(){
  const now = new Date();
  return Math.floor((now - new Date(now.getFullYear(),0,0)) / 86400000);
}
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function haptic(type){
  try{
    if (type !== "success" && navigator.vibrate) navigator.vibrate(25);
    if (tg && tg.HapticFeedback){
      if (type === "success") tg.HapticFeedback.notificationOccurred("success");
      else tg.HapticFeedback.impactOccurred("light");
    }
  }catch(e){/* بيئة غير تليجرام */}
}

/* ================= حالة العدادات ================= */
let counts = {};
function allItems(){
  const list = [];
  COUNTER_SECTIONS.forEach(cat => ATHKAR_DATA[cat].items.forEach(it => list.push(it)));
  return list;
}
function initCounts(){
  counts = {};
  allItems().forEach(it => { counts[it.id] = it.target; });
  try{
    const saved = JSON.parse(localStorage.getItem(COUNTS_KEY) || "null");
    if (saved && saved.date === todayKey() && saved.state){
      Object.keys(counts).forEach(id => {
        const v = saved.state[id];
        if (typeof v === "number" && v >= 0) counts[id] = v;
      });
    }
  }catch(e){/* التخزين غير متاح */}
}
function persistCounts(){
  try{ localStorage.setItem(COUNTS_KEY, JSON.stringify({ date: todayKey(), state: counts })); }
  catch(e){/* التخزين غير متاح */}
}

/* ================= المظهر (الوضع الليلي) ================= */
function systemTheme(){
  if (tg && tg.colorScheme) return tg.colorScheme;
  if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) return "dark";
  return "light";
}
function applyTheme(theme){
  document.documentElement.setAttribute("data-theme", theme);
  document.getElementById("themeBtn").textContent = theme === "dark" ? "☀️" : "🌙";
  try{
    if (tg && tg.setHeaderColor) tg.setHeaderColor(theme === "dark" ? "#0C1410" : "#FAF6EF");
    if (tg && tg.setBackgroundColor) tg.setBackgroundColor(theme === "dark" ? "#0C1410" : "#FAF6EF");
  }catch(e){/* إصدار تليجرام أقدم */}
}
function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem(THEME_KEY); }catch(e){}
  applyTheme(saved === "dark" || saved === "light" ? saved : systemTheme());
  document.getElementById("themeBtn").addEventListener("click", () => {
    const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    applyTheme(next);
    try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
  });
  if (tg && tg.onEvent){
    tg.onEvent("themeChanged", () => {
      let manual = null;
      try{ manual = localStorage.getItem(THEME_KEY); }catch(e){}
      if (!manual) applyTheme(systemTheme());
    });
  }
}

function fmtDua(text){
  let t = esc(text);
  t = t.split("بسم الله الرحمن الرحيم").join("\u0001");
  t = t.replace(/﴿([\s\S]*?)﴾/g, '<span class="verse">$1</span>');
  t = t.split("﴿").join("").split("﴾").join("");
  t = t.split("\u0001").join('<span class="basmala">بِسْمِ ٱللَّهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ</span>');
  return t;
}
const HINT_KEY = "mudhakir_hint_v1";
function hintNeeded(){
  try{ return !localStorage.getItem(HINT_KEY); }catch(e){ return true; }
}
function markHintSeen(){
  try{ localStorage.setItem(HINT_KEY, "1"); }catch(e){}
}
function cardHTML(item, withHint){
  const rem = counts[item.id];
  const done = rem === 0;
  return '' +
  '<article class="card' + (done ? ' done' : '') + '" data-id="' + item.id + '" role="button" tabindex="0">' +
    '<div class="card-main">' +
      (withHint ? '<div class="tap-hint"><span class="hand">👆</span><span>اضغط على الذكر للعدّ</span></div>' : '') +
      '<div class="card-top">' +
      '<span class="chip">' + chipText(item) + '</span>' +
      '<span class="done-badge">✓ تم بحمد الله</span></div>' +
      '<p class="dhikr">' + fmtDua(item.text) + '</p>' +
      (item.virtue ? '<p class="virtue">' + esc(item.virtue) + '</p>' : '') +
      (item.note ? '<p class="virtue">' + esc(item.note) + '</p>' : '') +
    '</div>' +
    '<div class="counter">' + (done ? '<span>✓</span>' :
      '<span class="rem">' + toAr(rem) + '</span><span class="rem-label">المتبقي</span>') + '</div>' +
  '</article>';
}
function sectionProgress(cat){
  const core = ATHKAR_DATA[cat].items.filter(it => it.tier !== "extra");
  const done = core.filter(it => counts[it.id] === 0).length;
  return { done: done, total: core.length };
}
function dateLine(){
  try{
    return new Intl.DateTimeFormat("ar-EG", { weekday: "long", day: "numeric", month: "long", year: "numeric" }).format(new Date());
  }catch(e){ return ""; }
}
function hijriLine(){
  try{
    return new Intl.DateTimeFormat("ar-SA-u-ca-islamic-umalqura", { day: "numeric", month: "long", year: "numeric" }).format(new Date());
  }catch(e){ return ""; }
}
function chipsHTML(active){
  return '<div class="sec-chips">' + ATHKAR_SECTIONS.map(s =>
    '<button type="button" class="sec-chip' + (s === active ? ' on' : '') + '" data-sec="' + s + '">' +
    SECTION_LABELS[s] + '</button>').join("") + '</div>';
}
function renderSection(cat){
  if (!ATHKAR_DATA[cat]) cat = "morning";
  currentSection = cat;
  const data = ATHKAR_DATA[cat];
  const p = sectionProgress(cat);
  const bannerHTML = (p.done === p.total && p.total > 0)
    ? '<div class="done-banner" id="doneBanner">أتممتَ ' + esc(data.title) + ' — تقبّل الله منك 🤲</div>' : '';
  let html = '<div class="sec-head"><h2 class="sec-title">' + esc(data.title) + '</h2>' +
    '<p class="sec-date">' + esc(dateLine()) + '</p>' + '<p class="sec-date sec-hijri">' + esc(hijriLine()) + '</p>' +
    chipsHTML(cat) +
    '<div class="progress-row" style="justify-content:flex-end"><button class="reset-btn" type="button" id="resetBtn">↺ إعادة هذا القسم</button></div>' +
    '</div><div class="cards">';
  let dividerShown = false;
  let bannerPlaced = false;
  let firstCard = true;
  data.items.forEach(it => {
    if (it.tier === "extra" && !dividerShown){
      if (bannerHTML && !bannerPlaced){ html += bannerHTML; bannerPlaced = true; }
      html += '<div class="extra-divider"><span>✨ إضافي — لا يدخل في احتساب اليوم</span></div>';
      dividerShown = true;
    }
    html += cardHTML(it, firstCard && hintNeeded());
    firstCard = false;
  });
  if (bannerHTML && !bannerPlaced) html += bannerHTML;
  html += '</div>';
  contentEl.innerHTML = html;
  bindCards();
  contentEl.querySelectorAll(".sec-chip").forEach(b =>
    b.addEventListener("click", () => {
      const s = b.getAttribute("data-sec");
      if (s && s !== cat){ renderSection(s); window.scrollTo({ top: 0, behavior: "smooth" }); }
    }));
  document.getElementById("resetBtn").addEventListener("click", () => {
    data.items.forEach(it => { counts[it.id] = it.target; });
    persistCounts(); renderSection(cat);
  });
  updateProgressChip();
}
function updateProgressChip(){
  const chip = document.getElementById("progressChip");
  if (!chip) return;
  if (currentTab === "athkar"){
    const p = sectionProgress(currentSection);
    const C = 125.7, frac = p.total ? p.done / p.total : 0;
    chip.innerHTML = '<span class="pc-wrap"><svg width="46" height="46" viewBox="0 0 46 46">' +
      '<circle class="pc-track" cx="23" cy="23" r="20" fill="none" stroke-width="3.5"></circle>' +
      '<circle class="pc-fill" cx="23" cy="23" r="20" fill="none" stroke-width="3.5" stroke-linecap="round" ' +
      'stroke-dasharray="' + C + '" stroke-dashoffset="' + (C * (1 - frac)).toFixed(1) + '"></circle></svg>' +
      '<span class="pc-num">' + toAr(p.done) + '/' + toAr(p.total) + '</span></span>';
    chip.classList.add("show");
  } else {
    chip.classList.remove("show");
  }
}
const FAIDA_KEY = "mudhakir_faida_v1";
function localEpochDay(){
  const d = new Date();
  return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
}
function renderWird(){

  html += '<article class="card read-card"><div class="card-main">' +
    '<h3 class="read-head">📜 حديث اليوم</h3><p class="read-text">' + esc(hadith.t).split("﴿").join("").split("﴾").join("") + '</p>' +
    '<p class="virtue">' + esc(hadith.s) + '</p></div></article>';

  duaCard.addEventListener("click", openDua);

    if (ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); openDua(); }
  });

function faidaFallbackHTML(){
  const day = WIRD_DAYS[dayOfYear() % WIRD_DAYS.length];
  return '<h3 class="read-head">📖 ورد اليوم</h3><p class="read-text">' + esc(day.wird).split("﴿").join("").split("﴾").join("") + '</p>';
}
function faidaAyahHTML(p){
  return '<h3 class="read-head">📖 آية من وردك اليوم</h3>' +
    '<p class="read-text dua-c">' + esc(p.text) + '</p>' +
    '<p class="virtue">' + esc(p.ref) + ' — من صفحة ' + toAr(p.page) + ' في وردك</p>' +
    '<h3 class="read-head" style="margin-top:16px;">التفسير الميسر</h3>' +
    '<p class="read-text">' + esc(p.tafsir) + '</p>';
}
function loadFaidaAyah(){
  if (!document.getElementById("faidaAyahBody")) return;
  const set = h => { const b = document.getElementById("faidaAyahBody"); if (b) b.innerHTML = h; };
  let cache = null;
  try{ cache = JSON.parse(localStorage.getItem(FAIDA_KEY) || "null"); }catch(e){}
  if (cache && cache.date === todayKey() && cache.text && cache.tafsir){ set(faidaAyahHTML(cache)); return; }
  const range = faidaRange();
  if (!range){ set(faidaFallbackHTML()); return; }
  const page = range.to;
  fetch("https://api.alquran.cloud/v1/page/" + page + "/quran-uthmani")
    .then(r => { if (!r.ok) throw new Error("http"); return r.json(); })
    .then(j => {
      const ayah = j && j.data && j.data.ayahs && j.data.ayahs[0];
      if (!ayah) throw new Error("shape");
      return fetch("https://api.alquran.cloud/v1/ayah/" + ayah.number + "/ar.muyassar")
        .then(r => { if (!r.ok) throw new Error("http"); return r.json(); })
        .then(t => {
          if (!t || !t.data || !t.data.text) throw new Error("shape");
          return { ayah: ayah, tafsir: t.data.text };
        });
    })
    .then(res => {
      const payload = { date: todayKey(), page: page, text: res.ayah.text,
        ref: res.ayah.surah.name + "، الآية " + toAr(res.ayah.numberInSurah), tafsir: res.tafsir };
      try{ localStorage.setItem(FAIDA_KEY, JSON.stringify(payload)); }catch(e){}
      set(faidaAyahHTML(payload));
    })
    .catch(() => set(faidaFallbackHTML()));
}
function bindCards(){
  contentEl.querySelectorAll(".card[data-id]").forEach(card => {
    const act = () => tapItem(card.getAttribute("data-id"));
    card.addEventListener("click", act);
    card.addEventListener("keydown", ev => {
      if (ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); act(); }
    });
  });
}
function tapItem(id){
  if (counts[id] === undefined || counts[id] <= 0) return;
  markHintSeen();
  counts[id] -= 1;
  persistCounts();
  const justDone = counts[id] === 0;
  if (justDone) haptic("success"); else haptic("light");
  if (currentTab === "wird") renderWird(); else renderSection(currentSection);
  if (justDone) scheduleAdvance();
}
/* بعد إتمام ذكر: مرّر بلطف إلى البطاقة التالية غير المكتملة في القسم نفسه،
   فإن اكتمل القسم كله مرّر إلى لافتة الإتمام. تُنفَّذ دائماً بلطف (scroll-behavior smooth)
   مع scroll-margin-top على البطاقات واللافتة لمراعاة ارتفاع الرأس الثابت. */
function scheduleAdvance(){
  setTimeout(() => {
    const cards = contentEl.querySelectorAll(".card[data-id]");
    for (let i = 0; i < cards.length; i++){
      const cid = cards[i].getAttribute("data-id");
      if (counts[cid] > 0){ cards[i].scrollIntoView({ behavior: "smooth", block: "start" }); return; }
    }
    const banner = contentEl.querySelector(".done-banner");
    if (banner) banner.scrollIntoView({ behavior: "smooth", block: "start" });
  }, 450);
}
function switchTab(tab){
  if (tab === "mushaf") tab = "quran";
  if (ATHKAR_SECTIONS.includes(tab)){ currentSection = tab; tab = "athkar"; }
  if (!TABS.includes(tab)) tab = "athkar";
  if (currentTab === "quran" && tab !== "quran"){
    stopQuranObserver();
    if (qCurrent != null && botRange){ botRange.lastPage = qCurrent; persistBotRange(); }
    quranMode = "home";
  }
  currentTab = tab;
  setReaderMode(false);
  document.querySelectorAll(".nav-btn").forEach(b =>
    b.classList.toggle("active", b.getAttribute("data-tab") === tab));
  if (tab === "wird") renderWird();
  else if (tab === "quran") renderQuran();
  else if (tab === "misc") renderMisc();
  else if (tab === "hadith") renderHadith();
  else if (tab === "misbaha") renderMisbaha();
  else renderSection(currentSection);
  updateProgressChip();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ================= السبحة (محلية فقط — لا مزامنة مع البوت) ================= */
const MISBAHA_KEY = "mudhakir_misbaha_v1";
const MISBAHA_SEL_KEY = "mudhakir_misbaha_sel";
const MISBAHA_PRESETS = ["سبحان الله", "الحمد لله", "الله أكبر", "الصلاة على النبي ﷺ"];
const MISBAHA_TARGETS = [33, 100, 500, 1000, 0];
const MB_RING_C = 2 * Math.PI * 84;
let misbahaStore = {};
let misbahaSel = "سبحان الله";
let misbahaCustom = "";
let mbCompleting = false;
function loadMisbaha(){
  try{ const s = JSON.parse(localStorage.getItem(MISBAHA_KEY) || "{}"); if (s && typeof s === "object") misbahaStore = s; }catch(e){}
  try{
    const sel = JSON.parse(localStorage.getItem(MISBAHA_SEL_KEY) || "null");
    if (sel && sel.dhikr){ misbahaSel = sel.dhikr; misbahaCustom = sel.custom || ""; }
  }catch(e){}
}
function persistMisbaha(){
  try{ localStorage.setItem(MISBAHA_KEY, JSON.stringify(misbahaStore)); }catch(e){}
  try{ localStorage.setItem(MISBAHA_SEL_KEY, JSON.stringify({ dhikr: misbahaSel, custom: misbahaCustom })); }catch(e){}
}
function misbahaEntry(dhikr){
  let e = misbahaStore[dhikr];
  if (!e || typeof e !== "object")
    e = { date: todayKey(), dayTotal: 0, round: 1, count: 0, target: 33 };
  if (e.date !== todayKey()){ e.date = todayKey(); e.dayTotal = 0; e.count = 0; e.round = 1; }
  if (typeof e.dayTotal !== "number" || e.dayTotal < 0) e.dayTotal = 0;
  if (typeof e.count !== "number" || e.count < 0) e.count = 0;
  if (typeof e.round !== "number" || e.round < 1) e.round = 1;
  if (typeof e.target !== "number") e.target = 33;
  misbahaStore[dhikr] = e;
  return e;
}
function renderMisbaha(){
  loadMisbaha();
  const e = misbahaEntry(misbahaSel);
  persistMisbaha();
  const isCustom = !MISBAHA_PRESETS.includes(misbahaSel);
  let html = '<div class="sec-head"><h2 class="sec-title">السبحة</h2>' +
    '<p class="sec-date">' + esc(dateLine()) + '</p>' + '<p class="sec-date sec-hijri">' + esc(hijriLine()) + '</p></div>' +
    '<div class="misbaha-wrap">' +
    '<div class="sec-chips" id="mbDhikrChips">' +
      MISBAHA_PRESETS.map(d => '<button type="button" class="sec-chip' + (misbahaSel === d ? ' on' : '') +
        '" data-dhikr="' + esc(d) + '">' + esc(d) + '</button>').join("") +
      '<button type="button" class="sec-chip' + (isCustom ? ' on' : '') + '" data-dhikr="__custom__">حُرّ</button>' +
    '</div>' +
    '<div class="mb-custom" id="mbCustomWrap" style="display:' + (isCustom ? 'block' : 'none') + '">' +
      '<input class="search-input" id="mbCustomInput" type="text" placeholder="اكتب الذكر هنا" value="' +
      esc(isCustom ? misbahaSel : misbahaCustom) + '" /></div>' +
    '<div class="sec-chips" id="mbTargetChips">' +
      MISBAHA_TARGETS.map(t => '<button type="button" class="sec-chip' + (e.target === t ? ' on' : '') +
        '" data-target="' + t + '">' + (t === 0 ? "بدون هدف" : toAr(t)) + '</button>').join("") +
    '</div>' +
    '<div class="mb-circle-wrap">' +
      '<div class="mb-taqabbal" id="mbTaqabbal">تقبّل الله 🤲</div>' +
      '<button type="button" class="mb-circle" id="mbCircle" aria-label="اضغط للعدّ">' +
        '<svg class="mb-ring" viewBox="0 0 200 200" width="220" height="220">' +
          '<circle cx="100" cy="100" r="84" fill="none" stroke="var(--primary-soft)" stroke-width="8"></circle>' +
          '<circle id="mbRingFg" cx="100" cy="100" r="84" fill="none" stroke="var(--primary)" stroke-width="8" ' +
            'stroke-linecap="round" stroke-dasharray="' + MB_RING_C + '" stroke-dashoffset="' + MB_RING_C + '"></circle>' +
        '</svg>' +
        '<span class="mb-count" id="mbCount">' + String(e.count) + '</span>' +
        '<span class="mb-dhikr" id="mbDhikrName">' + esc(misbahaSel) + '</span>' +
      '</button>' +
    '</div>' +
    '<div class="mb-stats"><span>الجولة: <b id="mbRound">' + toAr(e.round) + '</b></span>' +
      '<span>مجموع اليوم: <b id="mbTotal">' + toAr(e.dayTotal) + '</b></span></div>' +
    '<p class="mb-hint">اضغط مطوّلاً على الدائرة لتصفير عدّاد الذكر الحالي (لا يمسّ مجموع اليوم)</p>' +
    '</div>';
  contentEl.innerHTML = html;
  updateMisbahaView();
  contentEl.querySelectorAll("#mbDhikrChips .sec-chip").forEach(b =>
    b.addEventListener("click", () => {
      const d = b.getAttribute("data-dhikr");
      if (d === "__custom__"){
        misbahaSel = misbahaCustom ? misbahaCustom : "حُرّ";
        persistMisbaha(); renderMisbaha();
        const inp = document.getElementById("mbCustomInput");
        if (inp) inp.focus();
      } else if (d && d !== misbahaSel){
        misbahaSel = d; persistMisbaha(); renderMisbaha();
      }
    }));
  contentEl.querySelectorAll("#mbTargetChips .sec-chip").forEach(b =>
    b.addEventListener("click", () => {
      const t = parseInt(b.getAttribute("data-target"), 10);
      const en = misbahaEntry(misbahaSel);
      if (!isNaN(t) && en.target !== t){ en.target = t; persistMisbaha(); renderMisbaha(); }
    }));
  const inp = document.getElementById("mbCustomInput");
  if (inp) inp.addEventListener("input", () => {
    misbahaCustom = inp.value.trim();
    if (misbahaCustom){
      misbahaSel = misbahaCustom;
      const name = document.getElementById("mbDhikrName");
      if (name) name.textContent = misbahaSel;
    }
    persistMisbaha();
  });
  const circle = document.getElementById("mbCircle");
  let longTimer = null, longFired = false;
  circle.addEventListener("pointerdown", () => {
    longFired = false;
    clearTimeout(longTimer);
    longTimer = setTimeout(() => {
      longFired = true;
      const en = misbahaEntry(misbahaSel);
      en.count = 0; en.round = 1;
      persistMisbaha(); updateMisbahaView();
      haptic("light");
    }, 600);
  });
  ["pointerup", "pointerleave", "pointercancel"].forEach(ev =>
    circle.addEventListener(ev, () => clearTimeout(longTimer)));
  circle.addEventListener("contextmenu", ev => ev.preventDefault());
  circle.addEventListener("click", () => {
    if (longFired){ longFired = false; return; }
    misbahaTap();
  });
}
function updateMisbahaView(){
  const e = misbahaEntry(misbahaSel);
  const countEl = document.getElementById("mbCount");
  if (!countEl) return;
  countEl.textContent = String(e.count);  // أرقام كبيرة واضحة في دائرة السبحة (الصفر الشرقي نقطة صغيرة تُقرأ خطأً)
  document.getElementById("mbRound").textContent = toAr(e.round);
  document.getElementById("mbTotal").textContent = toAr(e.dayTotal);
  const ring = document.getElementById("mbRingFg");
  if (ring){
    const frac = e.target > 0 ? Math.min(e.count / e.target, 1) : 0;
    ring.style.strokeDashoffset = String(MB_RING_C * (1 - frac));
  }
}
function misbahaTap(){
  if (mbCompleting) return;
  const e = misbahaEntry(misbahaSel);
  e.count += 1;
  e.dayTotal += 1;
  if (e.target > 0 && e.count >= e.target){
    mbCompleting = true;
    persistMisbaha();
    updateMisbahaView();
    haptic("success");
    const tq = document.getElementById("mbTaqabbal");
    if (tq) tq.classList.add("show");
    setTimeout(() => {
      const en = misbahaEntry(misbahaSel);
      en.count = 0;
      en.round += 1;
      persistMisbaha();
      updateMisbahaView();
      if (tq) tq.classList.remove("show");
      mbCompleting = false;
    }, 900);
  } else {
    persistMisbaha();
    updateMisbahaView();
    haptic("light");
  }
}

/* ================= المصحف (ورد القرآن) =================
   مصدر الصور (مُتحقق منه حياً): صفحات مصحف المدينة برواية حفص، مولّدة بمولّد
   quran.com الرسمي — https://cdn.jsdelivr.net/gh/akram-seid/quran-hd-images@main/images/{NNN}.jpg
   (NNN برقم الصفحة مُصفّراً لثلاث خانات، المقاس 1260×2038؛ صفحات 001 و300 و604
   أجابت 200 image/jpeg، والترقيم مطابق: 001 الفاتحة و002 أول البقرة).
   ملحوظة: مصدر PNG الأصلي (cdn.islamic.network) محجوب حالياً (403)، فهذا مصدر JPG مُتحقق منه.

   نموذج الورد (v2.1 — مصدر واحد: البوت): خطة الورد وموضع الختمة يعيشان في
   البوت وحده. البوت يرسل في بطاقة الورد زراراً يفتح هذه الصفحة على مدى اليوم
   (?tab=quran&from&to)، فتخزّن الصفحة آخر مدى وصَل إليها في
   (v3.0: صار البوت يُرفق المدى نفسه بكل روابطه، فتخزّنه الصفحة من أي تبويب
   عبر cacheBotRange دون فتح المصحف قسراً — ودلالات التاريخ كما هي.)
   mudhakir_bot_range_v1 = {from, to, date, lastPage} وتقرأه فقط — لا إعداد
   صفحات ولا تقديم موضع هنا؛ الإتمام يُعلَّم من البوت. المدى قد يلفّ آخر
   المصحف (from > to) عند نهاية الختمة، والتسلسل يُبنى باللفّ.
*/
const BOT_RANGE_KEY = "mudhakir_bot_range_v1";
const QIMG_BASES = [
  "https://cdn.jsdelivr.net/gh/akram-seid/quran-hd-images@main/images/",
  "https://raw.githubusercontent.com/akram-seid/quran-hd-images/main/images/"
];
let botRange = null; /* {from, to, date, lastPage} — آخر مدى ورد أرسله البوت */
let qRange = { from: null, to: null }; /* مدى جلسة القراءة الحالية فقط */
let qPages = [];     /* تسلسل صفحات الجلسة (قد يلفّ بعد 604 إلى 1) */
let quranMode = "home"; /* home | read */
let qCurrent = null;
let qObserver = null;
let qSaveTimer = null;

function quranImgUrl(p, b){ return QIMG_BASES[b || 0] + String(p).padStart(3, "0") + ".jpg"; }
function validPage(p){
  return Number.isInteger(p) && p >= 1 && p <= 604;
}
function validRange(f, t){
  return validPage(f) && validPage(t); /* المدى قد يلفّ: from > to عند نهاية الختمة */
}
function rangeSeq(f, t){
  const seq = [];
  if (!validRange(f, t)) return seq;
  let p = f;
  for (;;){ seq.push(p); if (p === t) break; p = p === 604 ? 1 : p + 1; }
  return seq;
}
function rangeCount(f, t){
  return validRange(f, t) ? ((t - f + 604) % 604) + 1 : 0;
}
function normalizeBotRange(raw){
  if (!raw || typeof raw !== "object") return null;
  const f = parseInt(raw.from, 10), t = parseInt(raw.to, 10);
  if (!validRange(f, t)) return null;
  let last = parseInt(raw.lastPage, 10);
  if (!rangeSeq(f, t).includes(last)) last = f;
  return { from: f, to: t,
    date: typeof raw.date === "string" ? raw.date : null, lastPage: last };
}
function loadBotRange(){
  try{ botRange = normalizeBotRange(JSON.parse(localStorage.getItem(BOT_RANGE_KEY) || "null")); }
  catch(e){ botRange = null; }
  /* مفاتيح النموذج القديم (إعدادات ورد داخل التطبيق) لم تعد تُستخدم — تُحذف */
  try{
    localStorage.removeItem("mudhakir_mushaf_v2");
    localStorage.removeItem("mudhakir_mushaf_v1");
  }catch(e){/* التخزين غير متاح */}
}
function persistBotRange(){
  if (!botRange) return;
  try{ localStorage.setItem(BOT_RANGE_KEY, JSON.stringify(botRange)); }catch(e){/* التخزين غير متاح */}
}
function getHomeRange(){
  if (!botRange) return null;
  return { from: botRange.from, to: botRange.to, date: botRange.date,
    isToday: botRange.date === todayKey(), count: rangeCount(botRange.from, botRange.to) };
}
function faidaRange(){
  if (!botRange || botRange.date !== todayKey()) return null;
  return { from: botRange.from, to: botRange.to };
}
function quranResumePage(range){
  if (!range) return null;
  return botRange && rangeSeq(range.from, range.to).includes(botRange.lastPage)
    ? botRange.lastPage : range.from;
}
function applyDeepLinkRange(f, t){
  if (!validRange(f, t)) return false;
  botRange = { from: f, to: t, date: todayKey(), lastPage: f };
  persistBotRange();
  qRange = { from: f, to: t };
  qPages = rangeSeq(f, t);
  quranMode = "read";
  return true;
}
function cacheBotRange(f, t){
  /* v3.0: البوت صار يُرفق مدى ورد اليوم بكل روابطه (قائمة، بطاقات، إرسال
     فوري) لا برابط المصحف وحده — فيُخزَّن المدى الواصل من أي تبويب بنفس
     دلالات التخزين المؤرّخ (صالح لليوم فقط)، مع إبقاء موضع القراءة الحالي
     إن كان داخل المدى نفسه، ودون فتح المصحف قسراً. */
  if (!validRange(f, t)) return false;
  const keep = botRange && botRange.date === todayKey()
    && rangeSeq(f, t).includes(botRange.lastPage) ? botRange.lastPage : f;
  botRange = { from: f, to: t, date: todayKey(), lastPage: keep };
  persistBotRange();
  return true;
}
function openQuranRange(range, startAt){
  if (!range || !validRange(range.from, range.to)) return;
  qRange = { from: range.from, to: range.to };
  qPages = rangeSeq(range.from, range.to);
  quranMode = "read";
  renderQuranReader(startAt);
}
function scheduleMushafSave(){
  if (botRange) botRange.lastPage = qCurrent;
  if (qSaveTimer) return;
  qSaveTimer = setTimeout(() => { qSaveTimer = null; persistBotRange(); }, 600);
}
function stopQuranObserver(){
  if (qObserver){ qObserver.disconnect(); qObserver = null; }
}
function quranProgressPct(){
  if (!qPages.length || qCurrent == null) return 0;
  const idx = qPages.indexOf(qCurrent);
  return idx < 0 ? 0 : Math.round(((idx + 1) / qPages.length) * 100);
}
/* وضع القارئ بملء الشاشة: يفعّله قارئا المصحف (تصفح/ورد) ويُلغيه ما عداهما.
   chrome-hidden حالة إخفاء موحّدة لكل طبقات التطبيق العائمة (الترويسة +
   شريط التنقّل + خيارات القارئ) — تُصفَّر عند أي تبديل وضع، فيبدأ الدخول
   ظاهراً دائماً ويستعيد الخروجُ الترويسةَ والتنقّلَ لتدفّقهما فوراً */
function setReaderMode(on){
  document.body.classList.toggle("reader-on", !!on);
  document.body.classList.remove("chrome-hidden");
}
function renderQuran(){
  stopQuranObserver();
  if (qView === "browse"){ renderBrowse(); return; }
  if (quranMode === "read" && qRange.from) renderQuranReader();
  else renderQuranHome();
}
function quranSectionHeadHTML(){
  return '<div class="sec-head"><h2 class="sec-title">المصحف — ورد القرآن</h2>' +
    '<p class="sec-date">' + esc(dateLine()) + '</p><p class="sec-date sec-hijri">' + esc(hijriLine()) + '</p></div>';
}
function renderQuranHome(){
  setReaderMode(false);
  /* تبويب المصحف بلا ترويسة عامة إطلاقاً (عنوان/تاريخ): مكررة مع شريط
     القارئ الذي يعرض السورة ورقم الصفحة — يبدأ المحتوى مباشرة */
  let html = kahfCardHTML() + '<div class="cards">';
  const range = getHomeRange();
  if (!range){

      '<p class="read-text">خطة وردك — صفحات كل يوم وموضعك في الختمة — موجودة في بوت مُذَكِّرٌ على تيليجرام، حتى لا يكون للورد إعدادان في مكانين.</p>' +
      '<p class="virtue">افتح رسالة ورد اليوم في البوت واضغط «📖 اقرأ ورد اليوم في المصحف»، وسيفتح المصحف هنا على صفحات وردك مباشرة.</p>' +
      '</div></article>';
    html += '<article class="card read-card"><div class="card-main">' +
      '<h3 class="read-head">📖 تصفح المصحف بحرية</h3>' +
      '<p class="virtue">المصحف كاملاً بين يديك في أي وقت: أي صفحة وبأي ترتيب، وموضع تصفحك محفوظ هنا — منفصل تماماً عن وردك.</p>' +
      '<div class="q-actions"><button class="q-btn primary" type="button" id="qBrowseOpen">افتح المصحف</button></div>' +
      '</div></article>';
    contentEl.innerHTML = html + '</div>';
    bindKahf();
    document.getElementById("qBrowseOpen").addEventListener("click", () => openBrowse(browsePage));
    return;
  }
  const resume = quranResumePage(range);
  const partial = resume !== range.from;
  html += '<article class="card read-card"><div class="card-main">' +
    '<h3 class="read-head">📖 ' + (range.isToday ? 'ورد اليوم من البوت' : 'آخر ورد وصلك من البوت') + '</h3>' +
    '<p class="read-text">الصفحات من ' + toAr(range.from) + ' إلى ' + toAr(range.to) + '\n' +
    'عدد الصفحات: ' + toAr(range.count) +
    (partial ? '\nآخر موضع وصلت إليه: صفحة ' + toAr(resume) : '') + '</p>' +
    '<p class="virtue">لتعديل خطة الورد أو موعده: من البوت في «🎯 وردي». والإتمام يُعلَّم من البوت أيضاً ليُحسب يومك ويتقدّم موضعك.</p>' +
    '<div class="q-actions">' +
    '<button class="q-btn primary" type="button" id="qReadToday">' + (partial ? 'أكمل القراءة' : 'اقرأ الورد') + '</button>' +
    '</div></div></article>';
  html += '<article class="card read-card"><div class="card-main">' +
    '<h3 class="read-head">📖 تصفح حر خارج الورد</h3>' +
    '<p class="virtue">اقرأ أي صفحة من المصحف في أي وقت — موضع التصفح منفصل تماماً عن موضع ختمتك عند البوت.</p>' +
    '<div class="q-actions"><button class="q-btn" type="button" id="qBrowseOpen">افتح التصفح الحر</button></div>' +
    '</div></article>';
  html += '</div>';
  contentEl.innerHTML = html;
  bindKahf();
  document.getElementById("qBrowseOpen").addEventListener("click", () => openBrowse(browsePage));
  document.getElementById("qReadToday").addEventListener("click", () => {
    openQuranRange(range, resume);
  });
}
function mountQuranImg(wrap, p, attempt){
  attempt = attempt || 0;
  /* صفحة جديدة تبدأ من أعلى منطقة القراءة (يهمّ في الأفقي القابل للتمرير) */
  const stg = wrap.closest ? wrap.closest(".q-stage") : null;
  if (stg) stg.scrollTop = 0;
  wrap.classList.add("loading");
  wrap.innerHTML = "";
  const img = document.createElement("img");
  img.className = "q-page-img";
  img.setAttribute("loading", "lazy");
  img.setAttribute("decoding", "async");
  img.alt = "صفحة " + toAr(p) + " من المصحف";
  img.addEventListener("load", () => {
    img.classList.add("loaded"); wrap.classList.remove("loading");
    refreshMarker(wrap, p);
  });
  img.addEventListener("error", () => {
    if (attempt < QIMG_BASES.length - 1){ mountQuranImg(wrap, p, attempt + 1); return; }
    wrap.classList.remove("loading");
    wrap.innerHTML = '<div class="q-img-fallback">تعذّر تحميل الصفحة — تحقق من الاتصال<br>' +
      '<button class="q-btn" type="button">إعادة المحاولة</button></div>';
    wrap.querySelector("button").addEventListener("click", () => mountQuranImg(wrap, p, 0));
  });
  img.src = quranImgUrl(p, attempt);
  wrap.appendChild(img);
  attachPageTools(wrap, p);
}
function updateQuranHead(){
  if (qCurrent == null) return;
  const idx = qPages.indexOf(qCurrent);
  /* سطر المعلومات فوق الصورة: سورة | صفحة | جزء */
  const sEl = document.getElementById("qSurah");
  if (sEl) sEl.textContent = "سورة " + SURA_NAMES[suraOfPage(qCurrent)];
  const pEl = document.getElementById("qPage");
  if (pEl) pEl.textContent = "صفحة " + toAr(qCurrent);
  const jEl = document.getElementById("qJuz");
  if (jEl) jEl.textContent = "الجزء " + toAr(juzOfPage(qCurrent));
  const bar = document.getElementById("qBar");
  if (bar) bar.style.width = quranProgressPct() + "%";
  document.getElementById("qPrev").disabled = idx <= 0;
  document.getElementById("qNext").disabled = idx < 0 || idx >= qPages.length - 1;
}
function quranGoTo(p){
  const el = document.getElementById("qp" + p);
  if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
}
/* قارئ الورد بملء الشاشة: صفحة واحدة في كل مرة (أزرار/سحب RTL) والصورة
   كاملة داخل الشاشة بلا تمرير؛ بانر الإتمام يظهر عند آخر صفحة فقط */
function showWirdPage(p, dir){
  if (!qPages.includes(p)) return;
  const d = dir || 0;
  qCurrent = p;
  updateQuranHead();
  scheduleMushafSave();
  const wrap = document.getElementById("qWrap");
  if (wrap){
    mountQuranImg(wrap, p);
    if (d){
      wrap.classList.remove("b-anim-next", "b-anim-prev");
      void wrap.offsetWidth;
      wrap.classList.add(d > 0 ? "b-anim-next" : "b-anim-prev");
    }
  }
  const end = document.getElementById("qEnd");
  if (end) end.style.display = (p === qPages[qPages.length - 1]) ? "" : "none";
}
function renderQuranReader(startAt){
  stopQuranObserver();
  if (!qRange.from || !qPages.length){ quranMode = "home"; renderQuranHome(); return; }
  setReaderMode(true);
  const f = qRange.from, t = qRange.to;
  qCurrent = qPages.includes(startAt) ? startAt
    : (botRange && qPages.includes(botRange.lastPage) ? botRange.lastPage : f);
  let html = '<div class="q-reader">' +
    '<div class="q-info">' +
    '<span class="q-info-surah" id="qSurah"></span>' +
    '<span class="q-info-page" id="qPage"></span>' +
    '<span class="q-info-juz" id="qJuz"></span></div>' +
    '<div class="q-stage"><div class="q-page-card"><div class="q-img-wrap loading" id="qWrap"></div></div></div>' +
    '<div class="done-banner q-end q-end-compact" id="qEnd" style="display:none"><p>أتممت ورد القرآن اليوم؟ علّمه في البوت بزر «📖 أتممت ورد القرآن» ليُحسب في يومك ويتقدّم موضعك في الختمة 🤲</p>' +
    '<div class="q-actions"><button class="q-btn" type="button" id="qEndExit">إنهاء</button></div></div>' +
    '<div class="q-dock"><div class="q-dock-btns">' +
    '<button class="q-btn" type="button" id="qPrev">السابق</button>' +
    '<button class="q-btn" type="button" id="qExit">إنهاء</button>' +
    '<button class="q-btn" type="button" id="qNext">التالي</button>' +
    '<button class="q-btn" type="button" id="qToBrowse">تصفح حر</button>' +
    '</div>' +
    '<div class="bar"><i id="qBar"></i></div></div>' +
    '</div>';
  contentEl.innerHTML = html;
  mountQuranImg(document.getElementById("qWrap"), qCurrent);
  document.getElementById("qPrev").addEventListener("click", () => {
    const i = qPages.indexOf(qCurrent);
    if (i > 0) showWirdPage(qPages[i - 1], -1);
  });
  document.getElementById("qNext").addEventListener("click", () => {
    const i = qPages.indexOf(qCurrent);
    if (i >= 0 && i < qPages.length - 1) showWirdPage(qPages[i + 1], 1);
  });
  document.getElementById("qToBrowse").addEventListener("click", () => {
    if (qCurrent != null && botRange){ botRange.lastPage = qCurrent; persistBotRange(); }
    openBrowse(browsePage);
  });
  const exitFn = () => {
    if (qCurrent != null && botRange){ botRange.lastPage = qCurrent; persistBotRange(); }
    quranMode = "home"; renderQuran();
    window.scrollTo({ top: 0, behavior: "smooth" });
  };
  document.getElementById("qExit").addEventListener("click", exitFn);
  document.getElementById("qEndExit").addEventListener("click", exitFn);
  /* سحب RTL كالمصحف الورقي: إصبع نحو اليمين = التالي (يدخل من الشمال)،
     ونحو اليسار = السابق (يدخل من اليمين) — متوافق مع اتجاه الأزرار */
  const stage = document.getElementById("qWrap");
  let qtx = null, qty = null;
  stage.addEventListener("touchstart", ev => {
    const tch = ev.changedTouches[0]; qtx = tch.clientX; qty = tch.clientY;
  }, { passive: true });
  stage.addEventListener("touchend", ev => {
    if (qtx === null) return;
    const tch = ev.changedTouches[0];
    const dx = tch.clientX - qtx, dy = tch.clientY - qty;
    qtx = null;
    if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.4){
      const i = qPages.indexOf(qCurrent);
      if (dx > 0 && i >= 0 && i < qPages.length - 1) showWirdPage(qPages[i + 1], 1);
      else if (dx < 0 && i > 0) showWirdPage(qPages[i - 1], -1);
    }
  }, { passive: true });
  updateQuranHead();
  const end0 = document.getElementById("qEnd");
  if (end0) end0.style.display = (qCurrent === qPages[qPages.length - 1]) ? "" : "none";
  initReaderChrome(contentEl.querySelector(".q-reader"));
}

    if (m && validPage(+m.page) && typeof m.y === "number" && m.y >= 0 && m.y <= 1)
      marker = { page: +m.page, y: m.y };

}

  try{ if (marker) localStorage.setItem(MARKER_KEY, JSON.stringify(marker)); }catch(e){}
}

/* ----- علامة «هنا وقفت»: ضغطة طويلة على صورة أي صفحة (القارئان) ----- */
function renderMarkerInto(wrap, p){
  if (!marker || marker.page !== p) return;
  const d = document.createElement("div");
  d.className = "q-marker";
  /* الموضع يُحسب من صندوق الصورة نفسها لا من الحاوية: في قارئ ملء الشاشة
     قد تزيد الحاوية عن الصورة (حشو علوي/سفلي)، فالنسبة من الصورة أدق */
  const img = wrap.querySelector("img");
  if (img && img.offsetHeight > 0)
    d.style.top = (img.offsetTop + marker.y * img.offsetHeight) + "px";
  else
    d.style.top = (marker.y * 100) + "%";
  d.innerHTML = "<i></i><span>🔖 هنا وقفت — صفحة " + toAr(p) + " · " + esc(pageSpanText(p)) + "</span>";
  wrap.appendChild(d);
}
function refreshMarker(wrap, p){
  wrap.querySelectorAll(".q-marker").forEach(el => el.remove());
  renderMarkerInto(wrap, p);
}
function showMarkerToast(){
  let t = document.getElementById("mkToast");
  if (!t){
    t = document.createElement("div");
    t.id = "mkToast"; t.className = "mk-toast";
    document.body.appendChild(t);
  }
  t.textContent = "🔖 اتعلّمت علامة «هنا وقفت» على صفحة " + toAr(marker.page);
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}
function attachPageTools(wrap, p){
  renderMarkerInto(wrap, p);
  let timer = null, sx = 0, sy = 0;
  wrap.addEventListener("pointerdown", ev => {
    sx = ev.clientX; sy = ev.clientY;
    timer = setTimeout(() => {
      timer = null;
      const img = wrap.querySelector("img");
      const rect = (img && img.getBoundingClientRect().height > 0)
        ? img.getBoundingClientRect() : wrap.getBoundingClientRect();
      const y = Math.min(0.98, Math.max(0.02, (sy - rect.top) / rect.height));
      marker = { page: p, y: Math.round(y * 1000) / 1000 };
      persistMarker();
      document.querySelectorAll(".q-marker").forEach(el => el.remove());
      renderMarkerInto(wrap, p);
      showMarkerToast();
    }, 550);
  });
  wrap.addEventListener("pointermove", ev => {
    if (timer && (Math.abs(ev.clientX - sx) > 10 || Math.abs(ev.clientY - sy) > 10)){
      clearTimeout(timer); timer = null;
    }
  });
  ["pointerup", "pointercancel"].forEach(tn =>
    wrap.addEventListener(tn, () => { if (timer){ clearTimeout(timer); timer = null; } }));
}

    let px = null, py = null, pt = 0;
    stage.addEventListener("pointerdown", ev => {
      px = ev.clientX; py = ev.clientY; pt = Date.now();
    }, { passive: true });
    stage.addEventListener("pointerup", ev => {
      if (px === null) return;
      const moved = Math.hypot(ev.clientX - px, ev.clientY - py);
      const dt = Date.now() - pt;
      px = null;
      if (moved < 10 && dt < 350){
        if (readerEl.classList.contains("controls-hidden")){
          setChrome(false);
          arm();
        } else {
          clearTimeout(timer); timer = null;
          setChrome(true);
        }
      }
    }, { passive: true });
    stage.addEventListener("pointercancel", () => { px = null; }, { passive: true });
  }
  arm(); /* أول دخول: الخيارات ظاهرة ثم تختفي تلقائياً حتى تُكتشف النقرة */
}

/* ----- بطاقة الكهف: يوم الجمعة فقط، أعلى تبويب المصحف ----- */
function isFridayToday(){ return new Date().getDay() === 5; }
function kahfCardHTML(){
  if (!isFridayToday()) return "";
  return '<article class="card read-card kahf-card"><div class="card-main">' +
    '<h3 class="read-head">🕌 اليوم الجمعة — سورة الكهف</h3>' +
    '<p class="virtue">من سنن يوم الجمعة قراءة سورة الكهف (الصفحات ' + toAr(293) + '–' + toAr(304) + ' في مصحف المدينة).</p>' +
    '<div class="q-actions"><button class="q-btn primary" type="button" id="kahfGo">📖 اقرأها الآن</button></div>' +
    '</div></article>';
}
function bindKahf(){
  const b = document.getElementById("kahfGo");
  if (b) b.addEventListener("click", () => openBrowse(293));
}

/* ----- وضع التصفح الحر ----- */
function openBrowse(p){
  qView = "browse";
  if (validPage(p)) browsePage = p;
  persistBrowse();
  if (currentTab !== "quran"){ switchTab("quran"); return; }
  renderQuran();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
/* سطر معلومات التصفح فوق الصورة: سورة | صفحة | جزء — لصفحة معيّنة */
function setBrowseInfo(p){
  const s = document.getElementById("bSurah");
  if (s) s.textContent = "سورة " + SURA_NAMES[suraOfPage(p)];
  const pg = document.getElementById("bPage");
  if (pg) pg.textContent = "صفحة " + toAr(p);
  const j = document.getElementById("bJuz");
  if (j) j.textContent = "الجزء " + toAr(juzOfPage(p));
}
function updateBrowseHead(){
  if (!document.getElementById("bPage")) return;
  setBrowseInfo(browsePage);
  document.getElementById("bPrev").disabled = browsePage <= 1;
  document.getElementById("bNext").disabled = browsePage >= 604;
}
function browseGo(p, dir){
  p = Math.min(604, Math.max(1, p));
  const d = dir || (p > browsePage ? 1 : -1);
  browsePage = p;
  persistBrowse();
  updateBrowseHead();
  const chip = document.getElementById("bChip");
  if (chip) chip.textContent = "صفحة " + toAr(p);
  const wrap = document.getElementById("bWrap");
  if (wrap){
    mountQuranImg(wrap, p);
    wrap.classList.remove("b-anim-next", "b-anim-prev");
    void wrap.offsetWidth;
    wrap.classList.add(d > 0 ? "b-anim-next" : "b-anim-prev");
  }
  [p - 1, p + 1].forEach(n => {
    if (validPage(n)){ const im = new Image(); im.src = quranImgUrl(n); }
  });
}
function renderBrowse(){
  setReaderMode(true);
  let html = '<div class="q-reader">' + kahfCardHTML() +
    '<div class="q-info">' +
    '<span class="q-info-surah" id="bSurah"></span>' +
    '<span class="q-info-page" id="bPage"></span>' +
    '<span class="q-info-juz" id="bJuz"></span></div>' +
    '<div class="q-stage"><div class="q-page-card"><div class="q-img-wrap loading" id="bWrap"></div></div></div>' +
    '<div class="q-dock">' +
    '<div class="b-picker" id="bPicker" hidden>' +
    SURA_NAMES.map((n, i) => '<button class="b-surah" type="button" data-surah="' + i + '"><span>' + esc(n) + '</span><span class="b-surah-pg">صفحة ' + toAr(SURA_STARTS[i]) + '</span></button>').join("") +
    '</div>' +
    '<div class="q-dock-btns">' +
    '<button class="q-btn" type="button" id="bPrev">السابق</button>' +
    '<button class="q-btn" type="button" id="bSurahBtn">السورة ▾</button>' +
    '<button class="q-btn" type="button" id="bNext">التالي</button>' +
    (botRange ? '<button class="q-btn" type="button" id="bToWird">الورد</button>' : '') +
    '</div>' +
    '</div>' +
    '</div>';
  contentEl.innerHTML = html;
  bindKahf();
  mountQuranImg(document.getElementById("bWrap"), browsePage);
  [browsePage - 1, browsePage + 1].forEach(n => {
    if (validPage(n)){ const im = new Image(); im.src = quranImgUrl(n); }
  });
  document.getElementById("bPrev").addEventListener("click", () => browseGo(browsePage - 1, -1));
  document.getElementById("bNext").addEventListener("click", () => browseGo(browsePage + 1, 1));
  const picker = document.getElementById("bPicker");
  document.getElementById("bSurahBtn").addEventListener("click", () => { picker.hidden = !picker.hidden; });
  picker.querySelectorAll("[data-surah]").forEach(b => b.addEventListener("click", () => {
    picker.hidden = true;
    browseGo(SURA_STARTS[+b.getAttribute("data-surah")]);
  }));
  const tw = document.getElementById("bToWird");
  if (tw) tw.addEventListener("click", () => {
    qView = "wird"; renderQuran();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  const stage = document.getElementById("bWrap");
  let tx = null, ty = null;
  stage.addEventListener("touchstart", ev => {
    const t = ev.changedTouches[0]; tx = t.clientX; ty = t.clientY;
  }, { passive: true });
  stage.addEventListener("touchend", ev => {
    if (tx === null) return;
    const t = ev.changedTouches[0];
    const dx = t.clientX - tx, dy = t.clientY - ty;
    tx = null;
    /* اتجاه RTL كالمصحف الورقي: سحب الإصبع نحو اليمين = الصفحة التالية
       (تدخل منزلقة من الشمال)، ونحو اليسار = السابقة (من اليمين) */
    if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.4){
      if (dx > 0) browseGo(browsePage + 1, 1); else browseGo(browsePage - 1, -1);
    }
  }, { passive: true });
  updateBrowseHead();
  initReaderChrome(contentEl.querySelector(".q-reader"));
}

/* ================= متفرّقة (بلا عدّادات — تصفّح وبحث) ================= */
let miscState = { level: "cats", cat: -1, chapterId: null, highlight: null, query: "" };
let miscIndex = null;
function normalizeAr(s){
  return String(s)
    .replace(/[\u064B-\u065F]/g, "")
    .replace(/\u0640/g, "")
    .replace(/[\u0625\u0623\u0622]/g, "\u0627")
    .replace(/\u0649/g, "\u064A")
    .replace(/\u0629/g, "\u0647");
}
function buildMiscIndex(){
  if (miscIndex) return miscIndex;
  miscIndex = [];
  MISC_DATA.forEach((cat, ci) => {
    cat.chapters.forEach(ch => {
      ch.items.forEach(it => {
        miscIndex.push({ ci: ci, chapterId: ch.id, itemId: it.id,
          nTitle: normalizeAr(ch.title), nText: normalizeAr(it.text) });
      });
    });
  });
  return miscIndex;
}
function findChapter(chapterId){
  for (let ci = 0; ci < MISC_DATA.length; ci++){
    const ch = MISC_DATA[ci].chapters.find(c => c.id === chapterId);
    if (ch) return { ci: ci, cat: MISC_DATA[ci], chapter: ch };
  }
  return null;
}
function miscHeadHTML(title){
  return '<div class="sec-head"><h2 class="sec-title">' + esc(title) + '</h2>' +
    '<p class="sec-date">' + esc(dateLine()) + '</p><p class="sec-date sec-hijri">' + esc(hijriLine()) + '</p></div>';
}
function renderMisc(){
  if (miscState.level === "chapter") renderMiscChapter();
  else if (miscState.level === "cat") renderMiscCategory();
  else renderMiscHome();
}
function miscListHTML(){
  const q = normalizeAr(miscState.query.trim());
  if (q){
    const hits = buildMiscIndex().filter(e => e.nTitle.includes(q) || e.nText.includes(q));
    if (!hits.length) return '<p class="virtue">لا نتائج مطابقة لبحثك.</p>';
    let html = '<p class="progress-text">نتائج البحث: ' + toAr(hits.length) + '</p>';
    hits.slice(0, 60).forEach(e => {
      const found = findChapter(e.chapterId);
      const item = found.chapter.items.find(i => i.id === e.itemId);
      const snippet = item.text.length > 90 ? item.text.slice(0, 90) + "…" : item.text;
      html += '<button class="row-card" type="button" data-ch="' + e.chapterId + '" data-it="' + e.itemId + '">' +
        '<span class="result-main"><span class="result-text">' + esc(snippet).split("﴿").join("").split("﴾").join("") + '</span>' +
        '<span class="result-path">' + esc(found.cat.name) + ' ← ' + esc(found.chapter.title) + '</span></span></button>';
    });
    if (hits.length > 60) html += '<p class="virtue">تظهر أول ٦٠ نتيجة فقط — حدّد بحثك أكثر للوصول الأسرع.</p>';
    return html;
  }
  let html = "";
  MISC_DATA.forEach((cat, ci) => {
    html += '<button class="row-card" type="button" data-cat="' + ci + '">' +
      '<span class="row-title">' + esc(cat.name) + '</span>' +
      '<span class="row-count">' + toAr(cat.chapters.length) + ' فصلاً</span></button>';
  });
  return html;
}
function bindMiscList(){
  contentEl.querySelectorAll("[data-cat]").forEach(b => b.addEventListener("click", () => {
    miscState.level = "cat"; miscState.cat = +b.getAttribute("data-cat"); miscState.highlight = null;
    renderMisc(); window.scrollTo({ top: 0, behavior: "smooth" });
  }));
  contentEl.querySelectorAll("[data-ch]").forEach(b => b.addEventListener("click", () => {
    openMiscChapter(+b.getAttribute("data-ch"), +b.getAttribute("data-it"));
  }));
}
function renderMiscHome(){
  const html = miscHeadHTML("أدعية متفرقة") +
    '<div class="search-wrap"><input class="search-input" id="miscSearch" type="search" placeholder="ابحث عن دعاء أو ذكر…" value="' + esc(miscState.query).replace(/"/g, "&quot;") + '" autocomplete="off"></div>' +
    '<div class="rows" id="miscList">' + miscListHTML() + '</div>';
  contentEl.innerHTML = html;
  const input = document.getElementById("miscSearch");
  input.addEventListener("input", () => {
    miscState.query = input.value;
    document.getElementById("miscList").innerHTML = miscListHTML();
    bindMiscList();
  });
  bindMiscList();
}
function renderMiscCategory(){
  const cat = MISC_DATA[miscState.cat];
  let html = miscHeadHTML(cat.name) +
    '<div class="misc-nav"><button class="q-btn" type="button" id="miscBack">→ كل الأحوال</button></div>' +
    '<div class="rows">';
  cat.chapters.forEach(ch => {
    html += '<button class="row-card" type="button" data-ch="' + ch.id + '">' +
      '<span class="row-title">' + esc(ch.title) + '</span>' +
      '<span class="row-count">' + toAr(ch.items.length) + (ch.items.length === 1 ? ' دعاء' : ' أدعية') + '</span></button>';
  });
  html += '</div>';
  contentEl.innerHTML = html;
  document.getElementById("miscBack").addEventListener("click", () => {
    miscState.level = "cats"; miscState.highlight = null; renderMisc();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  contentEl.querySelectorAll("[data-ch]").forEach(b => b.addEventListener("click", () => {
    openMiscChapter(+b.getAttribute("data-ch"), null);
  }));
}
function renderMiscChapter(){
  const found = findChapter(miscState.chapterId);
  if (!found){ miscState.level = "cats"; renderMiscHome(); return; }
  let html = miscHeadHTML(found.chapter.title) +
    '<div class="misc-nav"><button class="q-btn" type="button" id="miscBack">→ ' + esc(found.cat.name) + '</button></div>' +
    '<div class="cards">';
  found.chapter.items.forEach(it => {
    html += '<article class="card read-card' + (miscState.highlight === it.id ? ' hl' : '') + '" id="mi' + it.id + '">' +
      '<div class="card-main"><p class="read-text dua-c">' + fmtDua(it.text) + '</p>' + (it.source ? '<p class="virtue src-line">' + esc(it.source) + '</p>' : '') + '</div></article>';
  });
  html += '</div>';
  contentEl.innerHTML = html;
  document.getElementById("miscBack").addEventListener("click", () => {
    miscState.level = "cat"; miscState.cat = found.ci; miscState.highlight = null; renderMisc();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  if (miscState.highlight != null){
    const el = document.getElementById("mi" + miscState.highlight);
    if (el) requestAnimationFrame(() => el.scrollIntoView({ block: "center", behavior: "smooth" }));
  }
}
function openMiscChapter(chapterId, itemId){
  const found = findChapter(chapterId);
  if (!found) return;
  miscState.level = "chapter"; miscState.cat = found.ci;
  miscState.chapterId = chapterId;
  miscState.highlight = itemId != null ? itemId : null;
  if (currentTab !== "misc") switchTab("misc"); else renderMisc();
}

/* ================= الأحاديث (المكتبة المعتمدة: hadith/dataset.json) ================= */
let hadithState = { level: "home", sec: -1 };
function stripBrackets(s){ return String(s).split("﴿").join("").split("﴾").join(""); }
function renderHadith(){
  if (hadithState.level === "sec") renderHadithSection();
  else renderHadithHome();
}
function renderHadithHome(){
  let html = miscHeadHTML("الأحاديث") + '<div class="rows">';
  HADITH_DATA.forEach((sec, si) => {
    html += '<button class="row-card" type="button" data-hsec="' + si + '">' +
      '<span class="row-title">' + esc(sec.name) + '</span>' +
      '<span class="row-count">' + toAr(sec.items.length) + (sec.items.length === 1 ? ' حديث' : ' حديثاً') + '</span></button>';
  });
  html += '</div>';
  contentEl.innerHTML = html;
  contentEl.querySelectorAll("[data-hsec]").forEach(b => b.addEventListener("click", () => {
    hadithState.level = "sec"; hadithState.sec = +b.getAttribute("data-hsec");
    renderHadith(); window.scrollTo({ top: 0, behavior: "smooth" });
  }));
}
function renderHadithSection(){
  const sec = HADITH_DATA[hadithState.sec];
  let html = miscHeadHTML(sec.name) +
    '<div class="misc-nav"><button class="q-btn" type="button" id="hadithBack">→ كل الأقسام</button></div>' +
    '<div class="cards">';
  sec.items.forEach(it => {
    html += '<article class="card read-card"><div class="card-main">' +
      '<h3 class="read-head">' + esc(it.h) + '</h3>' +
      '<p class="read-text">' + stripBrackets(esc(it.text)) + '</p>' +
      '<p class="virtue">الراوي: ' + esc(it.narrator) + '</p>' +
      '<p class="virtue src-line">' + esc(it.meta) + '</p>' +
      (it.note ? '<p class="virtue">' + esc(it.note) + '</p>' : '') +
      '</div></article>';
  });
  html += '</div>';
  contentEl.innerHTML = html;
  document.getElementById("hadithBack").addEventListener("click", () => {
    hadithState.level = "home"; renderHadith();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
}

/* ================= التهيئة ================= */
function init(){
  if (tg){ try{ tg.ready(); tg.expand(); }catch(e){} }
  initTheme();
  initCounts();
  loadBotRange();
  loadBrowse();
  qView = botRange ? "wird" : "browse";
  document.querySelectorAll(".nav-btn").forEach(b =>
    b.addEventListener("click", () => switchTab(b.getAttribute("data-tab"))));
  let initial = "athkar";
  try{
    const params = new URLSearchParams(window.location.search);
    let t = params.get("tab");
    if (t === "mushaf") t = "quran";
    if (t && ATHKAR_SECTIONS.includes(t)){ currentSection = t; initial = "athkar"; }
    else if (t && TABS.includes(t)) initial = t;
    const f = parseInt(params.get("from"), 10);
    const tt = parseInt(params.get("to"), 10);
    if (params.get("mode") === "browse"){
      /* عقد الجولة الثانية: ?mode=browse&page=N — تصفح حر على صفحة
         بعينها (زر الكهف في البوت)، فوق منطق مدى الورد القائم كما هو */
      initial = "quran";
      qView = "browse";
      const pg = parseInt(params.get("page"), 10);
      if (validPage(pg)){ browsePage = pg; persistBrowse(); }
      if (validRange(f, tt)) cacheBotRange(f, tt);
    } else if (t === "quran"){
      qView = "wird";
      applyDeepLinkRange(f, tt);
    } else if (validRange(f, tt)){
      cacheBotRange(f, tt);
    }
  }catch(e){}
  switchTab(initial);
}
init();
