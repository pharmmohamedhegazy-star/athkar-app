<!DOCTYPE html>
<!-- Mudhakir Mini App v4.0 -->
<!-- مُذَكِّرٌ — Mini App v3.4 — حصن المسلم + أدعية قرآنية موثقة + ورد القرآن بمصدر واحد (البوت) -->
<html dir="rtl" lang="ar" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>مُذَكِّرٌ — الأذكار والورد اليومي</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#FAF6EF; --card:#FFFDF8; --primary:#1E5B45; --primary-soft:rgba(30,91,69,.08);
    --gold:#C9A227; --text:#22302A; --muted:#6B7A70; --border:rgba(30,91,69,.13);
    --done-bg:#EAF3EC; --done-border:rgba(30,91,69,.35);
    --shadow:0 6px 20px rgba(34,48,42,.06);
    --header-bg:rgba(250,246,239,.9);
  }
  [data-theme="dark"]{
    --bg:#0C1410; --card:#15211B; --primary:#8FC1A6; --primary-soft:rgba(143,193,166,.13);
    --gold:#C9A227; --text:#EDE8DC; --muted:#9DB4A6; --border:rgba(143,193,166,.18);
    --done-bg:#182A20; --done-border:rgba(143,193,166,.4);
    --shadow:none;
    --header-bg:rgba(12,20,16,.9);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; background:var(--bg); color:var(--text); text-align:right;
    font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
    transition:background-color .3s ease, color .3s ease;
    padding-bottom:calc(86px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:560px; margin:0 auto; padding:0 16px;}

  /* ===== الرأس ===== */
  header{
    position:sticky; top:0; z-index:50; background:var(--header-bg);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }
  .header-in{
    position:relative; max-width:560px; margin:0 auto; padding:12px 16px; min-height:32px;
    display:flex; flex-direction:row; direction:rtl; align-items:center; justify-content:space-between;
  }
  /* الاسم عند بداية السطر (اليمين في RTL) وزر الوضع الليلي عند نهايته (اليسار) */
  .brand{order:1;}
  .header-in .icon-btn{margin-inline-start:auto;}
  .icon-btn{order:2;}
  .brand{font-size:25px; font-weight:700; color:var(--primary); letter-spacing:.2px; position:absolute; left:50%; transform:translateX(-50%); white-space:nowrap;}
  .icon-btn{
    width:44px; height:44px; border-radius:50%; border:1px solid var(--border);
    background:var(--card); color:var(--primary); cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:19px;
    transition:transform .15s ease, background-color .3s ease;
  }
  .icon-btn:active{transform:scale(.92);}

  /* ===== رأس القسم والتقدم ===== */
  .sec-head{padding:22px 0 6px; text-align:center;}
  .sec-title{font-size:24px; font-weight:700; margin:0 0 4px;}
  .sec-date{font-size:13px; color:var(--muted); margin:0 0 12px;}
  .sec-date.sec-hijri{margin-top:-9px; font-size:12.5px;}
  .progress-row{display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .progress-text{font-size:13.5px; color:var(--muted); font-weight:600;}
  .reset-btn{
    border:none; background:none; color:var(--primary); cursor:pointer;
    font-family:inherit; font-size:13px; font-weight:600; padding:8px 4px; min-height:44px;
  }
  .bar{height:5px; border-radius:99px; background:var(--primary-soft); margin-top:8px; overflow:hidden;}
  .bar > i{display:block; height:100%; border-radius:99px; background:var(--primary); width:0; transition:width .35s ease;}
  .done-banner{
    scroll-margin-top:84px;
    margin-top:14px; padding:12px 16px; border-radius:14px; text-align:right;
    background:var(--done-bg); border:1px solid var(--done-border);
    color:var(--primary); font-weight:700; font-size:15px;
  }

  /* ===== البطاقات ===== */
  .cards{display:flex; flex-direction:column; gap:14px; padding:14px 0 8px;}
  .card{
    scroll-margin-top:84px;
    background:var(--card); border:1px solid var(--border); border-radius:18px;
    box-shadow:var(--shadow); padding:18px; cursor:pointer; user-select:none;
    display:flex; flex-direction:column; gap:12px;
    transition:background-color .3s ease, border-color .3s ease, transform .1s ease;
  }
  .card:active{transform:scale(.99);}
  .card.done{background:var(--done-bg); border-color:var(--done-border); cursor:default;}
  .card-main{flex:1; min-width:0;}
  .card-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px;}
  .chip{
    font-size:11.5px; font-weight:600; color:var(--muted);
    border:1px solid var(--border); border-radius:99px; padding:2px 9px;
  }
  .done-badge{
    display:none; font-size:11.5px; font-weight:700; color:var(--primary);
    background:var(--primary-soft); border-radius:99px; padding:2px 9px;
  }
  .card.done .done-badge{display:inline-block;}
  .card.done .chip{display:none;}
  .dhikr{
    font-family:'Amiri',serif; font-size:21px; line-height:2.1; margin:0;
    color:var(--text); white-space:pre-line; text-align:center;
  }
  .virtue{font-size:12.5px; line-height:1.9; color:var(--muted); margin:10px 0 0;}
.src-line{text-align:center;}
  .virtue::before{content:"✦ "; color:var(--gold);}
  /* محاذاة يمين صريحة لكل المحتوى النصي (طلب المالك) — يبقى في المنتصف فقط:
     رقم «المتبقي» داخل دائرته (flex)، وشارة رقم صفحة المصحف، وعناوين شريط التنقل (flex) */
  .virtue,.read-head,.read-text,.progress-text{text-align:right;}
  .counter{
    flex:0 0 auto; align-self:center; width:66px; height:66px; border-radius:50%;
    border:2px solid var(--primary); color:var(--primary);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:var(--primary-soft);
  }
  .counter .rem{font-size:21px; font-weight:700; line-height:1.1;}
  .counter .rem-label{font-size:10px; font-weight:600; color:var(--muted);}
  .card.done .counter{border-color:var(--done-border); background:transparent; font-size:24px;}
  .read-card{cursor:default;}
  .read-card:active{transform:none;}
  .read-head{font-size:16px; font-weight:700; color:var(--primary); margin:0 0 10px;}
  .read-text{font-family:'Amiri',serif; font-size:20px; line-height:2.1; white-space:pre-line; margin:0;}

  /* ===== شريط التنقل السفلي ===== */
  nav{
    position:fixed; bottom:0; inset-inline:0; z-index:50;
    background:var(--card); border-top:1px solid var(--border);
    padding-bottom:env(safe-area-inset-bottom);
    transition:background-color .3s ease;
  }
  .nav-in{max-width:560px; margin:0 auto; display:flex; direction:rtl;}
  .nav-btn{
    flex:1; border:none; background:none; cursor:pointer; font-family:inherit;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:9px 0 7px; min-height:56px; color:var(--muted);
    font-size:11px; font-weight:600; transition:color .2s ease; white-space:nowrap;
  }
  .nav-btn svg{width:23px; height:23px;}
  .nav-btn.active{color:var(--primary);}
  .nav-btn.active .nav-ico{
    background:var(--primary-soft); border-radius:99px; padding:3px 9px;
  }
  .nav-ico{display:flex; padding:3px 9px; border-radius:99px; transition:background-color .2s ease;}

  /* ===== المصحف ===== */
  .q-actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;}
  .q-btn{
    border:1px solid var(--border); background:var(--card); color:var(--primary);
    font-family:inherit; font-size:14px; font-weight:700; cursor:pointer;
    border-radius:99px; padding:10px 20px; min-height:44px;
    transition:transform .12s ease, background-color .3s ease;
  }
  .q-btn:active{transform:scale(.97);}
  .q-btn.primary{background:var(--primary); border-color:var(--primary); color:#FFFDF8;}
  [data-theme="dark"] .q-btn.primary{color:#0C1410;}
  .q-btn[disabled]{opacity:.4; cursor:default;}
  .q-btn[disabled]:active{transform:none;}
  .q-danger-btn{
    background:none; border:none; color:#B3261E; font-family:inherit;
    font-size:14px; font-weight:700; cursor:pointer; padding:8px 0; min-height:44px;
    text-align:right;
  }
  .q-end p{margin:0;}
  /* سطر معلومات القارئ — وحده فوق الصورة: السورة يميناً، رقم الصفحة
     في الوسط، رقم الجزء شمالاً. لا عناصر تحكم فوق الصورة غيره */
  .q-info{
    flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:1px 4px 0; font-size:12.5px; font-weight:600; color:var(--muted);
  }
  .q-info-surah{color:var(--primary); font-weight:700; white-space:nowrap;}
  .q-info-page{flex:1 1 auto; text-align:center; color:var(--text); font-weight:700; white-space:nowrap;}
  .q-info-juz{white-space:nowrap;}
  /* كتلة التنقّل أسفل الصورة: أزرار (السابق | السورة | التالي)، وفي الورد
     تحتها شريط التقدم خطاً رفيعاً ملتصقاً بها في نفس الكتلة النحيفة.
     (سلايدر التصفح أُزيل بقرار محمد 2026-11-12 بعد تجربة المعاينة.) */
  .q-dock{
    flex:0 0 auto; z-index:40;
    background:var(--header-bg); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border:1px solid var(--border); border-radius:12px; padding:5px 8px 6px;
  }
  .q-dock-btns{display:flex; align-items:center; gap:6px;}
  .q-dock-btns .q-btn{padding:3px 10px; min-height:34px; font-size:13px; flex:1 1 0;}
  .q-dock .bar{height:4px; margin-top:5px;}
  .q-dock .b-picker{margin:0 0 6px;}
  .q-page{margin-top:0;}
  .q-chip{
    display:inline-block; font-size:12px; font-weight:700; color:var(--primary);
    background:var(--primary-soft); border:1px solid var(--border);
    border-radius:99px; padding:3px 12px; margin-bottom:8px;
  }
  .q-page-card{
    background:#FFFDF7; border:1px solid rgba(30,91,69,.15); border-radius:18px;
    box-shadow:0 6px 20px rgba(34,48,42,.08); padding:10px;
  }
  .q-img-wrap{position:relative; border-radius:10px; overflow:hidden; background:#F1EAD9;}
  .q-img-wrap.loading::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(100deg, rgba(255,255,255,0) 30%, rgba(255,255,255,.55) 50%, rgba(255,255,255,0) 70%);
    background-size:200% 100%; animation:qshimmer 1.3s infinite linear;
  }
  @keyframes qshimmer{from{background-position:180% 0;} to{background-position:-80% 0;}}
  .q-page-img{display:block; width:100%; height:auto; aspect-ratio:1260/2038; opacity:0; transition:opacity .35s ease, filter .35s ease;}
  .q-page-img.loaded{opacity:1;}
  /* فلتر ليلي لصفحات المصحف: الورقة الساطعة تُخفت لدرجة ورقية دافئة في الوضع الليلي */
  [data-theme="dark"] .q-page-card{background:#2A241A; border-color:rgba(201,162,39,.22); box-shadow:none;}
  [data-theme="dark"] .q-img-wrap{background:#241E14;}
  [data-theme="dark"] .q-page-img{filter:brightness(.86) sepia(.32) saturate(.88) contrast(.97);}
  .q-img-fallback{
    padding:34px 16px; text-align:right; color:#6B7A70;
    font-size:14px; font-weight:600; line-height:2;
  }
  .q-img-fallback .q-btn{border-color:rgba(30,91,69,.3); color:#1E5B45; background:transparent; margin-top:8px;}
  .q-end{margin:18px 0 6px; text-align:right;}
  .q-end .q-btn{margin-top:12px;}
  /* ===== v5: التصفح الحر + علامة «هنا وقفت» + بطاقة الكهف ===== */
  .b-picker{
    max-height:190px; overflow:auto; margin-top:8px;
    border:1px solid var(--border); border-radius:12px; padding:4px 6px;
  }
  .b-picker[hidden]{display:none;}
  .b-surah{
    display:flex; justify-content:space-between; align-items:center; width:100%;
    background:none; border:none; border-bottom:1px solid var(--border);
    font-family:inherit; font-size:14px; font-weight:600; color:var(--text);
    padding:9px 8px; min-height:44px; cursor:pointer; text-align:right;
  }
  .b-surah:last-child{border-bottom:none;}
  .b-surah-pg{color:var(--muted); font-size:12.5px; font-weight:600;}
  .q-marker{position:absolute; left:0; right:0; height:0; z-index:5; pointer-events:none;}
  .q-marker i{position:absolute; left:0; right:0; top:-1px; height:2px; background:#C0392B; opacity:.85; display:block;}
  .q-marker span{
    position:absolute; top:-11px; inset-inline-start:8px; background:#C0392B; color:#fff;
    font-size:11.5px; font-weight:700; border-radius:99px; padding:2px 10px; white-space:nowrap;
  }
  .kahf-card{border:1.5px solid var(--primary);}
  .mk-toast{
    position:fixed; left:50%; bottom:92px; transform:translateX(-50%) translateY(8px);
    background:var(--primary); color:#FFFDF8; font-size:13.5px; font-weight:700;
    border-radius:99px; padding:9px 18px; z-index:90; opacity:0; pointer-events:none;
    transition:opacity .25s ease, transform .25s ease; white-space:nowrap;
  }
  .mk-toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  @keyframes bslideL{from{transform:translateX(-26px); opacity:.35;} to{transform:translateX(0); opacity:1;}}
  @keyframes bslideR{from{transform:translateX(26px); opacity:.35;} to{transform:translateX(0); opacity:1;}}
  .b-anim-next{animation:bslideL .28s ease;}
  .b-anim-prev{animation:bslideR .28s ease;}
  /* ===== قارئ المصحف بملء الشاشة (إصلاح الارتفاع ثم جولة التكبير —
     قرار محمد 2026-11-12: «كلما أخذ المصحف حيزاً أكبر من الشاشة كان
     أفضل»): عند تفعيل أي قارئ (تصفح حر أو ورد) تنكمش الترويسة العامة
     إلى سطر نحيف، وتصير الحاوية بملء 100dvh وتمتد منطقة القراءة بعرض
     الشاشة كاملاً — وبامتداد أخير (2026-11-12): بلا أي خصم إطلاقاً،
     فالترويسة وشريط التنقّل نفسهما عائمان فوق الصورة (الكتلة التالية).
     الخيارات (سطر المعلومات + كتلة التنقّل) طبقات عائمة فوق الصورة في
     الوضعين وتختفي تلقائياً أثناء القراءة (الكتلة التالية)، فالطولي:
     أقصى عرض مع سقف ارتفاع يمنع أي تمرير طولي مهما كان المقاس؛
     والأفقي: عرض الشاشة كاملاً مع تمرير داخلي (كتلة الأفقي أدناه) ===== */
  body.reader-on{overflow:hidden; padding-bottom:0;}
  /* ملء الشاشة الكامل (قرار محمد 2026-11-12): كل شيء طافٍ فوق المصحف —
     الترويسة (البراند + زر الوضع) وشريط تنقّل التطبيق أيضاً طبقتان
     عائمتان، والحاوية بارتفاع الشاشة كاملاً 100dvh دون أي خصم،
     والصورة تمتد تحت كل الطبقات */
  body.reader-on header{
    position:fixed; top:0; inset-inline:0; z-index:60;
    transition:opacity .25s ease, visibility .25s ease;
  }
  body.reader-on header .header-in{padding:4px 16px; min-height:0;}
  body.reader-on .brand{font-size:19px;}
  body.reader-on .icon-btn{width:36px; height:36px; font-size:16px;}
  body.reader-on nav{transition:opacity .25s ease, visibility .25s ease;}
  /* حالة الإخفاء الموحّدة: body.chrome-hidden تديرها initReaderChrome
     مع .controls-hidden على القارئ نفسه — كل كروم التطبيق يتلاشى معاً
     ويكفّ عن اعتراض اللمس، ونقرة واحدة تبدّل الجميع */
  body.reader-on.chrome-hidden header,
  body.reader-on.chrome-hidden nav{
    opacity:0; visibility:hidden; pointer-events:none;
  }
  body.reader-on main.wrap{
    height:100vh; height:100dvh;
    display:flex; flex-direction:column;
    /* تكبير: لا حدّ أقصى لعرض الحاوية ولا هوامش جانبية أثناء القراءة */
    max-width:none; padding-left:0; padding-right:0;
  }
  body.reader-on footer{display:none;}
  body.reader-on #content{flex:1 1 auto; min-height:0; display:flex; flex-direction:column;}
  .q-reader{flex:1 1 auto; min-height:0; display:flex; flex-direction:column; gap:6px; padding-top:4px; position:relative;}
  .q-stage{flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center;}
  .q-stage .q-page-card{
    /* إطار البطاقة وحشوتها أُزيلا نهائياً: الصورة من الحافة للحافة */
    height:100%; max-height:100%; width:100%; max-width:100%; padding:0;
    border:none; border-radius:0; box-shadow:none; background:transparent;
    display:flex; align-items:center; justify-content:center;
  }
  .q-stage .q-img-wrap{
    height:100%; max-height:100%; width:100%; max-width:100%; border-radius:0;
    display:flex; align-items:center; justify-content:center;
  }
  .q-stage .q-page-img{
    /* أقصى حجم في الطولي: العرض كاملاً، والارتفاع مسقوف بارتفاع المنطقة
       فتُصغَّر الصورة عند اللزوم ولا تُقصّ ولا تُمرَّر أبداً، وتتوسّط
       عمودياً داخل الحاوية (flex) */
    width:100%; height:auto; max-width:100%; max-height:100%;
    object-fit:contain; aspect-ratio:auto;
  }
  /* مطابقة خلفية منطقة القراءة للون حافة صفحة المصحف في الوضع الفاتح
     (طلب محمد 2026-11-12: الصفحة «لازقة» في أطراف الشاشة بلا حدود):
     لون الحافة قِيس من ملفات الصفحات نفسها — أبيض ناصع rgb(255,255,255)
     في الحواف الأربع وبين الأسطر — فتُطلى منطقة القراءة كلها به فتندمج
     الصفحة فيها ولا تظهر لها حدود. الوضع الداكن مستثنى قصداً: تبقى
     البطاقة الفاتحة على الداكن كما هي */
  html:not([data-theme="dark"]) body.reader-on main.wrap,
  html:not([data-theme="dark"]) body.reader-on .q-reader,
  html:not([data-theme="dark"]) body.reader-on .q-stage,
  html:not([data-theme="dark"]) body.reader-on .q-stage .q-img-wrap{
    background:#FFFFFF;
  }
  .q-reader .q-chip{display:none;}
  .q-end-compact{flex:0 0 auto; margin:0; padding:8px 12px; font-size:13px;}
  .q-end-compact .q-actions{margin-top:6px;}
  .q-end-compact .q-btn{min-height:33px; padding:3px 14px; font-size:13px;}
  /* ===== طبقات عائمة + إخفاء تلقائي (قرار محمد 2026-11-12) =====
     سطر المعلومات وكتلة التنقّل وبطاقة الكهف وبانر إتمام الورد طبقات
     عائمة فوق الصورة في الوضعين الطولي والأفقي معاً — لا تخصم بكسلًا
     واحداً من حجم المصحف. و«الخيارات» (المعلومات + التنقّل) تختفي
     تلقائياً بعد ~٣ ثوانٍ من عدم التفاعل: initReaderChrome تضيف
     .controls-hidden فتتلاشى الطبقتان تماماً (شفافية + visibility)
     وتكفّان عن اعتراض اللمس، ونقرة واحدة على الصفحة تبدّل إظهارها —
     فيأخذ المصحف الشاشة كاملة حرفياً أثناء القراءة */
  body.reader-on .q-info{
    /* أسفل الترويسة العائمة (~45px) حتى لا تتداخل الكبسولتان */
    position:absolute; top:52px; inset-inline:10px; z-index:30;
    padding:4px 14px; border-radius:99px; font-size:11.5px;
    background:var(--header-bg); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border:1px solid var(--border); box-shadow:var(--shadow);
    transition:opacity .25s ease, visibility .25s ease;

    transition:opacity .25s ease, visibility .25s ease;
  }
  body.reader-on .q-reader.controls-hidden .q-info,
  body.reader-on .q-reader.controls-hidden .q-dock{
    opacity:0; visibility:hidden; pointer-events:none;
  }

    position:absolute; top:90px; inset-inline:10px; z-index:25;

     بعرض الشاشة كاملاً وارتفاعها الطبيعي أكبر من الشاشة، فتُقرأ بخط

      touch-action:pan-y; overscroll-behavior:contain; scrollbar-width:none;
    }

     "text": "اللَّهُمَّ مَالِكَ الْمُلْكِ تُؤْتِي الْمُلْكَ مَن تَشَاءُ وَتَنزِعُ الْمُلْكَ مِمَّن تَشَاءُ وَتُعِزُّ مَن تَشَاءُ وَتُذِلُّ مَن تَشَاءُ ۖ بِيَدِكَ الْخَيْرُ ۖ إِنَّكَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ تُولِجُ اللَّيْلَ فِي النَّهَارِ وَتُولِجُ النَّهَارَ فِي اللَّيْلِ ۖ وَتُخْرِجُ الْحَيَّ مِنَ الْمَيِّتِ وَتُخْرِجُ الْمَيِّتَ مِنَ الْحَيِّ ۖ وَتَرْزُقُ مَن تَشَاءُ بِغَيْرِ حِسَابٍ",
     "source": "(سورة آل عمران — من الآيات ٢٦–٢٧)"
    },
    {
     "id": 90066,
     "text": "رَبَّنَا إِنَّكَ تَعْلَمُ مَا نُخْفِي وَمَا نُعْلِنُ ۗ وَمَا يَخْفَىٰ عَلَى اللَّهِ مِن شَيْءٍ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ",
     "source": "(سورة إبراهيم — الآية ٣٨)"
    },
    {
     "id": 90067,
     "text": "رَبِّ أَوْزِعْنِي أَنْ أَشْكُرَ نِعْمَتَكَ الَّتِي أَنْعَمْتَ عَلَيَّ وَعَلَىٰ وَالِدَيَّ وَأَنْ أَعْمَلَ صَالِحًا تَرْضَاهُ وَأَدْخِلْنِي بِرَحْمَتِكَ فِي عِبَادِكَ الصَّالِحِينَ",
     "source": "(سورة النمل — من الآية ١٩)"
    },
    {
     "id": 90068,
     "text": "رَبِّ بِمَا أَنْعَمْتَ عَلَيَّ فَلَنْ أَكُونَ ظَهِيرًا لِّلْمُجْرِمِينَ",
     "source": "(سورة القصص — من الآية ١٧)"
    },
    {
     "id": 90069,
     "text": "اللَّهُمَّ فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ عَالِمَ الْغَيْبِ وَالشَّهَادَةِ أَنتَ تَحْكُمُ بَيْنَ عِبَادِكَ فِي مَا كَانُوا فِيهِ يَخْتَلِفُونَ",
     "source": "(سورة الزمر — من الآية ٤٦)"
    }
   ]
  },
  {
   "id": 9008,
   "title": "الجنة والنجاة من النار",
   "items": [
    {
     "id": 90058,
     "text": "رَبَّنَا مَا خَلَقْتَ هَٰذَا بَاطِلًا سُبْحَانَكَ فَقِنَا عَذَابَ النَّارِ رَبَّنَا إِنَّكَ مَن تُدْخِلِ النَّارَ فَقَدْ أَخْزَيْتَهُ ۖ وَمَا لِلظَّالِمِينَ مِنْ أَنصَارٍ رَّبَّنَا إِنَّنَا سَمِعْنَا مُنَادِيًا يُنَادِي لِلْإِيمَانِ أَنْ آمِنُوا بِرَبِّكُمْ فَآمَنَّا ۚ رَبَّنَا فَاغْفِرْ لَنَا ذُنُوبَنَا وَكَفِّرْ عَنَّا سَيِّئَاتِنَا وَتَوَفَّنَا مَعَ الْأَبْرَارِ رَبَّنَا وَآتِنَا مَا وَعَدتَّنَا عَلَىٰ رُسُلِكَ وَلَا تُخْزِنَا يَوْمَ الْقِيَامَةِ ۗ إِنَّكَ لَا تُخْلِفُ الْمِيعَادَ",
     "source": "(سورة آل عمران — من الآيات ١٩١–١٩٤)"
    },
    {
     "id": 90059,
     "text": "فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ أَنتَ وَلِيِّي فِي الدُّنْيَا وَالْآخِرَةِ ۖ تَوَفَّنِي مُسْلِمًا وَأَلْحِقْنِي بِالصَّالِحِينَ",
     "source": "(سورة يوسف — من الآية ١٠١)"
    },
    {
     "id": 90060,
     "text": "رَبَّنَا اصْرِفْ عَنَّا عَذَابَ جَهَنَّمَ ۖ إِنَّ عَذَابَهَا كَانَ غَرَامًا إِنَّهَا سَاءَتْ مُسْتَقَرًّا وَمُقَامًا",
     "source": "(سورة الفرقان — من الآيات ٦٥–٦٦)"
    },
    {
     "id": 90061,
     "text": "وَلَا تُخْزِنِي يَوْمَ يُبْعَثُونَ يَوْمَ لَا يَنفَعُ مَالٌ وَلَا بَنُونَ إِلَّا مَنْ أَتَى اللَّهَ بِقَلْبٍ سَلِيمٍ",
     "source": "(سورة الشعراء — الآيات ٨٧–٨٩)"
    },
    {
     "id": 90062,
     "text": "رَبَّنَا وَسِعْتَ كُلَّ شَيْءٍ رَّحْمَةً وَعِلْمًا فَاغْفِرْ لِلَّذِينَ تَابُوا وَاتَّبَعُوا سَبِيلَكَ وَقِهِمْ عَذَابَ الْجَحِيمِ رَبَّنَا وَأَدْخِلْهُمْ جَنَّاتِ عَدْنٍ الَّتِي وَعَدتَّهُمْ وَمَن صَلَحَ مِنْ آبَائِهِمْ وَأَزْوَاجِهِمْ وَذُرِّيَّاتِهِمْ ۚ إِنَّكَ أَنتَ الْعَزِيزُ الْحَكِيمُ وَقِهِمُ السَّيِّئَاتِ ۚ وَمَن تَقِ السَّيِّئَاتِ يَوْمَئِذٍ فَقَدْ رَحِمْتَهُ ۚ وَذَٰلِكَ هُوَ الْفَوْزُ الْعَظِيمُ",
     "source": "(سورة غافر — من الآيات ٧–٩)"
    },
    {
     "id": 90063,
     "text": "رَبَّنَا أَتْمِمْ لَنَا نُورَنَا وَاغْفِرْ لَنَا ۖ إِنَّكَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ",
     "source": "(سورة التحريم — من الآية ٨)"
    },
    {
     "id": 90064,
     "text": "رَبِّ ابْنِ لِي عِندَكَ بَيْتًا فِي الْجَنَّةِ",
     "source": "(سورة التحريم — من الآية ١١)"
    }
   ]
  },
  {
   "id": 9007,
   "title": "الرزق والتيسير",
   "items": [
    {
     "id": 90053,
     "text": "رَبِّ اجْعَلْ هَٰذَا بَلَدًا آمِنًا وَارْزُقْ أَهْلَهُ مِنَ الثَّمَرَاتِ مَنْ آمَنَ مِنْهُم بِاللَّهِ وَالْيَوْمِ الْآخِرِ",
     "source": "(سورة البقرة — من الآية ١٢٦)"
    },
    {
     "id": 90054,
     "text": "وَارْزُقْنَا وَأَنتَ خَيْرُ الرَّازِقِينَ",
     "source": "(سورة المائدة — من الآية ١١٤)"
    },
    {
     "id": 90055,
     "text": "رَبِّ اشْرَحْ لِي صَدْرِي وَيَسِّرْ لِي أَمْرِي وَاحْلُلْ عُقْدَةً مِّن لِّسَانِي يَفْقَهُوا قَوْلِي",
     "source": "(سورة طه — من الآيات ٢٥–٢٨)"
    },
    {
     "id": 90056,
     "text": "رَّبِّ أَنزِلْنِي مُنزَلًا مُّبَارَكًا وَأَنتَ خَيْرُ الْمُنزِلِينَ",
     "source": "(سورة المؤمنون — من الآية ٢٩)"
    },
    {
     "id": 90057,
     "text": "رَبِّ إِنِّي لِمَا أَنزَلْتَ إِلَيَّ مِنْ خَيْرٍ فَقِيرٌ",
     "source": "(سورة القصص — من الآية ٢٤)"
    }
   ]
  },
  {
   "id": 9006,
   "title": "الوالدان والأسرة والذرية",
   "items": [
    {
     "id": 90044,
     "text": "رَبِّ هَبْ لِي مِن لَّدُنكَ ذُرِّيَّةً طَيِّبَةً ۖ إِنَّكَ سَمِيعُ الدُّعَاءِ",
     "source": "(سورة آل عمران — من الآية ٣٨)"
    },
    {
     "id": 90045,
     "text": "رَبِّ اغْفِرْ لِي وَلِأَخِي وَأَدْخِلْنَا فِي رَحْمَتِكَ ۖ وَأَنتَ أَرْحَمُ الرَّاحِمِينَ",
     "source": "(سورة الأعراف — من الآية ١٥١)"
    },
    {
     "id": 90046,
     "text": "رَبَّنَا اغْفِرْ لِي وَلِوَالِدَيَّ وَلِلْمُؤْمِنِينَ يَوْمَ يَقُومُ الْحِسَابُ",
     "source": "(سورة إبراهيم — الآية ٤١)"
    },
    {
     "id": 90047,
     "text": "رَّبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا",
     "source": "(سورة الإسراء — من الآية ٢٤)"
    },
    {
     "id": 90048,
     "text": "رَبِّ لَا تَذَرْنِي فَرْدًا وَأَنتَ خَيْرُ الْوَارِثِينَ",
     "source": "(سورة الأنبياء — من الآية ٨٩)"
    },
    {
     "id": 90049,
     "text": "رَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ وَاجْعَلْنَا لِلْمُتَّقِينَ إِمَامًا",
     "source": "(سورة الفرقان — من الآية ٧٤)"
    },
    {
     "id": 90050,
     "text": "رَبِّ هَبْ لِي مِنَ الصَّالِحِينَ",
     "source": "(سورة الصافات — الآية ١٠٠)"
    },
    {
     "id": 90051,
     "text": "رَبِّ أَوْزِعْنِي أَنْ أَشْكُرَ نِعْمَتَكَ الَّتِي أَنْعَمْتَ عَلَيَّ وَعَلَىٰ وَالِدَيَّ وَأَنْ أَعْمَلَ صَالِحًا تَرْضَاهُ وَأَصْلِحْ لِي فِي ذُرِّيَّتِي ۖ إِنِّي تُبْتُ إِلَيْكَ وَإِنِّي مِنَ الْمُسْلِمِينَ",
     "source": "(سورة الأحقاف — من الآية ١٥)"
    },
    {
     "id": 90052,
     "text": "رَّبِّ اغْفِرْ لِي وَلِوَالِدَيَّ وَلِمَن دَخَلَ بَيْتِيَ مُؤْمِنًا وَلِلْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ",
     "source": "(سورة نوح — من الآية ٢٨)"
    }
   ]
  },
  {
   "id": 9005,
   "title": "الصبر والنصر",
   "items": [
    {
     "id": 90038,
     "text": "رَبَّنَا أَفْرِغْ عَلَيْنَا صَبْرًا وَثَبِّتْ أَقْدَامَنَا وَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ",
     "source": "(سورة البقرة — من الآية ٢٥٠)"
    },
    {
     "id": 90039,
     "text": "رَبَّنَا اغْفِرْ لَنَا ذُنُوبَنَا وَإِسْرَافَنَا فِي أَمْرِنَا وَثَبِّتْ أَقْدَامَنَا وَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ",
     "source": "(سورة آل عمران — من الآية ١٤٧)"
    },
    {
     "id": 90040,
     "text": "رَبَّنَا افْتَحْ بَيْنَنَا وَبَيْنَ قَوْمِنَا بِالْحَقِّ وَأَنتَ خَيْرُ الْفَاتِحِينَ",
     "source": "(سورة الأعراف — من الآية ٨٩)"
    },
    {
     "id": 90041,
     "text": "رَبَّنَا أَفْرِغْ عَلَيْنَا صَبْرًا وَتَوَفَّنَا مُسْلِمِينَ",
     "source": "(سورة الأعراف — من الآية ١٢٦)"
    },
    {
     "id": 90042,
     "text": "رَبِّ انصُرْنِي عَلَى الْقَوْمِ الْمُفْسِدِينَ",
     "source": "(سورة العنكبوت — من الآية ٣٠)"
    },
    {
     "id": 90043,
     "text": "أَنِّي مَغْلُوبٌ فَانتَصِرْ",
     "source": "(سورة القمر — من الآية ١٠)"
    }
   ]
  },
  {
   "id": 9004,
   "title": "الهداية والثبات",
   "items": [
    {
     "id": 90028,
     "text": "إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ",
     "source": "(سورة الفاتحة — الآيات ٥–٧)"
    },
    {
     "id": 90029,
     "text": "رَبَّنَا وَاجْعَلْنَا مُسْلِمَيْنِ لَكَ وَمِن ذُرِّيَّتِنَا أُمَّةً مُّسْلِمَةً لَّكَ وَأَرِنَا مَنَاسِكَنَا وَتُبْ عَلَيْنَا ۖ إِنَّكَ أَنتَ التَّوَّابُ الرَّحِيمُ",
     "source": "(سورة البقرة — الآية ١٢٨)"
    },
    {
     "id": 90030,
     "text": "رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِن لَّدُنكَ رَحْمَةً ۚ إِنَّكَ أَنتَ الْوَهَّابُ رَبَّنَا إِنَّكَ جَامِعُ النَّاسِ لِيَوْمٍ لَّا رَيْبَ فِيهِ ۚ إِنَّ اللَّهَ لَا يُخْلِفُ الْمِيعَادَ",
     "source": "(سورة آل عمران — الآيات ٨–٩)"
    },
    {
     "id": 90031,
     "text": "رَبَّنَا آمَنَّا بِمَا أَنزَلْتَ وَاتَّبَعْنَا الرَّسُولَ فَاكْتُبْنَا مَعَ الشَّاهِدِينَ",
     "source": "(سورة آل عمران — الآية ٥٣)"
    },
    {
     "id": 90032,
     "text": "رَبَّنَا آمَنَّا فَاكْتُبْنَا مَعَ الشَّاهِدِينَ",
     "source": "(سورة المائدة — من الآية ٨٣)"
    },
    {
     "id": 90033,
     "text": "رَبِّ اجْعَلْنِي مُقِيمَ الصَّلَاةِ وَمِن ذُرِّيَّتِي ۚ رَبَّنَا وَتَقَبَّلْ دُعَاءِ",
     "source": "(سورة إبراهيم — الآية ٤٠)"
    },
    {
     "id": 90034,
     "text": "رَّبِّ أَدْخِلْنِي مُدْخَلَ صِدْقٍ وَأَخْرِجْنِي مُخْرَجَ صِدْقٍ وَاجْعَل لِّي مِن لَّدُنكَ سُلْطَانًا نَّصِيرًا",
     "source": "(سورة الإسراء — من الآية ٨٠)"
    },
    {
     "id": 90035,
     "text": "رَبَّنَا آتِنَا مِن لَّدُنكَ رَحْمَةً وَهَيِّئْ لَنَا مِنْ أَمْرِنَا رَشَدًا",
     "source": "(سورة الكهف — من الآية ١٠)"
    },
    {
     "id": 90036,
     "text": "رَّبِّ زِدْنِي عِلْمًا",
     "source": "(سورة طه — من الآية ١١٤)"
    },
    {
     "id": 90037,
     "text": "رَّبَّنَا عَلَيْكَ تَوَكَّلْنَا وَإِلَيْكَ أَنَبْنَا وَإِلَيْكَ الْمَصِيرُ",
     "source": "(سورة الممتحنة — من الآية ٤)"
    }
   ]
  },
  {
   "id": 9003,
   "title": "الكرب والاستعاذة",
   "items": [
    {
     "id": 90016,
     "text": "رَبَّنَا أَخْرِجْنَا مِنْ هَٰذِهِ الْقَرْيَةِ الظَّالِمِ أَهْلُهَا وَاجْعَل لَّنَا مِن لَّدُنكَ وَلِيًّا وَاجْعَل لَّنَا مِن لَّدُنكَ نَصِيرًا",
     "source": "(سورة النساء — من الآية ٧٥)"
    },
    {
     "id": 90017,
     "text": "رَبَّنَا لَا تَجْعَلْنَا مَعَ الْقَوْمِ الظَّالِمِينَ",
     "source": "(سورة الأعراف — من الآية ٤٧)"
    },
    {
     "id": 90018,
     "text": "عَلَى اللَّهِ تَوَكَّلْنَا رَبَّنَا لَا تَجْعَلْنَا فِتْنَةً لِّلْقَوْمِ الظَّالِمِينَ وَنَجِّنَا بِرَحْمَتِكَ مِنَ الْقَوْمِ الْكَافِرِينَ",
     "source": "(سورة يونس — من الآيات ٨٥–٨٦)"
    },
    {
     "id": 90019,
     "text": "رَبِّ اجْعَلْ هَٰذَا الْبَلَدَ آمِنًا وَاجْنُبْنِي وَبَنِيَّ أَن نَّعْبُدَ الْأَصْنَامَ",
     "source": "(سورة إبراهيم — من الآية ٣٥)"
    },
    {
     "id": 90020,
     "text": "أَنِّي مَسَّنِيَ الضُّرُّ وَأَنتَ أَرْحَمُ الرَّاحِمِينَ",
     "source": "(سورة الأنبياء — من الآية ٨٣)"
    },
    {
     "id": 90021,
     "text": "لَّا إِلَٰهَ إِلَّا أَنتَ سُبْحَانَكَ إِنِّي كُنتُ مِنَ الظَّالِمِينَ",
     "source": "(سورة الأنبياء — من الآية ٨٧)"
    },
    {
     "id": 90022,
     "text": "رَّبِّ إِمَّا تُرِيَنِّي مَا يُوعَدُونَ رَبِّ فَلَا تَجْعَلْنِي فِي الْقَوْمِ الظَّالِمِينَ",
     "source": "(سورة المؤمنون — من الآيات ٩٣–٩٤)"
    },
    {
     "id": 90023,
     "text": "رَّبِّ أَعُوذُ بِكَ مِنْ هَمَزَاتِ الشَّيَاطِينِ وَأَعُوذُ بِكَ رَبِّ أَن يَحْضُرُونِ",
     "source": "(سورة المؤمنون — من الآيات ٩٧–٩٨)"
    },
    {
     "id": 90024,
     "text": "رَبِّ نَجِّنِي وَأَهْلِي مِمَّا يَعْمَلُونَ",
     "source": "(سورة الشعراء — الآية ١٦٩)"
    },
    {
     "id": 90025,
     "text": "رَبِّ نَجِّنِي مِنَ الْقَوْمِ الظَّالِمِينَ",
     "source": "(سورة القصص — من الآية ٢١)"
    },
    {
     "id": 90026,
     "text": "قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ مِن شَرِّ مَا خَلَقَ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ",
     "source": "(سورة الفلق — الآيات ١–٥)"
    },
    {
     "id": 90027,
     "text": "قُلْ أَعُوذُ بِرَبِّ النَّاسِ مَلِكِ النَّاسِ إِلَٰهِ النَّاسِ مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ مِنَ الْجِنَّةِ وَالنَّاسِ",
     "source": "(سورة الناس — الآيات ١–٦)"
    }
   ]
  },
  {
   "id": 9002,
   "title": "المغفرة والتوبة",
   "items": [
    {
     "id": 90006,
     "text": "غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيرُ",
     "source": "(سورة البقرة — من الآية ٢٨٥)"
    },
    {
     "id": 90007,
     "text": "رَبَّنَا إِنَّنَا آمَنَّا فَاغْفِرْ لَنَا ذُنُوبَنَا وَقِنَا عَذَابَ النَّارِ",
     "source": "(سورة آل عمران — من الآية ١٦)"
    },
    {
     "id": 90008,
     "text": "رَبَّنَا ظَلَمْنَا أَنفُسَنَا وَإِن لَّمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ",
     "source": "(سورة الأعراف — من الآية ٢٣)"
    },
    {
     "id": 90009,
     "text": "أَنتَ وَلِيُّنَا فَاغْفِرْ لَنَا وَارْحَمْنَا ۖ وَأَنتَ خَيْرُ الْغَافِرِينَ",
     "source": "(سورة الأعراف — من الآية ١٥٥)"
    },
    {
     "id": 90010,
     "text": "رَبِّ إِنِّي أَعُوذُ بِكَ أَنْ أَسْأَلَكَ مَا لَيْسَ لِي بِهِ عِلْمٌ ۖ وَإِلَّا تَغْفِرْ لِي وَتَرْحَمْنِي أَكُن مِّنَ الْخَاسِرِينَ",
     "source": "(سورة هود — من الآية ٤٧)"
    },
    {
     "id": 90011,
     "text": "رَبَّنَا آمَنَّا فَاغْفِرْ لَنَا وَارْحَمْنَا وَأَنتَ خَيْرُ الرَّاحِمِينَ",
     "source": "(سورة المؤمنون — من الآية ١٠٩)"
    },
    {
     "id": 90012,
     "text": "رَّبِّ اغْفِرْ وَارْحَمْ وَأَنتَ خَيْرُ الرَّاحِمِينَ",
     "source": "(سورة المؤمنون — من الآية ١١٨)"
    },
    {
     "id": 90013,
     "text": "رَبِّ إِنِّي ظَلَمْتُ نَفْسِي فَاغْفِرْ لِي",
     "source": "(سورة القصص — من الآية ١٦)"
    },
    {
     "id": 90014,
     "text": "رَبَّنَا اغْفِرْ لَنَا وَلِإِخْوَانِنَا الَّذِينَ سَبَقُونَا بِالْإِيمَانِ وَلَا تَجْعَلْ فِي قُلُوبِنَا غِلًّا لِّلَّذِينَ آمَنُوا رَبَّنَا إِنَّكَ رَءُوفٌ رَّحِيمٌ",
     "source": "(سورة الحشر — من الآية ١٠)"
    },
    {
     "id": 90015,
     "text": "رَبَّنَا لَا تَجْعَلْنَا فِتْنَةً لِّلَّذِينَ كَفَرُوا وَاغْفِرْ لَنَا رَبَّنَا ۖ إِنَّكَ أَنتَ الْعَزِيزُ الْحَكِيمُ",
     "source": "(سورة الممتحنة — الآية ٥)"
    }
   ]
  },
  {
   "id": 9001,
   "title": "أدعية جامعة",
   "items": [
    {
     "id": 90001,
     "text": "رَبَّنَا تَقَبَّلْ مِنَّا ۖ إِنَّكَ أَنتَ السَّمِيعُ الْعَلِيمُ",
     "source": "(سورة البقرة — من الآية ١٢٧)"
    },
    {
     "id": 90002,
     "text": "رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ",
     "source": "(سورة البقرة — من الآية ٢٠١)"
    },
    {
     "id": 90003,
     "text": "رَبَّنَا لَا تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا ۚ رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِن قَبْلِنَا ۚ رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ ۖ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا ۚ أَنتَ مَوْلَانَا فَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ",
     "source": "(سورة البقرة — من الآية ٢٨٦)"
    },
    {
     "id": 90004,
     "text": "وَاكْتُبْ لَنَا فِي هَٰذِهِ الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ إِنَّا هُدْنَا إِلَيْكَ",
     "source": "(سورة الأعراف — من الآية ١٥٦)"
    },
    {
     "id": 90005,
     "text": "رَبِّ هَبْ لِي حُكْمًا وَأَلْحِقْنِي بِالصَّالِحِينَ وَاجْعَل لِّي لِسَانَ صِدْقٍ فِي الْآخِرِينَ وَاجْعَلْنِي مِن وَرَثَةِ جَنَّةِ النَّعِيمِ",
     "source": "(سورة الشعراء — الآيات ٨٣–٨٥)"
    }
   ]
  }
 ]
},
 {

    "title": "الدعاء إذا تقلب ليلا",
    "items": [
     {
      "id": 112,
      "text": "لاَ إِلَهَ إِلاَّ اللَّهُ الْوَاحِدُ الْقَهّارُ، رَبُّ السَّمَوَاتِ وَالْأَرْضِ وَمَا بَيْنَهُمَا الْعَزيزُ الْغَفَّارُ."
     }
    ]
   },
   {
    "id": 30,
    "title": "دعاء الفزع في النوم و من بُلِيَ بالوحشة",
    "items": [
     {
      "id": 113,
      "text": "أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ غَضَبِهِ وَعِقَابِهِ، وَشَرِّ عِبَادِهِ، وَمِنْ هَمَزَاتِ الشَّياطِينِ وَأَنْ يَحْضُرُونِ."
     }
    ]
   },
   {
    "id": 31,
    "title": "ما يفعل من رأى الرؤيا أو الحلم",
    "items": [
     {
      "id": 114,
      "text": "[ (يَنْفُثُ عَنْ يَسَارِهِ (ثلاثاً)) - (يَسْتَعِيذُ بِاللَّهِ مِنَ الشَّيطَانِ وَمِنْ شَرِّ مَا رَأَى (ثَلاَثَ مَرَّاتٍ)) - ((لاَ يُحَدِّثْ بِهَا أَحَداً)) - ((يَــتَحَوَّلُ عَنْ جَنْبِهِ الَّذِي كَانَ عَلَيْهِ)) ]"
     },
     {
      "id": 115,
      "text": "ويَقُومُ يُصَلِّي إِنْ أَرَادَ ذَلِكَ."
     }
    ]
   },
   {
    "id": 111,
    "title": "دعاء نباح الكلاب بالليل",
    "items": [
     {
      "id": 229,
      "text": "إِذَا سَمِعْتُمْ نُبَاحَ الْكِلاَبِ وَنَهِيقَ الْحَمِيرِ بِاللَّيْلِ فَتَعَوَّذُوا بِاللَّهِ مِنْهُنَّ؛ فَإِنَّهُنَّ يَرَيْنَ مَا لاَ تَرَوْنَ."
     }

   },
   {
    "id": 110,
    "title": "الدُّعاءُ عِنْدَ سَمَاعِ صِياحِ الدِّيكِ ونَهِيقِ الْحِمَارِ",
    "items": [
     {
      "id": 228,
      "text": "إِذَا سَمِعْتُمْ صِيَاحَ الدِّيَكَةِ فَاسْأَلُوا اللَّهَ مِنْ فَضْلِهِ؛ فَإِنَّهَا رَأَتْ مَلَكاً وَإِذَا سَمِعْتُمْ نَهِيقَ الْحِمَارِ فَتَعَوَّذُوا بِاللَّهِ مِنَ الشَّيطَانِ؛ فَإِنَّهُ رَأَى شَيْطَاناً."
     }

   {
    "id": 1,
    "title": "أذكار الاستيقاظ من النوم",
    "items": [
     {
      "id": 1,
      "text": "الْحَمْدُ للَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا، وَإِلَيْهِ النُّشُورُ"
     },
     {
      "id": 2,
      "text": "( لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَريكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، سُبْحَانَ اللَّهِ، وَالْحَمْدُ للَّهِ، وَلاَ إِلَهَ إِلاَّ اللَّهُ، وَاللَّهُ أَكبَرُ، وَلاَ حَوْلَ وَلاَ قُوَّةَ إِلاَّ بِاللَّهِ الْعَلِيِّ الْعَظِيمِ، رَبِّ اغْفرْ لِي )."
     },
     {
      "id": 3,
      "text": "الْحَمْدُ لِلَّهِ الَّذِي عَافَانِي فِي جَسَدِي، وَرَدَّ عَلَيَّ رُوحِي، وَأَذِنَ لي بِذِكْرِهِ"
     },
     {
      "id": 4,
      "text": "﴿ إِنَّ فِي خَلْقِ السَّمَوَاتِ وَالأَرْضِ وَاخْتِلاَفِ اللَّيْلِ وَالنَّهَارِ لَآيَاتٍ لأُوْلِي الألْبَابِ * الَّذِينَ يَذْكُرُونَ اللَّهَ قِيَاماً وَقُعُوداً وَعَلَىَ جُنُوبِهِمْ وَيَتَفَكَّرُونَ فِي خَلْقِ السَّمَوَاتِ وَالأَرْضِ رَبَّنَا مَا خَلَقْتَ هَذا بَاطِلاً سُبْحَانَكَ فَقِنَا عَذَابَ النَّارِ* رَبَّنَا إِنَّكَ مَن تُدْخِلِ النَّارَ فَقَدْ أَخْزَيْتَهُ وَمَا لِلظَّالِمِينَ مِنْ أَنصَارٍ* رَّبَّنَا إِنَّنَا سَمِعْنَا مُنَادِياً يُنَادِي لِلإِيمَانِ أَنْ آمِنُواْ بِرَبِّكُمْ فَآمَنَّا رَبَّنَا فَاغْفِرْ لَنَا ذُنُوبَنَا وَكَفِّرْ عَنَّا سَيِّئَاتِنَا وَتَوَفَّنَا مَعَ الأبْرَارِ* رَبَّنَا وَآتِنَا مَا وَعَدتَّنَا عَلَى رُسُلِكَ وَلاَ تُخْزِنَا يَوْمَ الْقِيَامَةِ إِنَّكَ لاَ تُخْلِفُ الْمِيعَادَ* فَاسْتَجَابَ لَهُمْ رَبُّهُمْ أَنِّي لاَ أُضِيعُ عَمَلَ عَامِلٍ مِّنكُم مِّن ذَكَرٍ أَوْ أُنثَى بَعْضُكُم مِّن بَعْضٍ فَالَّذِينَ هَاجَرُواْ وَأُخْرِجُواْ مِن دِيَارِهِمْ وَأُوذُواْ فِي سَبِيلِي وَقَاتَلُواْ وَقُتِلُواْ لأُكَفِّرَنَّ عَنْهُمْ سَيِّئَاتِهِمْ وَلأُدْخِلَنَّهُمْ جَنَّاتٍ تَجْرِي مِن تَحْتِهَا الأَنْهَارُ ثَوَاباً مِّن عِندِ اللَّهِ وَاللَّهُ عِندَهُ حُسْنُ الثَّوَابِ * لاَ يَغُرَّنَّكَ تَقَلُّبُ الَّذِينَ كَفَرُواْ فِي الْبِلاَدِ * مَتَاعٌ قَلِيلٌ ثُمَّ مَأْوَاهُمْ جَهَنَّمُ وَبِئْسَ الْمِهَادُ * لَكِنِ الَّذِينَ اتَّقَوْاْ رَبَّهُمْ لَهُمْ جَنَّاتٌ تَجْرِي مِنْ تَحْتِهَا الأَنْهَارُ خَالِدِينَ فِيهَا نُزُلاً مِّنْ عِندِ اللَّهِ وَمَا عِندَ اللَّهِ خَيْرٌ لِّلأَبْرَارِ * وَإِنَّ مِنْ أَهْلِ الْكِتَابِ لَمَن يُؤْمِنُ بِاللَّهِ وَمَا أُنزِلَ إِلَيْكُمْ وَمَآ أُنزِلَ إِلَيْهِمْ خَاشِعِينَ لِلَّهِ لاَ يَشْتَرُونَ بِآيَاتِ اللَّهِ ثَمَناً قَلِيلاً أُوْلَئِكَ لَهُمْ أَجْرُهُمْ عِندَ رَبِّهِمْ إِنَّ اللَّهَ سَرِيعُ الْحِسَابِ*يَا أَيُّهَا الَّذِينَ آمَنُواْ اصْبِرُواْ وَصَابِرُواْ وَرَابِطُواْ وَاتَّقُواْ اللَّهَ لَعَلَّكُمْ تُفْلِحُونَ ﴾"
     }
    ]
   }
  ]
 },
 {

  "chapters": [
   {
    "id": 15,
    "title": "أذكار الآذان",
    "items": [
     {
      "id": 22,
      "text": "يَقُولُ مِثْلَ مَا يَقُولُ المُؤَذِّنُ إِلاَّ فِي ((حَيَّ عَلَى الصَّلَاةِ وَحَيَّ عَلَى الْفَلَاحِ)) فَيقُولُ: ((لاَ حَوْلَ وَلاَ قُوَّةَ إِلاَّ بِاللَّهِ))."
     },
     {
      "id": 23,
      "text": "يَقُولُ: ((وَأَنَا أَشْهَدُ أَنْ لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ وَأَنَّ مُحَمَّداً عَبْدُهُ وَرَسُولُهُ، رَضِيتُ بِاللَّهِ رَبَّاً، وَبِمُحَمَّدٍ رَسُولاً، وَبِالْإِسْلاَمِ دِينَاً)) ((يَقُولُ ذَلِكَ عَقِبَ تَشَهُّدِ الْمُؤَذِّنِ))."
     },
     {
      "id": 24,
      "text": "يُصَلِّي عَلَى النَّبِيِّ صلى الله عليه وسلم بَعْدَ فَرَاغِهِ مِنْ إِجَابَةِ الْمُؤَذِّنِ."
     },
     {
      "id": 25,
      "text": "يَقُولُ: ((اللَّهُمَّ رَبَّ هَذِهِ الدَّعْوَةِ التَّامَّةِ، وَالصَّلاَةِ الْقَائِمَةِ، آتِ مُحَمَّداً الْوَسِيلَةَ وَالْفَضِيلَةَ، وَابْعَثْهُ مَقَامَاً مَحمُوداً الَّذِي وَعَدْتَهُ، [إِنَّكَ لَا تُخْلِفُ الْمِيعَادَ]))."
     },
     {
      "id": 26,
      "text": "يَدْعُو لِنَفسِهِ بَيْنَ الْأَذَانِ وَالْإِقَامَةِ فَإِنَّ الدُّعَاءَ حِينَئِذٍ لاَ يُرَدُّ."
     }
    ]
   },
   {
    "id": 16,
    "title": "دعاء الاستفتاح",
    "items": [
     {
      "id": 27,
      "text": "اللَّهُمَّ بَاعِدْ بَيْنِي وَبَيْنَ خَطَايَايَ كَمَا بَاعَدْتَ بَيْنَ الْمَشْرِقِ وَالْمَغْرِبِ، اللَّهُمَّ نَقِّنِي مِنْ خَطَايَايَ كَمَا يُنَقَّى الثَّوْبُ الْأَبْيَضُ مِنَ الدَّنَسِ، اللَّهُمَّ اغْسِلْني مِنْ خَطَايَايَ، بِالثَّلْجِ وَالْماءِ وَالْبَرَدِ."
     },
     {
      "id": 28,
      "text": "سُبْحانَكَ اللَّهُمَّ وَبِحَمْدِكَ، وَتَبارَكَ اسْمُكَ، وَتَعَالَى جَدُّكَ، وَلاَ إِلَهَ غَيْرُكَ."
     },
     {
      "id": 29,
      "text": "وَجَّهْتُ وَجْهِيَ لِلَّذِي فَطَرَ السَّمَوَاتِ وَالأَرْضَ حَنِيفَاً وَمَا أَنَا مِنَ الْمُشْرِكِينَ، إِنَّ صَلاَتِي، وَنُسُكِي، وَمَحْيَايَ، وَمَمَاتِي لِلَّهِ رَبِّ الْعَالَمِينَ، لاَ شَرِيكَ لَهُ وَبِذَلِكَ أُمِرْتُ وَأَنَا مِنَ الْمُسْلِمِينَ. اللَّهُمَّ أَنْتَ المَلِكُ لاَ إِلَهَ إِلاَّ أَنْتَ، أَنْتَ رَبِّي وَأَنَا عَبْدُكَ، ظَلَمْتُ نَفْسِي وَاعْتَرَفْتُ بِذَنْبِي فَاغْفِرْ لِي ذُنُوبي جَمِيعَاً إِنَّهُ لاَ يَغْفِرُ الذُّنوبَ إِلاَّ أَنْتَ. وَاهْدِنِي لِأَحْسَنِ الأَخْلاقِ لاَ يَهْدِي لِأَحْسَنِها إِلاَّ أَنْتَ، وَاصْرِفْ عَنِّي سَيِّئَهَا، لاَ يَصْرِفُ عَنِّي سَيِّئَهَا إِلاَّ أَنْتَ، لَبَّيْكَ وَسَعْدَيْكَ، وَالخَيْرُ كُلُّهُ بِيَـــــــدَيْكَ، وَالشَّـــــرُّ لَيْسَ إِلَيْــــــكَ، أَنَا بِكَ وَإِلَيْكَ، تَبارَكْتَ وَتَعَالَيْتَ، أَسْتَغْفِرُكَ وَأَتوبُ إِلَيْكَ."
     },
     {
      "id": 30,
      "text": "اللَّهُمَّ رَبَّ جِبْرَائِيلَ، وَمِيْكَائِيلَ، وَإِسْرَافِيلَ، فَاطِرَ السَّمَوَاتِ وَالأَرْضِ، عَالِمَ الغَيْبِ وَالشَّهَادَةِ أَنْتَ تَحْكُمُ بَيْنَ عِبَادِكَ فِيمَا كَانُوا فِيهِ يَخْتَلِفُونَ. اهْدِنِي لِمَا اخْتُلِفَ فِيهِ مِنَ الْحَقِّ بِإِذْنِكَ إِنَّكَ تَهْدِي مَنْ تَشَاءُ إِلَى صِرَاطٍ مُسْتَقيمٍ."
     },
     {
      "id": 31,
      "text": "اللَّهُ أَكْبَرُ كَبِيرَاً، اللَّهُ أَكْبَرُ كَبِيراً، اللَّهُ أَكْبَرُ كَبِيراً، وَالْحَمْدُ لِلَّهِ كَثيراً، وَالْحَمْدُ لِلَّهِ كَثيراً، وَالْحَمْدُ لِلَّهِ كَثيراً، وَسُبْحَانَ اللَّهِ بُكْرَةً وَأَصِيلاً ثَلاثاً ((أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ: مِنْ نَفْخِهِ، وَنَفْثِهِ، وَهَمْزِهِ))."
     },
     {
      "id": 32,
      "text": "اللَّهُمَّ لَكَ الْحَمْدُ، أَنْتَ نُورُ السَّمَوَاتِ وَالأَرْضِ وَمَنْ فِيهِنَّ، وَلَكَ الْحَمْدُ أَنْتَ قَيِّمُ السَّمَوَاتِ وَالأَرْضِ وَمَنْ فِيهِنَّ، [وَلَكَ الْحَمْدُ أَنْتَ رَبُّ السَّمَواتِ وَالأَرْضِ وَمَنْ فِيهِنَّ] [وَلَكَ الْحَمْدُ لَكَ مُلْكُ السَّمَوَاتِ وَالأَرْضِ وَمَنْ فِيهِنَّ] [وَلَكَ الْحَمْدُ أَنْتَ مَلِكُ السَّمَوَاتِ وَالأَرْضِ] [وَلَكَ الْحَمْدُ] [أَنْتَ الْحَقُّ، وَوَعْدُكَ الْحَقُّ، وَقَوْلُكَ الْحَقُّ، وَلِقاؤُكَ الْحَقُّ، وَالْجَنَّةُ حَقٌّ، وَالنَّارُ حَقٌّ، وَالنَّبِيُّونَ حَقٌّ، وَمحَمَّدٌ صلى الله عليه وسلم حَقٌّ، وَالسّاعَةُ حَقٌّ] [اللَّهُمَّ لَكَ أَسْلَمتُ، وَعَلَيْكَ تَوَكَّلْتُ، وَبِكَ آمَنْتُ، وَإِلَيْكَ أَنَبْتُ، وَبِكَ خاصَمْتُ، وَإِلَيْكَ حاكَمْتُ. فَاغْفِرْ لِي مَا قَدَّمْتُ، وَمَا أَخَّرْتُ، وَمَا أَسْرَرْتُ، وَمَا أَعْلَنْتُ] [وَمَا أَنْتَ أَعْلَمُ بِهِ مِنِّي] [أَنْتَ المُقَدِّمُ، وَأَنْتَ المُؤَخِّرُ لاَ إِلَهَ إِلاَّ أَنْتَ] [أَنْتَ إِلَهِي لاَ إِلَهَ إِلاَّ أَنْتَ] [وَلاَ حَوْلَ وَلاَ قُوَّةَ إِلاَّ بِاللَّهِ]."
     }
    ]
   },
   {
    "id": 17,
    "title": "دعاء الركوع",
    "items": [
     {
      "id": 33,
      "text": "سُبْحانَ رَبِّيَ الْعَظِيمِ. ثلاث مرَّاتٍ."
     },
     {
      "id": 34,
      "text": "سُبْحَانَكَ اللَّهُمَّ رَبَّنَا وَبِحَمْدِكَ، اللَّهُمَّ اغْفِرْ لِي."
     },
     {
      "id": 35,
      "text": "سُبُّوُحٌ، قُدُّوسٌ، رَبُّ المَلاَئِكَةِ وَالرُّوحِ."
     },
     {
      "id": 36,
      "text": "اللَّهُمَّ لَكَ رَكَعْتُ، وَبِكَ آمَنْتُ، وَلَكَ أَسْلَمْتُ، خَشَعَ لَكَ سَمْعِي، وَبَصَرِي، وَمُخِّي، وَعَــــظْمِي، وَعَصَبِي، [وَمَا استَقَلَّتْ بِهِ قَدَمِي]."
     },
     {
      "id": 37,
      "text": "سُبْحَانَ ذِي الْجَبَرُوتِ، وَالْمَلَكُوتِ، وَالْكِبْرِيَاءِ، وَالْعَظَمَةِ."
     }
    ]
   },
   {
    "id": 18,
    "title": "دعاء الرفع من الركوع",
    "items": [
     {
      "id": 38,
      "text": "سَمِعَ اللَّهُ لِمَنْ حَمِدَهُ."
     },
     {
      "id": 39,
      "text": "رَبَّنَا وَلَكَ الْحَمْدُ، حَمْداً كَثيراً طَيِّباً مُبارَكاً فِيهِ."
     },
     {
      "id": 40,
      "text": "مِلْءَ السَّمَوَاتِ وَمِلْءَ الأَرْضِ، وَمَا بَيْنَهُمَا، وَمِلْءَ مَا شِئْتَ مِنْ شَيءٍ بَعْدُ. أَهلَ الثَّناءِ وَالْمَجْدِ، أَحَقُّ مَا قَالَ الْعَبْدُ، وَكُلُّنَا لَكَ عَبْدٌ. اللَّهُمَّ لاَ مَانِعَ لِمَا أَعْطَيْتَ، وَلاَ مُعْطِيَ لِمَا مَنَعْتَ، وَلاَ يَنْفَعُ ذَا الجَدِّ مِنْكَ الجَدُّ."
     }
    ]
   },
   {
    "id": 19,
    "title": "دعاء السجود",
    "items": [
     {
      "id": 41,
      "text": "سُبْحَانَ رَبِّيَ الأَعْلَى ثلاث مرَّاتٍ."
     },
     {
      "id": 42,
      "text": "سُبْحَانَكَ اللَّهُمَّ رَبَّنَا وَبِحَمْدِكَ، اللَّهُمَّ اغْفِرْ لِي."
     },
     {
      "id": 43,
      "text": "سُبوحٌ، قُدُّوسٌ، رَبُّ الْمَلَائِكَةِ وَالرُّوحِ."
     },
     {
      "id": 44,
      "text": "اللَّهُمَّ لَكَ سَجَدْتُ وَبِكَ آمَنْتُ، وَلَكَ أَسْلَمْتُ، سَجَدَ وَجْهِيَ لِلَّذِي خَلَقَهُ، وَصَوَّرَهُ، وَشَقَّ سَمْعَهُ وَبَصَرَهُ، تَبَارَكَ اللَّهُ أَحْسنُ الْخَالِقينَ."
     },
     {
      "id": 45,
      "text": "سُبْحَانَ ذِي الْجَبَرُوتِ، وَالْمَلَكُوتِ، وَالْكِبْرِيَاءِ، وَالْعَظَمَةِ."
     },
     {
      "id": 46,
      "text": "اللَّهُمَّ اغْفِرْ لِي ذَنْبِي كُلَّهُ: دِقَّهُ وَجِلَّهُ، وَأَوَّلَهُ وَآخِرَهُ، وَعَلاَنِيَّتَهُ وَسِرَّهُ."
     },
     {
      "id": 47,
      "text": "اللَّهُمَّ إِنِّي أَعُوذُ بِرِضَاكَ مِنْ سَخَطِكَ، وَبِمُعَافَاتِكَ مِنْ عُقوبَتِكَ، وَأَعُوذُ بِكَ مِنْكَ، لاَ أُحْصِي ثَنَاءً عَلَيْكَ، أَنْتَ كَمَا أَثْنَيْتَ عَلَى نَفْسِكَ."
     }
    ]
   },
   {
    "id": 20,
    "title": "دعاء الجلسة بين السجدتين",
    "items": [
     {
      "id": 48,
      "text": "رَبِّ اغْفِرْ لِي، رَبِّ اغْفِرْ لِي."
     },
     {
      "id": 49,
      "text": "اللَّهُمَّ اغْفِرْ لِي، وَارْحَمْنِي، وَاهْدِنِي، وَاجْبُرْنِي، وَعَافِنِي، وَارْزُقْنِي، وَارْفَعْنِي."
     }
    ]
   },
   {
    "id": 21,
    "title": "دعاء سجود التلاوة",
    "items": [
     {
      "id": 50,
      "text": "سَجَدَ وَجْهِيَ لِلَّذِي خَلَقَهُ، وَشَقَّ سَمْعَهُ وَبَصَرَهُ بِحَوْلِهِ وَقُوَّتِهِ، ﴿فَتَبارَكَ اللَّهُ أَحْسَنُ الْخَالِقِينَ﴾"
     },
     {
      "id": 51,
      "text": "اللَّهُمَّ اكْتُبْ لِي بِهَا عِنْدَكَ أَجْراً، وَضَعْ عَنِّي بِهَا وِزْراً، وَاجْعَلْهَا لِي عِنْدَكَ ذُخْراً، وَتَقَبَّلْهَا مِنِّي كَمَا تَقَبَّلْتَهَا مِنْ عَبْدِكَ دَاوُدَ."
     }
    ]
   },
   {
    "id": 22,
    "title": "التشهد",
    "items": [
     {
      "id": 52,
      "text": "التَّحِيَّاتُ لِلَّهِ، وَالصَّلَواتُ، وَالطَّيِّباتُ، السَّلاَمُ عَلَيْكَ أَيُّهَا النَّبِيُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ، السَّلاَمُ عَلَيْنَا وَعَلَى عِبَادِ اللَّهِ الصَّالِحِينَ. أَشْهَدُ أَنْ لاَ إِلَهَ إِلاَّ اللَّهُ وَأَشْهَدُ أَنَّ مُحَمَّداً عَبْدُهُ وَرَسولُهُ."
     }
    ]
   },
   {
    "id": 23,
    "title": "الصلاة على النبي بعد التشهد",
    "items": [
     {
      "id": 53,
      "text": "اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ، وَعَلَى آلِ مُحَمَّدٍ، كَمَا صَلَّيتَ عَلَى إِبْرَاهِيمَ، وَعَلَى آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ، اللَّهُمَّ بَارِكْ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ، كَمَا بَارَكْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ."
     },
     {
      "id": 54,
      "text": "اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى أَزْوَاجِهِ وَذُرِّيَّتِهِ، كَمَا صَلَّيْتَ عَلَى آلِ إِبْرَاهِيمَ. وَبَارِكْ عَلَى مُحَمَّدٍ وَعَلَى أَزْواجِهِ وَذُرِّيَّتِهِ، كَمَا بَارَكْتَ عَلَى آلِ إِبْرَاهِيمَ. إِنَّكَ حَمِيدٌ مَجِيدٌ."
     }
    ]
   },
   {
    "id": 24,
    "title": "الدعاء بعد التشهد الأخير قبل السلام",
    "items": [
     {
      "id": 55,
      "text": "اللَّهُــمَّ إِنِّي أَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، وَمِنْ عَذَابِ جَهَنَّمَ، وَمِنْ فِتْنَةِ الْمَحْيَا وَالْمَمَاتِ، وَمِنْ شَرِّ فِتْنَةِ الْمَسِيحِ الدَّجَّالِ."
     },
     {
      "id": 56,
      "text": "اللَّهُمَّ إِنِّي أَعوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، وَأَعوذُ بِكَ مِنْ فِتْنَةِ الْمَسِيحِ الدَّجَّالِ، وَأَعوذُ بِكَ مِنْ فِتْنَةِ الْمَحْيَا وَالْمَمَاتِ. اللَّهُمَّ إِنِّي أَعوذُ بِكَ مِنَ الْمَأْثَمِ وَالْمَغْرَمِ."
     },
     {
      "id": 57,
      "text": "اللَّهُمَّ إِنِّي ظَلَمْتُ نَفْسِي ظُلْماً كَثِيراً، وَلاَ يَغْفِرُ الذُّنوبَ إِلاَّ أَنْتَ، فَاغْفِرْ لِي مَغْفِرَةً مِنْ عِنْدِكَ وَارْحَمْنِي، إِنَّكَ أَنْتَ الغَفورُ الرَّحيمُ."
     },
     {
      "id": 58,
      "text": "اللَّهُمَّ اغْفِرْ لِي مَا قَدَّمْتُ، وَمَا أَخَّرْتُ، وَمَا أَسْرَرْتُ، وَمَا أَعْلَنْتُ، وَمَا أَسْرَفْتُ، وَمَا أَنْتَ أَعْلَمُ بِهِ مِنِّي. أَنْتَ الْمُقَدِّمُ، وَأَنْتَ الْمُؤَخِّرُ لاَ إِلَهَ إِلاَّ أَنْتَ."
     },
     {
      "id": 59,
      "text": "اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ، وَشُكْرِكَ، وَحُسْنِ عِبادَتِكَ."
     },
     {
      "id": 60,
      "text": "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْبُخْلِ، وَأَعوذُ بِكَ مِنَ الْجُبْنِ، وَأَعُوذُ بِكَ مِنْ أَنْ أُرَدَّ إِلَى أَرْذَلِ الْعُمُرِ، وَأَعُوذُ بِكَ مِنْ فِتْنَةِ الدُّنْيَا وَعَذَابِ الْقَبْرِ."
     },
     {
      "id": 61,
      "text": "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْجَنَّةَ وَأَعُوذُ بِكَ مِنَ النَّارِ."
     },
     {
      "id": 62,
      "text": "اللَّهُمَّ بِعِلْمِكَ الغَيْبَ وَقُدْرَتِكَ عَلَى الْخَلقِ أَحْيِنِي مَا عَلِمْتَ الْحَيَاةَ خَيْراً لِي، وَتَوَفَّنِي إِذَا عَلِمْتَ الْوَفَاةَ خَيْراً لِي، اللَّهُمَّ إِنِّي أَسْأَلُكَ خَشْيَتَكَ فِي الْغَيْبِ وَالشَّهَادَةِ، وَأَسْأَلُكَ كَلِمَةَ الْحَقِّ فِي الرِّضَا وَالْغَضَبِ، وَأَسْأَلُكَ الْقَصْدَ فِي الْغِنَى وَالْفَقْرِ، وَأَسْأَلُكَ نَعِيماً لاَ يَنْفَدُ، وَأَسْأَلُكَ قُرَّةَ عَيْنٍ لاَ تَنْقَطِعُ، وَأَسْأَلُكَ الرِّضَا بَعْدَ الْقَضَاءِ، وَأَسْــــأَلُكَ بَرْدَ الْعَيْشِ بَعْدَ الْمَوْتِ، وَأَسْأَلُكَ لَذَّةَ النَّظَرِ إِلَى وَجْهِكَ، وَالشَّوْقَ إِلَى لِقائِكَ فِي غَيرِ ضَرَّاءَ مُضِرَّةٍ، وَلاَ فِتْنَةٍ مُضِلَّةٍ، اللَّهُمَّ زَيِّنَا بِزِينَةِ الإِيمَانِ، وَاجْعَلْنَا هُدَاةً مُهْتَدِينَ."
     },
     {
      "id": 63,
      "text": "اللَّهُمَّ إِنِّي أَسْأَلُكَ يَا أَللَّهُ بِأَنَّكَ الْوَاحِدُ الْأَحَدُ الصَّمَدُ الَّذِي لَمْ يَلِدْ وَلَمْ يولَدْ، وَلَمْ يَكنْ لَهُ كُفُواً أَحَدٌ، أَنْ تَغْفِرَ لِي ذُنُوبِي إِنَّكَ أَنْتَ الْغَفُورُ الرَّحِّيمُ."
     },
     {
      "id": 64,
      "text": "اللَّهُمَّ إِنِّي أَسْأَلُكَ بِأَنَّ لَكَ الْحَمْدَ لَا إِلَهَ إِلاَّ أَنْتَ وَحْدَكَ لاَ شَرِيكَ لَكَ، الْمَنَّانُ، يَا بَدِيعَ السَّمَوَاتِ وَالْأَرْضِ يَا ذَا الْجَلاَلِ وَالْإِكْرَامِ، يَا حَيُّ يَا قَيُّومُ إِنِّي أَسْأَلُكَ الْجَنَّةَ وَأَعُوذُ بِكَ مِنَ النَّارِ."
     },
     {
      "id": 65,
      "text": "اللَّهُمَّ إِنِّي أَسْأَلُكَ بِأَنَّي أَشْهَدُ أَنَّكَ أَنْتَ اللَّهُ لاَ إِلَهَ إِلاَّ أَنْتَ الْأَحَدُ الصَّمَدُ الَّذِي لَمْ يَلِدْ وَلَمْ يُولَدْ وَلَمْ يَكُنْ لَهُ كُفُواً أَحَدٌ ."
     }
    ]
   },
   {
    "id": 42,
    "title": "دعاء الوسوسة في الصلاة و القراءة",
    "items": [
     {
      "id": 138,
      "text": "أَعُوذُ بِاللَّهِ مِنَ الشَّيطَانِ الرَّجِيمِ، وَاتْفُلْ عَلَى يَسَارِكَ (ثلاثاً)."
     }
    ]
   },
   {
    "id": 25,
    "title": "الأذكار بعد السلام من الصلاة",
    "items": [
     {
      "id": 66,
      "text": "أَسْتَغْفِرُ اللَّهَ (ثَلاَثَاً) اللَّهُمَّ أَنْتَ السَّلاَمُ، وَمِنْكَ السَّلاَمُ، تَبَارَكْتَ يَا ذَا الْجَلاَلِ وَالْإِكْرَامِ."
     },
     {
      "id": 67,
      "text": "لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ [ثلاثاً]، اللَّهُمَّ لاَ مَانِعَ لِمَا أَعْطَيْتَ، وَلاَ مُعْطِيَ لِمَا مَنَعْتَ، وَلاَ يَنْفَعُ ذَا الْجَدِّ مِنْكَ الجَدُّ."
     },
     {
      "id": 68,
      "text": "لَا إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ، وَلَهُ الْحَمدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ. لاَ حَوْلَ وَلاَ قُوَّةَ إِلاَّ بِاللَّهِ، لاَ إِلَهَ إِلاَّ اللَّهُ، وَلاَ نَعْبُدُ إِلاَّ إِيَّاهُ, لَهُ النِّعْمَةُ وَلَهُ الْفَضْلُ وَلَهُ الثَّنَاءُ الْحَسَنُ، لَا إِلَهَ إِلاَّ اللَّهُ مُخْلِصِينَ لَهُ الدِّينَ وَلَوْ كَرِهَ الكَافِرُونَ."
     },
     {
      "id": 69,
      "text": "سُبْحَانَ اللَّهِ، وَالْحَمْدُ لِلَّهِ، وَاللَّهُ أَكْبَرُ (ثلاثاً وثلاثين) لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ."
     },
     {
      "id": 70,
      "text": "بسم الله الرحمن الرحيم ﴿قُلْ هُوَ اللَّهُ أَحَدٌ* اللَّهُ الصَّمَدُ* لَمْ يَلِدْ وَلَمْ يُولَدْ* وَلَمْ يَكُن لَّهُ كُفُواً أَحَدٌ﴾، بسم الله الرحمن الرحيم ﴿قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ* مِن شَرِّ مَا خَلَقَ* وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ* وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ* وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ﴾،بسم الله الرحمن الرحيم ﴿قُلْ أَعُوذُ بِرَبِّ النَّاسِ* مَلِكِ النَّاسِ* إِلَهِ النَّاسِ* مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ* الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ* مِنَ الْجِنَّةِ وَ النَّاسِ﴾ بَعْدَ كُلِّ صَلاَةٍ."
     },
     {
      "id": 71,
      "text": "﴿اللَّهُ لاَ إِلَهَ إِلاَّ هُوَ الْحَيُّ الْقَيُّومُ لاَ تَأْخُذُهُ سِنَةٌ وَلاَ نَوْمٌ لَّهُ مَا فِي السَّمَوَاتِ وَمَا فِي الأَرْضِ مَن ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلاَّ بِإِذْنِهِ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ وَلاَ يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلاَّ بِمَا شَاءَ وَسِعَ كُرْسِيُّهُ السَّمَوَاتِ وَالأَرْضَ وَلاَ يَؤُودُهُ حِفْظُهُمَا وَهُوَ الْعَلِيُّ الْعَظِيمُ﴾ عَقِبَ كلِّ صَلاَةٍ."
     },
     {
      "id": 72,
      "text": "لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ يُحْيِي وَيُمِيتُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ عَشْرَ مَرّاتٍ بَعْدَ صَلاةِ الْمَغْرِبِ وَالصُّبْحِ."
     },
     {
      "id": 73,
      "text": "اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْماً نافِعاً، وَرِزْقاً طَيِّباً، وَعَمَلاً مُتَقَبَّلاً بَعْدَ السّلامِ مِنْ صَلاَةِ الفَجْرِ."
     }
    ]
   },
   {
    "id": 32,
    "title": "دعاء قنوت الوتر",
    "items": [
     {
      "id": 116,
      "text": "اللَّهُمَّ اهْدِنِي فِيمَنْ هَدَيْتَ، وَعَافِنِي فِيمَنْ عَافَيْتَ، وَتَوَلَّنِي فِيمَنْ تَوَلَّيْتَ، وَبَارِكْ لِي فِيمَا أَعْطَيْتَ، وَقِنِي شَرَّ مَا قَضَيْتَ؛ فَإِنَّكَ تَقْضِي وَلاَ يُقْضَى عَلَيْكَ، إِنَّهُ لاَ يَذِلُّ مَنْ وَالَيْتَ، [وَلاَ يَعِزُّ مَنْ عَادَيْتَ]، تَبارَكْتَ رَبَّنا وَتَعَالَيْتَ."
     },
     {
      "id": 117,
      "text": "اللَّهُمَّ إِنِّي أَعُوذُ بِرِضَاكَ مِنْ سَخَطِكَ، وَبِمُعَافَاتِكَ مِنْ عُقُوبَتِكَ، وَأَعُــــوذُ بِكَ مِنْكَ، لاَ أُحْصِي ثَنَاءً عَلَيْكَ، أَنْتَ كَمَا أَثْنَيْتَ عَلَى نَفْسِكَ."
     },
     {
      "id": 118,
      "text": "اللَّهُمَّ إِيَّاكَ نعْبُدُ، وَلَكَ نُصَلِّي وَنَسْجُدُ، وَإِلَيْكَ نَسْعَى وَنَحْفِدُ، نَرْجُو رَحْمَتَكَ، وَنَخْشَى عَذَابَكَ، إِنَّ عَذَابَكَ بِالكَافِرِينَ مُلْحَقٌ. اللَّهُمَّ إِنَّا نَسْتَعينُكَ، وَنَسْتَغْفِرُكَ، وَنُثْنِي عَلَيْكَ الْخَيْرَ، وَلاَ نَكْفُرُكَ، وَنُؤْمِنُ بِكَ، وَنَخْضَعُ لَكَ، وَنَخْلَعُ مَنْ يَكْفرُكَ."
     }
    ]
   },
   {
    "id": 33,
    "title": "الذكر عقب السلام من الوتر",
    "items": [
     {
      "id": 119,
      "text": "سُبْحَانَ المَلِكِ القُدُّوسِ ثلاثَ مرَّاتٍ والثَّالِثَةُ يَجْهَرُ بها ويَمُدُّ بها صَوتَهُ يقولُ: [رَبِّ الْمَلاَئِكَةِ وَالرُّوحِ]))."
     }
    ]
   },
   {
    "id": 26,
    "title": "دعاء صلاة الاستخارة",
    "items": [
     {
      "id": 74,
      "text": "قَالَ جَابرُ بْنُ عَبْدِ اللَّهِ رَضِيَ اللَّهُ عَنْهُمَا: كَانَ رسُولُ اللَّهِ صلى الله عليه وسلم يُعَلِّمُنَا الْاسْتِخَارَةَ فِي الْأُمُورِ كُلِّهَا كَمَا يُعَلِّمُنَا السُّورَةَ مِنَ الْقُرْآنِ، يَقُولُ: ((إِذَا هَمَّ أَحَدُكُمْ بِالْأَمْرِ فَلْيَرْكَعْ رَكْعَتَيْنِ مِنْ غَيْرِ الْفَرِيضَةِ، ثُمَّ لْيَقُلْ: اللَّهُمَّ إِنِّي أَسْتَخِيرُكَ بِعِلْمِكَ، وَأَسْتَقْدِرُكَ بِقُدْرَتِكَ، وَأَسْأَلُكَ مِنْ فَضْلِكَ العَظِيمِ؛ فَإِنَّكَ تَقْدِرُ وَلاَ أَقْدِرُ، وَتَعْلَمُ وَلاَ أَعْلَمُ، وَأَنْتَ عَلاَّمُ الغُيُوبِ، اللَّهُمَّ إِنْ كُنْتَ تَعْلَمُ أَنَّ هَذَا الأمْرَ - وَيُسَمِّي حَاجَتَهُ - خَيْرٌ لِي فِي دِينِي وَمَعَاشِي وَعَاقِبَةِ أَمْرِي – أَوْ قَالَ: عَاجِلِهِ وَآجِلِهِ - فَاقْدُرْهُ لِي وَيَسِّرْهُ لِي ثمَّ بَارِكْ لِي فِيهِ، وَإِنْ كُنْتَ تَعْلَمُ أَنَّ هَذَا الْأَمْرَ شَرٌّ لِي فِي دِينِي وَمَعَاشِي وَعَاقِبَةِ أَمْرِي – أَوْ قَالَ: عَاجِلِهِ وَآجِلِهِ – فَاصْرِفْهُ عَنِّي وَاصْرِفْنِي عَنْهُ وَاقْدُرْ لِيَ الْخَيْرَ حَيْثُ كَانَ، ثُمَّ أَرْضِنِي بِهِ)).وَمَا نَدِمَ مَنِ اسْتَخَارَ الْخَالِقَ، وَشَاوَرَ الْمَخْلُوقِينَ الْمُؤْمِنِينَ وَتَثَبَّتَ فِي أَمْرِهِ، فَقَدْ قَالَ اللَّه تعالى: ﴿وَشاوِرْهُمْ فِي الْأَمْرِ فَإِذَا عَزَمْتَ فَتَوَكَّلْ عَلَى اللَّهِ﴾ ."
     }
    ]
   },
   {
    "id": 107,
    "title": "فضل الصلاة على النبي صلى الله عليه و سلم",
    "items": [
     {
      "id": 219,
      "text": "قَالَ النَّبِيُّ صلى الله عليه وسلم: ((مَنْ صَلَّى عَلَيَّ صَلاَةً صَلَّى اللَّهُ عَلَيْهِ بِهَا عَشْراً))."
     },
     {
      "id": 220,

     },

      "text": "وَقَالَ صلى الله عليه وسلم: ((الْبَخِيلُ مَنْ ذُكِرْتُ عِنْدَهُ فَلَمْ يُصَلِّ عَلَيَّ))."
     },
     {
      "id": 222,
      "text": "وَقَالَ صلى الله عليه وسلم:((إِنَّ لِلَّهِ مَلاَئِكَةً سَيَّاحِينَ فِي الْأَرْضِ يُبَلِّغُونِي مِنْ أُمَّتِي السَّلاَمَ))."
     },

      "text": "وَقَالَ صلى الله عليه وسلم: ((مَا مِنْ أَحَدٍ يُسَلِّمُ عَلَيَّ إِلاَّ رَدَّ اللَّهُ عَلَيَّ رُوحِيَ حَتَّى أَرُدَّ عَلَيْهِ السَّلاَمَ))."
     }

     },

     },
     {
      "id": 251,
      "text": "وَقَالَ صلى الله عليه وسلم: ((أَقْرَبُ مَا يَكُونُ الرَّبُّ مِنَ الْعَبْدِ فِي جَوْفِ اللَّيْلِ الآخِرِ فَإِنِ اسْتَطَعْتَ أَنْ تَكُونَ مِمَّنْ يَذْكُرُ اللَّهَ فِي تِلْكَ السَّاعَةِ فَكُنْ))."
     },
     {
      "id": 252,
      "text": "وَقَالَ صلى الله عليه وسلم: ((أَقْرَبُ مَا يَكُونُ الْعَبْدُ مِنْ رَبِّهِ وَهُوَ سَاجِدٌ فَأَكثِرُوا الدُّعَاءَ))."
     },

   {
    "id": 130,
    "title": "فضل التسبيح و التحميد، و التهليل، و التكبير",
    "items": [
     {
      "id": 254,
      "text": "قَالَ صلى الله عليه وسلم مَنْ قَالَ: سُبْحَانَ اللَّهِ وَبِحَمْدِهِ فِي يَوْمٍ مِائَةَ مَرَّةٍ حُطَّتْ خَطَايَاهُ وَلَوْ كَانَتْ مِثْلَ زَبَدِ الْبَحْر))."
     },
     {
      "id": 255,
      "text": "وَقَالَ صلى الله عليه وسلم: ((مَنْ قَالَ لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ، وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ عَشْرَ مِرَارٍ، كَانَ كَمَنْ أَعْتَقَ أَرْبَعَةَ أَنْفُسٍ مِنْ وَلَدِ إِسْمَاعِيلَ))."
     },
     {
      "id": 256,
      "text": "وَقَالَ صلى الله عليه وسلم: ((كَلِمَتَانِ خَفِيفَتَانِ عَلَى اللِّسَانِ، ثَقِيلَتَانِ فِي الْمِيزَانِ، حَبِيبَتَانِ إِلَى الرَّحْمَنِ: سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، سُبْحانَ اللَّهِ الْعَظِيمِ))."
     },
     {
      "id": 257,
      "text": "وَقَالَ صلى الله عليه وسلم: ((لَأَنْ أَقُولَ سُبْحَانَ اللَّهِ، وَالْحَمْدُ لِلَّهِ، وَلاَ إِلَهَ إِلاَّ اللَّهُ، وَاللَّهُ أَكْبَرُ، أَحَبُّ إِلَيَّ مِمَّا طَلَعَتْ عَلَيْهِ الشَّمسُ))."
     },
     {
      "id": 258,
      "text": "وَقَالَ صلى الله عليه وسلم: ((أَيَعْجِزُ أَحَدُكُم أَنْ يَكْسِبَ كُلَّ يَوْمٍ أَلْفَ حَسَنَةٍ)) فَسَأَلَهُ سَائِلٌ مِنْ جُلَسَائِهِ كَيْفَ يَكْسِبُ أَحَدُنَا أَلْفَ حَسَنَةٍ؟ قَالَ: ((يُسَبِّحُ مِائَةَ تَسْبِيحَةٍ، فَيُكتَبُ لَهُ أَلْفُ حَسَنَةٍ أَوْ يُحَطُّ عَنْهُ أَلْفُ خَطِيئَةٍ))."

      "text": "مَنْ قَالَ: سُبْحَانَ اللَّهِ الْعَظِيمِ وَبِحَمْدِهِ غُرِسَتْ لَهُ نَخْلَةٌ فِي الْجَنَّةِ."
     },
     {
      "id": 260,
      "text": "وَقَالَ صلى الله عليه وسلم: ((يَا عَبْدَ اللَّهِ بْنَ قَيْسٍ أَلاَ أَدُلُّكَ عَلَى كَنْزٍ مِنْ كُنُوزِ الْجَنَّةِ))؟ فَقُلْتُ: بَلَى يَا رَسُولَ اللَّهِ، قَالَ: ((قُلْ لاَ حَوْلَ وَلاَ قُوَّةَ إِلاَّ بِاللَّهِ))."
     },
     {
      "id": 261,
      "text": "وَقَالَ صلى الله عليه وسلم: ((أَحَبُّ الْكَلاَمِ إِلَى اللَّهِ أَرْبَعٌ: سُبْحَانَ اللَّهِ، وَالْحَمْدُ لِلَّهِ، وَلاَ إِلَهَ إِلاَّ اللَّهُ، وَاللَّهُ أَكْبَرُ، لاَ يَضُرُّكَ بِأَيِّهِنَّ بَدَأتَ))."
     },
     {
      "id": 262,
      "text": "جَاءَ أَعْرَابِيٌّ إِلَى رَسُولِ اللَّهِ صلى الله عليه وسلم فَقَالَ: عَلِّمْنِي كَلاماً أَقُولُهُ: قَالَ: ((قُلْ: لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، اللَّهُ أَكْبَرُ كَبِيراً، وَالْحَمْدُ لِلَّهِ كَثِيراً، سُبْحَانَ اللَّهِ رَبِّ العَالَمِينَ، لاَ حَوْلَ وَلاَ قُوَّةَ إِلاَّ بِاللَّهِ الْعَزِيزِ الْحَكِيمِ)) قَالَ: فَهَؤُلاَءِ لِرَبِّي، فَمَا لِي؟ قَالَ: ((قُلْ: اللَّهُمَّ اغْفِرْ لِي، وَارْحَمْنِي، وَاهْدِنِي، وَارْزُقْنِي))."
     },
     {
      "id": 263,
      "text": "كَانَ الرَّجُلُ إِذَا أَسْلَمَ عَلَّمَهُ النَّبيُّ صلى الله عليه وسلم الصَّلاَةَ ثُمَّ أَمَرَهُ أَنْ يَدْعُوَ بِهَؤُلاَءِ الْكَلِمَاتِ: ((اللَّهُمَّ اغْفِرِ لِي، وَارْحَمْنِي، وَاهْدِنِي، وَعَافِنِي وَارْزُقْنِي))."
     },
     {
      "id": 264,
      "text": "إِنَّ أَفْضَلَ الدُّعَاءِ الْحَمْدُ لِلَّهِ، وَأَفْضَلَ الذِّكْرِ لاَ إِلَهَ إِلاَّ اللَّهُ."
     },

     }

     },
     {

      "text": "مَنْ أَطْعَمَهُ اللَّهُ الطَّعَامَ فَلْيَقُلْ: اللَّهُمَّ بَارِكْ لَنَا فِيهِ وَأَطْعِمْنَا خَيْراً مِنْهُ، وَمَنْ سَقَاهُ اللَّهُ لَبَناً فَلْيَقُلْ اللَّهُمَّ بَارِكْ لَنَا فِيهِ وَزِدْنَا مِنْهُ."

 {

    "items": [
     {
      "id": 191,
      "text": "إِذَا تَزَوَّجَ أَحَدُكُمُ امْرَأَةً، أَوْ إِذَا اشْتَرَى خَادِماً فَلْيَقُلْ: ((اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَهَا، وَخَيْرَ مَا جَبَلْتَهَا عَلَيْهِ، وَأَعُوذُ بِكَ مِنْ شَرِّهَا، وَشَرِّ مَا جَبَلْتَهَا عَلَيْهِ، وَإِذَا اشْتَرَى بَعِيراً فَلْيَأْخُذْ بِذِرْوَةِ سَنَامِهِ وَلْيَقُلْ مِثْلَ ذَلِكَ))."
     }
    ]
   },
   {
    "id": 95,

     {

     },

      "text": "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَالْعَجْزِ وَالْكَسَلِ، وَالْبُخْلِ وَالْجُبْنِ، وَضَلَعِ الدَّيْنِ وَغَلَبَةِ الرِّجَالِ."

    "title": "دعاء من خاف ظلم السلطان",
    "items": [
     {
      "id": 129,
      "text": "اللَّهُمَّ ربَّ السَّمَوَاتِ السَّبْعِ، وَرَبَّ الْعَرْشِ الْعَظِيمِ، كُنْ لِي جَاراً مِنْ فُلاَنِ بْنِ فُلاَنٍ، وَأَحْزَابِهِ مِنْ خَلاَئِقِكَ، أَنْ يَفْرُطَ عَلَيَّ أَحَدٌ مِنْهُمْ أَوْ يَطْغَى، عَزَّ جَارُكَ، وَجَلَّ ثَنَاؤُكَ، وَلاَ إِلَهَ إِلاَّ أَنْتَ."
     },
     {
      "id": 130,
      "text": "اللَّهُ أَكْبَرُ، اللَّهُ أَعَزُّ مِنْ خَلْقِهِ جَمِيعاً، اللَّهُ أَعَزُّ مِمَّا أَخَافُ وَأَحْذَرُ، أَعُوذُ بِاللَّهِ الَّذِي لاَ إِلَهَ إِلاَّ هُوَ، الْمُمْسِكِ السَّمَوَاتِ السَّبْعِ أَنْ يَقَعْنَ عَلَى الْأَرْضِ إِلاَّ بِإِذْنِهِ، مِنْ شَرِّ عَبْدِكَ فُلاَنٍ، وَجُنُودِهِ وَأَتْبَاعِهِ وَأَشْيَاعِهِ، مِنْ الْجِنِّ وَالإِنْسِ، اللَّهُمَّ كُنْ لِي جَاراً مِنْ شَرِّهِمْ، جَلَّ ثَنَاؤُكَ وَعَزَّ جَارُكَ، وَتَبَارَكَ اسْمُكَ، وَلاَ إِلَهَ غَيْرُكَ (ثلاثَ مرَّاتٍ)."

   {
    "id": 128,
    "title": "ما يقول لرد كيد مردة الشياطين",
    "items": [
     {
      "id": 247,
      "text": "أَعُوذُ بكَلِمَاتِ اللَّهِ التَّامَّاتِ الَّتِي لاَ يُجَاوِزُهُنَّ بَرٌّ وَلاَ فَاجِرٌ: مِنْ شَرِّ مَا خَلَقَ، وَبَرَأَ وَذَرَأَ، وَمِنْ شَرِّ مَا يَنْزِلُ مِنَ السَّمَاءِ، وَمِنْ شَرِّ مَا يَعْرُجُ فيهَا، وَمِنْ شَرِّ مَا ذَرَأَ فِي الْأَرْضِ، وَمِنْ شَرِّ مَا يَخْرُجُ مِنْهَا، وَمِنْ شَرِّ فِتَنِ اللَّيْلِ وَالنَّهَارِ، وَمِنْ شَرِّ كُلِّ طَارِقٍ إِلاَّ طَارِقاً يَطْرُقُ بِخَيْرٍ يَا رَحْمَنُ."

      "text": "لاَ بأْسَ طَهُورٌ إِنْ شَاءَ اللَّهُ."

      "id": 148,
      "text": "أَسْأَلُ اللَّهَ الْعَظيمَ رَبَّ الْعَرْشِ الْعَظِيمِ أَنْ يَشْفيَكَ (سبع مرات)."

   },
   {
    "id": 50,
    "title": "فضل عيادة المريض",
    "items": [
     {
      "id": 149,
      "text": "قَالَ النَّبِيُّ صلى الله عليه وسلم: ((إِذَا عَادَ الرَّجُلُ أَخَاهُ الْمُسْلِمَ مَشَى فِي خِرَافَةِ الْجَنَّةِ حَتَّى يَجْلِسَ، فَإِذَا جَلَسَ غَمَرَتْهُ الرَّحْمَةُ، فَإِنْ كَانَ غُدْوَةً صَلَّى عَلَيْهِ سَبْعُونَ أَلْفَ مَلَكٍ حَتَّى يُمْسِيَ، وَإِنْ كَانَ مَسَاءً صَلَّى عَلَيْهِ سَبْعُونَ أَلْفَ مَلَكٍ حَتَّى يُصْبِحَ))."
     }
    ]
   },
   {
    "id": 51,
    "title": "دعاء المريض الذي يئس من حياته",
    "items": [
     {
      "id": 150,
      "text": "اللَّهُمَّ اغْفِرْ لِي، وَارْحَمْنِي، وَأَلْحِقْنِي بِالرَّفِيقِ الْأَعْلَى."
     },
     {
      "id": 151,
      "text": "جَعَلَ النَّبِيُّ صلى الله عليه وسلم عِنْدَ مَوْتِهِ يُدْخِلُ يَدَيْهِ فِي الْمَاءِ فَيَمْسَحُ بِهِمَا وَجْهَهُ، وَيَقُولُ: لاَ إِلَهَ إِلاَّ اللَّهُ إِنَّ لِلْمَوْتِ سَكَرَاتٍ."
     },
     {
      "id": 152,
      "text": "لاَ إِلَهَ إِلاَّ اللَّهُ وَاللَّهُ أَكْبَرُ، لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ، لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لاَ إِلَهَ إِلاَّ اللَّهُ لَهُ المُلْكُ وَلَهُ الْحَمْدُ، لاَ إِلَهَ إِلاَّ اللَّهُ وَلاَ حَوْلَ وَلاَ قُوَّةَ إِلاَّ بِاللَّهِ."
     }
    ]

   {
    "id": 52,
    "title": "تلقين المحتضر",

     {

      "text": "مَنْ كَانَ آخِرُ كَلاَمِهِ لاَ إِلَهَ إِلاَّ اللَّهُ دَخَلَ الْجَنَّةَ."

   },
   {
    "id": 53,
    "title": "دعاء من أصيب بمصيبة",
    "items": [

      "id": 154,
      "text": "إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ، اللَّهُمَّ أْجُرْنِي فِي مُصِيبَتِي، وَأَخْلِفْ لِي خَيْرَاً مِنْهَا."

   {
    "id": 54,
    "title": "الدعاء عند إغماض الميت",
    "items": [
     {
      "id": 155,
      "text": "اللَّهُمَّ اغْفِرْ لِفُلاَنٍ (بِاسْمِهِ) وَارْفَعْ دَرَجَتَهُ فِي الْمَهْدِيِّينَ، وَاخْلُفْهُ فِي عَقِبِهِ فِي الْغَابِرِينَ، وَاغْفِرْ لَنَا وَلَهُ  يَا رَبَّ الْعَالَمِينَ، وَافْسَحْ لَهُ فِي قَبْرِهِ، وَنَوِّرْ لَهُ فِيهِ."
     }
    ]
   },
   {
    "id": 55,
    "title": "الدعاء للميت في الصلاة عليه",
    "items": [
     {
      "id": 156,
      "text": "اللَّهُمَّ اغْفِرْ لَهُ وَارْحَمْهُ، وَعَافِهِ، وَاعْفُ عَنْهُ، وَأَكْرِمْ نُزُلَهُ، وَوَسِّعْ مُدْخَلَهُ، وَاغْسِلْهُ بِالْمَاءِ وَالثَّلْجِ وَالْبَرَدِ، وَنَقِّهِ مِنَ الْخَطَايَا كَمَا نَقَّيْتَ الثَّوْبَ الأَبْيَضَ مِنَ الدَّنَسِ، وَأَبْدِلْهُ دَاراً خَيْراً مِنْ دَارِهِ، وَأَهْلاً خَيْراً مِنْ أَهْلِهِ، وَزَوْجَاً خَيْراً مِنْ زَوْجِهِ، وَأَدْخِلْهُ الْجَنَّةَ، وَأَعِذْهُ مِنْ عَذَابِ القَبْرِ [وَعَذَابِ النَّارِ]."
     },
     {
      "id": 157,
      "text": "اللَّهُمَّ اغْفِرْ لِحَيِّنَا وَمَيِّتِنَا، وَشَاهِدِنَا وَغَائِبِنَا، وَصَغِيرِنَا وَكَبيرِنَا، وَذَكَرِنَا وَأُنْثَانَا. اللَّهُمَّ مَنْ أَحْيَيْتَهُ مِنَّا فَأَحْيِهِ عَلَى الْإِسْلاَمِ، وَمَنْ تَوَفَّيْتَهُ مِنَّا فَتَوَفَّهُ عَلَى الإِيمَانِ، اللَّهُمَّ لاَ تَحْرِمْنَا أَجْرَهُ، وَلاَ تُضِلَّنَا بَعْدَهُ."
     },
     {
      "id": 158,
      "text": "اللَّهُمَّ إِنَّ فُلاَنَ بْنَ فُلاَنٍ فِي ذِمَّتِكَ، وَحَبْلِ جِوَارِكَ، فَقِهِ مِنْ فِتْنَةِ الْقَبْرِ، وَعَذَابِ النَّارِ، وَأَنْتَ أَهْلُ الْوَفَاءِ وَالْحَقِّ، فَاغْفِرْ لَهُ وَارْحَمْهُ إِنَّكَ أَنْتَ الغَفُورُ الرَّحيمُ."
     },
     {
      "id": 159,
      "text": "اللَّهُمَّ عَبْدُكَ وَابْنُ أَمَتِكَ احْتَاجَ إِلَى رَحْمَتِكَ، وَأَنْتَ غَنِيٌّ عَنْ عَذَابِهِ، إِنْ كَانَ مُحْسِناً فَزِدْ فِي حَسَنَاتِهِ، وَإِنْ كَانَ مُسِيئاً فَتَجَاوَزْ عَنْهُ."
     }
    ]

   {

    "items": [
     {
      "id": 160,
      "text": "اللَّهُمَّ أَعِذْهُ مِنْ عَذَابِ القَبْرِ وإن قال: ((اللَّهُمَّ اجْعَلْهُ فَرَطاً وَذُخْراً لِوَالِدَيْهِ، وَشَفِيعاً مُجَاباً، اللَّهُمَّ ثَقِّلْ بِهِ مَوَازِينَهُمَا، وَأَعْظِمْ بِهِ أُجورَهُمَا، وَأَلْحِقْهُ بِصَالِحِ الْمُؤْمِنِينَ، وَاجْعَلْهُ فِي كَفَالَةِ إِبْرَاهِيمَ، وَقِهِ بِرَحْمَتِكَ عَذَابَ الْجَحِيمِ، وَأَبْدِلْهُ دَاراً خَيْراً مِنْ دَارِهِ، وَأَهْلاً خَيْراً مِنْ أَهْلِهِ، اللَّهُمَّ اغْفِرْ لِأَسْلاَفِنَا، وَأَفْرَاطِنَا، وَمَنْ سَبَقَنَا بِالْإِيمَانِ)) إن قال ذلك فَحَسَنٌ."
     },
     {

     {
      "id": 164,
      "text": "اللَّهُمَّ اغْفِرْ لَهُ، اللَّهُمَّ ثَبِّتْهُ."
     }
    ]
   },
   {
    "id": 60,
    "title": "دعاء زيارة القبور",
    "items": [
     {
      "id": 165,
      "text": "السَّلاَمُ عَلَيْكُمْ أَهْلَ الدِّيَارِ، مِنَ الْمُؤْمِنِينَ وَالْمُسْلِمِينَ، وَإِنَّا إِنْ شَاءَ اللَّهُ بِكُمْ لاَحِقُونَ، [وَيَرْحَمُ اللَّهُ الْمُسْتَقدِمِينَ مِنَّا وَالْمُسْتأْخِرِينَ] أَسْاَلُ اللَّهَ لَنَا وَلَكُمُ الْعَافِيَةَ."
     }
    ]
   },
   {
    "id": 57,
    "title": "دعاء التعزية",
    "items": [
     {
      "id": 162,
      "text": "إِنَّ للَّهِ مَا أَخَذَ، وَلَهُ مَا أَعْطَى، وَكُلُّ شَيْءٍ عِنْدَهُ بِأَجَلٍ مُسَمَّى... فَلْتَصْبِرْ وَلْتَحْتَسِبْ. وَإِنْ قَالَ: ((أَعْظَمَ اللَّهُ أَجْرَكَ، وَأَحْسَنَ عَزَاءَكَ، وَغَفَرَ لِمَيِّتِكَ)) فَحَسَنٌ."
     }
    ]
   },
   {
    "id": 84,
    "title": "ما يقال في اﻟﻤﺠلس",
    "items": [
     {
      "id": 195,
      "text": "((عَنِ ابْنِ عُمَرَ رضي الله عنه قَاَلَ: كَانَ يُعَدُّ لِرَسُولِ اللَّهِ صلى الله عليه وسلم فِي الْمَجْلِسِ الوَاحِدِ مِائَةُ مَرَّةٍ مِنْ قَبْلِ أَنْ يَقُومَ: ((رَبِّ اغْفِرْ لِي، وَتُبْ عَلَيَّ، إِنَّكَ أَنْتَ التَّوَّابُ الغَفُورُ))."
     }
    ]
   }
  ]
 },
 {
  "name": "الحج والعمرة",
  "chapters": [
   {
    "id": 115,
    "title": "كيف يلبي المحرم في الحج أو العمرة ؟",
    "items": [
     {
      "id": 233,
      "text": "لَبَّيْكَ اللَّهُمَّ لَبَّيْكَ، لَبَّيْكَ لاَ شَرِيكَ لَكَ لَبَّيْكَ، إِنَّ الْحَمْدَ، وَالنِّعْمَةَ، لَكَ وَالْمُلْكَ، لاَ شَرِيكَ لَكَ."
     }
    ]
   },
   {
    "id": 116,
    "title": "التكبير إذا أتى الركن الأسود",
    "items": [
     {
      "id": 234,
      "text": "طَافَ النَّبيُّ صلى الله عليه وسلم بِالْبَيْتِ عَلَى بَعِيرٍ كُلَّمَا أَتَى الرُّكْنَ أَشَارَ إِلَيْهِ بِشَيْءٍ عِنْدَهُ وَكَبَّرَ."
     }
    ]
   },
   {
    "id": 117,
    "title": "الدعاء بين الركن اليماني والحجر الأسود",
    "items": [
     {
      "id": 235,
      "text": "﴿رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ﴾"
     }
    ]
   },
   {
    "id": 118,
    "title": "دعاء الوقوف على الصفا والمروة",
    "items": [
     {
      "id": 236,
      "text": "لَمَّا دَنَا النَّبِيُّ صلى الله عليه وسلم مِنَ الصَّفَا قَرَأَ: ﴿إِنَّ الصَّفَا وَالْمَرْوَةَ مِنْ شَعَآئِرِ اللَّهِ﴾ أَبْدَأُ بِمَا بَدَأَ اللَّهُ بِهِ)) فَبَدَأَ بِالصَّفَا فَرَقِيَ عَلَيْهِ حَتَّى رَأَى الْبَيْتَ، فَاسْتَقْبَلَ الْقِبْلَةَ، فَوَحَّدَ اللَّهَ وَكبَّرَهُ وَقَالَ: ((لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ، أَنْجَزَ وَعْدَهُ، وَنَصَرَ عَبْدَهُ، وَهَزَمَ الْأَحْزَابَ وَحْدَهُ، ثُمَّ دَعَا بَيْنَ ذلكَ. قَالَ مِثْلَ هَذَا ثَلاَثَ مَرَّاتٍ)) الْحَدِيثُ. وَفِيهِ: ((فَفَعَلَ عَلَى الْمَرْوَةِ كَمَا فَعَلَ عَلَى الصَّفَا))."
     }
    ]
   },
   {
    "id": 119,
    "title": "الدعاء يوم عرفة",
    "items": [
     {
      "id": 237,
      "text": "قَالَ النَّبِيُّ صلى الله عليه وسلم: ((خَيْرُ الدُّعَاءِ دُعَاءُ يَوْمِ عَرَفَةَ، وَخَيْرُ مَا قُلْتُ أَنَا وَالنَّبيُّونَ مِنْ قَبْلِي: لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ))."
     }
    ]
   },
   {
    "id": 120,
    "title": "الذكر عند المشعر الحرام",
    "items": [
     {
      "id": 238,
      "text": "رَكِبَ النَّبِيُّ صلى الله عليه وسلم الْقَصْوَاءَ حَتَّى أَتَى الْمَشْعَرَ الْحَرَامَ فَاسْتَقْبَلَ الْقِبْلَةَ (فَدَعَاهُ، وَكَبَّرَهُ، وَهَللَّهُ، وَوَحَّدَهُ) فَلَمْ يَزَلْ وَاقِفاً حَتَّى أَسْفَرَ جِدَّاً فَدَفَعَ قَبْلَ أَنْ تَطْلُعَ الشَّمسُ."
     }
    ]
   },
   {
    "id": 121,
    "title": "التكبير عند رمي الجمار مع كل حصاة",
    "items": [
     {
      "id": 239,
      "text": "يُكَبِّرُ كُلَّمَا رَمَى بِحَصَاةٍ عِنْدَ الْجِمَارِ الثَّلاَثِ، ثُمَّ يَتَقَدَّمُ، ويَقِفُ يَدْعُو مُسْتَقْبِلَ الْقِبلَةِ، رَافِعاً يَدَيْهِ بَعْدَ الْجَمْرَةِ الْأُولَى وَالثَّانِيَةِ. أَمَّا جَمْرَةُ الْعَقَبَةِ فَيَرْمِيهَا وَيُكَبِّرُ عِنْدَ كُلِّ حَصَاةٍ وَيَنْصَرِفُ وَلاَ يَقِفُ عِنْدَهَا."
     }
    ]
   }
  ]
 },
 {
  "name": "في المجلس وبين الناس",
  "chapters": [
   {
    "id": 108,
    "title": "إفشاء السلام",
    "items": [
     {
      "id": 224,
      "text": "قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم: ((لاَ تَدْخُلُوا الْجَنَّةَ حَتَّى تُؤْمِنُوا، وَلاَ تُؤْمِنُوا حَتَّى تَحَابُّوا، أَوَلاَ أَدُلُّكُم عَلَى شَيْءٍ إِذَا فَعَلْتُمُوهُ تَحَابَبْتُم، أَفْشُوا السَّلاَمَ بَيْنَكُمْ))."
     },
     {
      "id": 225,
      "text": "ثَلاَثٌ مَنْ جَمَعَهُنَّ فَقَدْ جَمَعَ الْإِيمَانَ: الْإِنْصَافُ مِنْ نَفْسِكَ، وَبَذْلُ السَّلاَمِ لِلْعَالَمِ، وَالْإِنْفَاقُ مِنَ الإِقْتَارِ."
     },
     {
      "id": 226,
      "text": "وَعَنْ عَبْدِ اللَّهِ بْنِ عُمَرَ رَضِيَ اللَّهُ عَنْهُمَا: أنَّ رَجُلاً سَأَلَ النَّبِيَّ صلى الله عليه وسلم أيُّ الْإِسْلاَمِ خَيْرٌ قَالَ: ((تُطْعِمُ الطَّعَامَ، وَتَقْرأُ السَّلاَمَ عَلَى مَنْ عَرَفْتَ وَمَنْ لَمْ تَعْرِفْ))."
     }
    ]
   },
   {
    "id": 109,
    "title": "كيف يرد السلام على الكافر إذا سلم",
    "items": [
     {
      "id": 227,
      "text": "إذَا سَلَّمَ عَلَيْكُمْ أَهْلُ الْكِتَابِ فَقُولُوا: وَعَلَيْكُمْ."
     }
    ]
   },
   {
    "id": 77,
    "title": "دعاء العطاس",
    "items": [
     {
      "id": 188,
      "text": "إِذَا عَطَسَ أَحَدُكُم فَلْيَقُلِ الْحَمْدُ لِلَّهِ، وَلْيَقُلْ لَهُ أَخُوهُ أَوْ صَاحِبُهُ: يَرْحَمُكَ اللَّهُ، فَإِذَا قَالَ لَهُ: يَرحَمُكَ اللَّهُ، فَلْيَقُلْ: يَهْدِيكُمُ اللَّهُ وَيُصْلِحُ بَالَكُمْ."
     }
    ]
   },
   {
    "id": 78,
    "title": "ما يقال للكافر إذا عطس فحمد الله",
    "items": [
     {
      "id": 189,
      "text": "يَهْدِيكُمُ اللَّهُ وَيُصْلِحُ بَالَكُمْ."
     }
    ]
   },
   {
    "id": 86,
    "title": "الدعاء لمن قال غفر الله لك",
    "items": [
     {
      "id": 197,
      "text": "وَلَكَ."
     }
    ]
   },
   {
    "id": 87,
    "title": "الدعاء لمن صنع إليك معروفا",
    "items": [

      "text": "جَزَاكَ اللَّهُ خَيْراً."

   },
   {

    "title": "الدعاء لمن قال إني أحبك في الله",
    "items": [

      "text": "أَحَبَّكَ الَّذِي أَحْبَبْتَنِي لَهُ."

   {

    "title": "الدعاء لمن عرض عليك ماله",
    "items": [

      "id": 201,
      "text": "بَارَكَ اللَّهُ لَكَ فِي أَهْلِكَ وَمَالِكَ."

   {

    "title": "الدعاء لمن أقرض عند القضاء",
    "items": [

      "text": "بارَكَ اللَّهُ لَكَ فِي أَهْلِكَ وَمَالِكَ، إِنَّمَا جَزَاءُ السَّلَفِ الْحَمْدُ وَالأَدَاءُ."

   },

    "title": "الدعاء لمن قال بارك الله فيك",
    "items": [

    "title": "الدعاء لمن سببته",
    "items": [

      "id": 230,
      "text": "قَالَ النَّبِيُّ صلى الله عليه وسلم: ((اللَّهُمَّ فَأَيُّمَا مُؤْمِنٍ سَبَبْتُهُ فَاجْعَلْ ذَلِكَ لَهُ قُرْبَةً إِلَيْكَ يَوْمَ الْقِيَامَةِ))."

   },
   {
    "id": 113,
    "title": "ما يقول المسلم إذا مدح المسلم",
    "items": [
     {
      "id": 231,
      "text": "قَالَ النَّبِيُّ صلى الله عليه وسلم: ((إِذَا كَانَ أَحَدُكُم مَادِحاً صَاحِبَهُ لاَ مَحَالَةَ فَلْيَقُلْ: أَحْسِبُ فُلاَناً وَاللَّهُ حَسِيبُهُ، وَلاَ أُزَكِّي عَلَى اللَّهِ أَحَداً، أَحْسِبُهُ – إِنْ كَانَ يَعْلَمُ ذَاكَ – كَذَا وَكَذَا))."
     }
    ]
   },
   {
    "id": 114,
    "title": "ما يقول المسلم إذا زكي",
    "items": [
     {
      "id": 232,
      "text": "اللَّهُمَّ لاَ تُؤَاخِذْنِي بِمَا يَقُولُونَ، وَاغْفِرْ لِي مَا لاَ يَعْلَمُونَ، [وَاجْعَلْنِي خَيْراً مِمَّا يَظُّنُّونَ]."
     }
    ]
   },
   {
    "id": 106,
    "title": "ما يقول من أتاه أمر يسره أو يكرهه",
    "items": [
     {
      "id": 218,
      "text": "كَانَ النَّبِيُّ صلى الله عليه وسلم إِذَا أَتَاهُ الْأَمْرُ يَسُرُّهُ قَالَ: ((الْحَمْدُ لِلَّهِ الَّذِي بِنِعْمَتِهِ تَتِمُّ الصَّالِحَاتُ)) وَإِذَا أَتَاهُ الْأَمْرُ يَكْرَهُهُ قَالَ: ((الْحَمْدُ لِلَّهِ عَلَى كُلِّ حَالٍ))."
     }
    ]
   },
   {
    "id": 122,
    "title": "دعاء التعجب والأمر السار",
    "items": [
     {
      "id": 240,
      "text": "سُبْحَانَ اللَّهِ!."

      "text": "اللَّهُ أَكْبَرُ!."

   },
   {
    "id": 123,
    "title": "ما يفعل من أتاه أمر يسره",
    "items": [
     {
      "id": 242,
      "text": "كَانَ النَّبيُّ صلى الله عليه وسلم إِذَا أَتَاهُ أَمْرٌ يَسُرُّهُ أَوْ يُسَرُّ بِهِ خَرَّ سَاجِداً شُكْراً لِلَّهِ تَبَارَكَ وَتَعَالَى."
     }
    ]
   },
   {
    "id": 79,
    "title": "الدعاء للمتزوج",
    "items": [
     {
      "id": 190,
      "text": "بَارَكَ اللَّهُ لَكَ، وَبَارَكَ عَلَيْكَ، وَجَمَعَ بَيْنَكُمَا فِي خَيْرٍ."
     }
    ]
   },
   {
    "id": 81,
    "title": "الدعاء قبل إتيان الزوجة",
    "items": [
     {
      "id": 192,
      "text": "بِسْمِ اللَّهِ، اللَّهُمَّ جَنِّبْنَا الشَّيْطَانَ، وَجَنِّبِ الشَّيْطَانَ مَا رَزَقْتَنَا."
     }
    ]
   },
   {
    "id": 85,
    "title": "كفارة اﻟﻤﺠلس",
    "items": [

      "text": "سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ، أَشْهَدُ أَنْ لاَ إِلَهَ إِلاَّ أَنْتَ، أَسْتَغْفِرُكَ وَأَتُوبُ إِلَيْكَ."
     }
    ]
   }
  ]
 },
 {
  "name": "الطقس والطبيعة",
  "chapters": [
   {

    "title": "من أدعية الاستسقاء",
    "items": [
     {
      "id": 169,
      "text": "اللَّهُمَّ اسْقِنَا غَيْثاً مُغِيثاً مَرِيئاً مَرِيعاً، نَافِعاً غَيْرَ ضَارٍّ، عَاجِلاً غَيْرَ آجِلٍ."
     },
     {
      "id": 170,
      "text": "اللَّهُمَّ أَغِثْنَا، اللَّهُمَّ أَغِثْنَا، اللَّهُمَّ أَغِثْنَا."
     },
     {

      "text": "اللَّهُمَّ اسْقِ عِبَادَكَ، وَبَهَائِمَكَ، وَانْشُرْ رَحْمَتَكَ، وَأَحْيِي بَلَدَكَ الْمَيِّتَ."
     }
    ]
   },
   {
    "id": 61,
    "title": "دعاء الريح",
    "items": [
     {
      "id": 166,
      "text": "اللَّهُمَّ إِنِّي أَسْــــــأَلُكَ خَيْرَهَا، وَأَعُوذُ بِكَ مِنْ شَرِّهَا."
     },

  "text": "قَالَ جَابرُ بْنُ عَبْدِ اللَّهِ رَضِيَ اللَّهُ عَنْهُمَا: كَانَ رسُولُ اللَّهِ صلى الله عليه وسلم يُعَلِّمُنَا الْاسْتِخَارَةَ فِي الْأُمُورِ كُلِّهَا كَمَا يُعَلِّمُنَا السُّورَةَ مِنَ الْقُرْآنِ، يَقُولُ: ((إِذَا هَمَّ أَحَدُكُمْ بِالْأَمْرِ فَلْيَرْكَعْ رَكْعَتَيْنِ مِنْ غَيْرِ الْفَرِيضَةِ، ثُمَّ لْيَقُلْ: اللَّهُمَّ إِنِّي أَسْتَخِيرُكَ بِعِلْمِكَ، وَأَسْتَقْدِرُكَ بِقُدْرَتِكَ، وَأَسْأَلُكَ مِنْ فَضْلِكَ العَظِيمِ؛ فَإِنَّكَ تَقْدِرُ وَلاَ أَقْدِرُ، وَتَعْلَمُ وَلاَ أَعْلَمُ، وَأَنْتَ عَلاَّمُ الغُيُوبِ، اللَّهُمَّ إِنْ كُنْتَ تَعْلَمُ أَنَّ هَذَا الأمْرَ - وَيُسَمِّي حَاجَتَهُ - خَيْرٌ لِي فِي دِينِي وَمَعَاشِي وَعَاقِبَةِ أَمْرِي – أَوْ قَالَ: عَاجِلِهِ وَآجِلِهِ - فَاقْدُرْهُ لِي وَيَسِّرْهُ لِي ثمَّ بَارِكْ لِي فِيهِ، وَإِنْ كُنْتَ تَعْلَمُ أَنَّ هَذَا الْأَمْرَ شَرٌّ لِي فِي دِينِي وَمَعَاشِي وَعَاقِبَةِ أَمْرِي – أَوْ قَالَ: عَاجِلِهِ وَآجِلِهِ – فَاصْرِفْهُ عَنِّي وَاصْرِفْنِي عَنْهُ وَاقْدُرْ لِيَ الْخَيْرَ حَيْثُ كَانَ، ثُمَّ أَرْضِنِي بِهِ)).وَمَا نَدِمَ مَنِ اسْتَخَارَ الْخَالِقَ، وَشَاوَرَ الْمَخْلُوقِينَ الْمُؤْمِنِينَ وَتَثَبَّتَ فِي أَمْرِهِ، فَقَدْ قَالَ اللَّه تعالى: ﴿وَشاوِرْهُمْ فِي الْأَمْرِ فَإِذَا عَزَمْتَ فَتَوَكَّلْ عَلَى اللَّهِ﴾ .",

  "text": "((عَنِ ابْنِ عُمَرَ رضي الله عنه قَاَلَ: كَانَ يُعَدُّ لِرَسُولِ اللَّهِ صلى الله عليه وسلم فِي الْمَجْلِسِ الوَاحِدِ مِائَةُ مَرَّةٍ مِنْ قَبْلِ أَنْ يَقُومَ: ((رَبِّ اغْفِرْ لِي، وَتُبْ عَلَيَّ، إِنَّكَ أَنْتَ التَّوَّابُ الغَفُورُ)).",

  "chapter": "ما يقال في اﻟﻤﺠلس",
  "chapterId": 84,
  "itemId": 195
 },
 {
  "text": "لَبَّيْكَ اللَّهُمَّ لَبَّيْكَ، لَبَّيْكَ لاَ شَرِيكَ لَكَ لَبَّيْكَ، إِنَّ الْحَمْدَ، وَالنِّعْمَةَ، لَكَ وَالْمُلْكَ، لاَ شَرِيكَ لَكَ.",
  "category": "الحج والعمرة",
  "chapter": "كيف يلبي المحرم في الحج أو العمرة ؟",
  "chapterId": 115,
  "itemId": 233
 },
 {
  "text": "طَافَ النَّبيُّ صلى الله عليه وسلم بِالْبَيْتِ عَلَى بَعِيرٍ كُلَّمَا أَتَى الرُّكْنَ أَشَارَ إِلَيْهِ بِشَيْءٍ عِنْدَهُ وَكَبَّرَ.",
  "category": "الحج والعمرة",
  "chapter": "التكبير إذا أتى الركن الأسود",
  "chapterId": 116,
  "itemId": 234
 },
 {
  "text": "‏﴿رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ﴾‏",

  "chapter": "الدعاء بين الركن اليماني والحجر الأسود",
  "chapterId": 117,
  "itemId": 235
 },
 {
  "text": "لَمَّا دَنَا النَّبِيُّ صلى الله عليه وسلم مِنَ الصَّفَا قَرَأَ: ﴿إِنَّ الصَّفَا وَالْمَرْوَةَ مِنْ شَعَآئِرِ اللَّهِ﴾ أَبْدَأُ بِمَا بَدَأَ اللَّهُ بِهِ)) فَبَدَأَ بِالصَّفَا فَرَقِيَ عَلَيْهِ حَتَّى رَأَى الْبَيْتَ، فَاسْتَقْبَلَ الْقِبْلَةَ، فَوَحَّدَ اللَّهَ وَكبَّرَهُ وَقَالَ: ((لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ، أَنْجَزَ وَعْدَهُ، وَنَصَرَ عَبْدَهُ، وَهَزَمَ الْأَحْزَابَ وَحْدَهُ، ثُمَّ دَعَا بَيْنَ ذلكَ. قَالَ مِثْلَ هَذَا ثَلاَثَ مَرَّاتٍ)) الْحَدِيثُ. وَفِيهِ: ((فَفَعَلَ عَلَى الْمَرْوَةِ كَمَا فَعَلَ عَلَى الصَّفَا)).",
  "category": "الحج والعمرة",
  "chapter": "دعاء الوقوف على الصفا والمروة",
  "chapterId": 118,
  "itemId": 236
 },
 {
  "text": "قَالَ النَّبِيُّ صلى الله عليه وسلم: ((خَيْرُ الدُّعَاءِ دُعَاءُ يَوْمِ عَرَفَةَ، وَخَيْرُ مَا قُلْتُ أَنَا وَالنَّبيُّونَ مِنْ قَبْلِي: لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ)).",

  "itemId": 237
 },
 {

 },
 {

 },
 {

  "chapterId": 108,

 },
 {

  "itemId": 225
 },
 {

  "category": "في المجلس وبين الناس",
  "chapter": "إفشاء السلام",
  "chapterId": 108,
  "itemId": 226
 },
 {

  "chapterId": 109,
  "itemId": 227
 },
 {

 },

 {

 {

 },
 {

 },
 {

 },
 {

 {

 {

 {

 },
 {

 {

 },

 },
 {
